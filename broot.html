<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b13">
<title>HeartLink — знакомства</title>
<style>
/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0d0b13;
  --card:#1b1729;
  --card-2:#241e35;
  --text:#f4f1fa;
  --muted:#9b93b2;
  --accent:#ff4d79;
  --accent2:#ff8a5b;
  --green:#28d17c;
  --danger:#ff5f5f;
  --border:rgba(255,255,255,.09);
  --radius:24px;
}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color:var(--text);
  background-color:#0d0b13;
  background-image:
    radial-gradient(900px 520px at 12% -12%, rgba(255,77,121,.25), transparent 62%),
    radial-gradient(820px 520px at 92% -4%, rgba(122,86,255,.22), transparent 62%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:16px;}
img{display:block;}
h1,h2,h3{margin:0;}
.muted-text{color:var(--muted);font-size:14.5px;line-height:1.5;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{max-width:520px;margin:0 auto;padding:0 0 110px;min-height:100%;}
#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 14px;
  background:linear-gradient(180deg, rgba(13,11,19,.96) 65%, rgba(13,11,19,0));
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.logo{
  font-weight:800;font-size:19px;letter-spacing:.3px;
  background:linear-gradient(90deg,#ff4d79,#ff8a5b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.top-emoji{font-size:20px;}

/* bottom nav */
#bottomNav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(520px,100%);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(20,16,30,.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  z-index:60;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;border-radius:16px;color:var(--muted);
  transition:background .2s, color .2s, transform .15s;
}
.nav-btn span{font-size:20px;line-height:1;transition:transform .2s;}
.nav-btn em{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.1px;}
.nav-btn.active{color:#fff;background:rgba(255,77,121,.14);}
.nav-btn.active span{transform:translateY(-1px) scale(1.12);}
.nav-btn:active{transform:scale(.94);}

/* ============================================================
   FILTERS
   ============================================================ */
.filters{padding:0 16px 14px;}
.filters-toggle{
  width:100%;padding:13px 16px;border-radius:18px;
  background:var(--card);border:1px solid var(--border);
  font-size:14px;font-weight:600;color:#d8d3e6;text-align:left;
  display:flex;align-items:center;justify-content:space-between;
  transition:transform .15s;
}
.filters-toggle:active{transform:scale(.98);}
.filters-toggle .chev{transition:transform .25s;color:var(--muted);font-size:12px;}
.filters.open .filters-toggle .chev{transform:rotate(180deg);}
.filters-body{
  display:none;flex-direction:column;gap:11px;
  margin-top:11px;padding:16px;border-radius:20px;
  background:var(--card);border:1px solid var(--border);
  animation:cardIn .3s ease;
}
.filters.open .filters-body{display:flex;}

/* ============================================================
   DECK / CARD
   ============================================================ */
.deck{padding:0 16px;}
.card{
  position:relative;border-radius:28px;overflow:hidden;
  background:var(--card);border:1px solid var(--border);
  box-shadow:0 24px 60px rgba(0,0,0,.55);
  animation:cardIn .42s cubic-bezier(.2,.8,.25,1);
  will-change:transform,opacity;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:none;}}
.card.fly-right{animation:flyRight .32s ease forwards;}
@keyframes flyRight{to{opacity:0;transform:translateX(125%) rotate(14deg);}}
.card-photo{position:relative;height:clamp(260px,46vh,430px);background:var(--card-2);}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.photo-shade{position:absolute;left:0;right:0;bottom:0;height:45%;
  background:linear-gradient(180deg,transparent,rgba(20,16,30,.92));pointer-events:none;}
.card-counter{
  position:absolute;top:12px;right:12px;padding:5px 11px;border-radius:20px;
  font-size:12px;font-weight:600;background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.card-body{padding:16px 18px 20px;}
.card-body h2{font-size:23px;font-weight:800;line-height:1.15;}
.card-city{color:var(--muted);font-size:13.5px;margin-top:4px;}
.card-desc{margin:11px 0 0;font-size:14.5px;line-height:1.5;color:#d8d3e6;}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.tag{font-size:12px;padding:5px 11px;border-radius:20px;
  background:rgba(255,77,121,.13);color:#ff9db6;font-weight:600;}

.deck-actions{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:20px;}
.act{
  width:64px;height:64px;border-radius:50%;font-size:26px;
  display:grid;place-items:center;
  background:var(--card);border:1px solid var(--border);
  box-shadow:0 10px 26px rgba(0,0,0,.45);
  transition:transform .16s ease, box-shadow .2s;
}
.act:active{transform:scale(.9);}
.act-like{background:linear-gradient(135deg,#ff4d79,#ff7a4d);border-color:transparent;
  box-shadow:0 12px 30px rgba(255,77,121,.45);}
.act-skip{width:52px;height:52px;font-size:18px;color:var(--muted);}
.act-comment{background:var(--card-2);}
.btn-open-profile{
  display:block;width:100%;margin:16px 0 0;padding:14px;border-radius:18px;
  background:var(--card);border:1px solid var(--border);
  font-weight:600;font-size:15px;color:#d8d3e6;transition:transform .15s;
}
.btn-open-profile:active{transform:scale(.98);}

/* ============================================================
   TABS / GRID / MINI CARDS
   ============================================================ */
.tabs{display:flex;gap:7px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:9px 16px;border-radius:20px;background:var(--card);
  border:1px solid var(--border);color:var(--muted);
  font-size:13.5px;font-weight:600;white-space:nowrap;transition:.2s;
}
.tab.active{background:linear-gradient(135deg,#ff4d79,#ff7a4d);color:#fff;border-color:transparent;}
.tab:active{transform:scale(.95);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px;}
.mini{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  overflow:hidden;animation:cardIn .35s ease;
}
.mini-photo{height:168px;background:var(--card-2);}
.mini-photo img{width:100%;height:100%;object-fit:cover;}
.mini-body{padding:10px 12px 6px;}
.mini-name{font-weight:700;font-size:14.5px;}
.mini-city{font-size:12px;color:var(--muted);margin-top:2px;}
.mini-actions{display:flex;gap:6px;padding:8px 10px 10px;}
.mini-actions button{
  flex:1;padding:9px;border-radius:12px;background:var(--card-2);
  font-size:15px;transition:transform .15s;
}
.mini-actions button:active{transform:scale(.93);}

/* ============================================================
   MY PROFILE
   ============================================================ */
.me{padding:0 16px;}
.me-photo{
  position:relative;border-radius:26px;overflow:hidden;
  height:clamp(240px,40vh,380px);background:var(--card-2);
  border:1px solid var(--border);
}
.me-photo img{width:100%;height:100%;object-fit:cover;}
.me-info{margin-top:16px;}
.me-info h2{font-size:24px;font-weight:800;}
.me-info .city{color:var(--muted);font-size:14px;margin-top:4px;}
.me-info .desc{margin-top:12px;font-size:14.5px;line-height:1.55;color:#d8d3e6;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;text-align:center;}
.stat b{
  display:block;font-size:26px;font-weight:800;
  background:linear-gradient(90deg,#ff4d79,#ff8a5b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat span{font-size:12.5px;color:var(--muted);}
.actions-col{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

/* ============================================================
   PROFILE VIEW
   ============================================================ */
.pv{padding:0 16px;}
.pv-photo{
  position:relative;border-radius:26px;overflow:hidden;
  height:clamp(300px,52vh,520px);background:var(--card-2);
  border:1px solid var(--border);
}
.pv-photo img{width:100%;height:100%;object-fit:cover;}
.pv-back{
  position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;font-size:18px;z-index:3;
}
.pv-body{padding:18px 4px 0;}
.pv-body h2{font-size:25px;font-weight:800;}
.pv-body .city{color:var(--muted);font-size:14px;margin-top:4px;}
.pv-body .desc{margin-top:13px;font-size:15px;line-height:1.55;color:#d8d3e6;}

/* ============================================================
   FORMS
   ============================================================ */
.form{display:flex;flex-direction:column;gap:12px;}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;}
.form input,.form textarea,.form select{
  width:100%;padding:13px 14px;border-radius:14px;
  background-color:rgba(255,255,255,.05);
  border:1px solid var(--border);color:var(--text);
  outline:none;transition:border-color .2s, background .2s;
}
.form input:focus,.form textarea:focus,.form select:focus{
  border-color:var(--accent);background-color:rgba(255,77,121,.07);
}
.form textarea{resize:vertical;min-height:80px;}
.form select{
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#9b93b2 50%),
                   linear-gradient(135deg,#9b93b2 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:38px;
}
option{background:#1b1729;color:#f4f1fa;}
.form .check{flex-direction:row;align-items:center;gap:9px;font-size:13.5px;color:#d8d3e6;}
.form .check input{width:18px;height:18px;accent-color:#ff4d79;padding:0;}

.btn-primary{
  width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:15.5px;color:#fff;
  background:linear-gradient(135deg,#ff4d79,#ff7a4d);
  box-shadow:0 12px 28px rgba(255,77,121,.35);
  transition:transform .16s;
}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.55;}
.btn-ghost{
  width:100%;padding:15px;border-radius:16px;font-weight:600;font-size:15px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);color:#d8d3e6;
  transition:transform .16s;
}
.btn-ghost:active{transform:scale(.97);}

.photo-picker{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px;}
.photo-picker img{
  width:130px;height:130px;border-radius:50%;object-fit:cover;
  border:3px solid rgba(255,77,121,.4);background:var(--card-2);
}
.photo-btn{
  padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.07);
  border:1px solid var(--border);font-size:13.5px;font-weight:600;cursor:pointer;
  transition:transform .15s;
}
.photo-btn:active{transform:scale(.96);}

/* ============================================================
   MODALS
   ============================================================ */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(5,4,10,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transition:opacity .22s ease;
}
.modal-backdrop.show{opacity:1;}
.modal{
  width:min(520px,100%);max-height:92vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:#171323;border:1px solid var(--border);
  border-radius:26px 26px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(26px);
  transition:transform .28s cubic-bezier(.2,.8,.25,1);
}
.modal-backdrop.show .modal{transform:none;}
@media (min-width:640px){
  .modal-backdrop{align-items:center;padding:24px;}
  .modal{border-radius:26px;max-height:88vh;}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.modal-head h3{font-size:18px;font-weight:800;}
.modal-close{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.07);font-size:15px;color:var(--muted);
  display:grid;place-items:center;transition:transform .15s;
}
.modal-close:active{transform:scale(.9);}
.modal-foot{margin-top:16px;}
.err{color:var(--danger);font-size:13px;min-height:16px;font-weight:600;}

.comment-target{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
.comment-target img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--card-2);}
.comment-target b{display:block;font-size:15px;}
.comment-target span{font-size:12.5px;color:var(--muted);}
.counter{text-align:right;font-size:12px;color:var(--muted);margin-top:6px;}

.match-box{text-align:center;padding:6px 0 0;}
.match-heart{font-size:64px;line-height:1;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.16);}}
.match-box h2{margin:12px 0 6px;font-size:23px;font-weight:800;}
.match-box p{margin:0 0 16px;color:var(--muted);font-size:14px;}
.match-photo{
  width:120px;height:120px;border-radius:50%;object-fit:cover;
  margin:0 auto;border:3px solid rgba(40,209,124,.55);background:var(--card-2);
}
.match-name{margin-top:10px;font-weight:700;font-size:16px;}

/* ============================================================
   AUTH OVERLAY
   ============================================================ */
.auth-overlay{
  position:fixed;inset:0;z-index:150;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background-color:#0d0b13;
  background-image:
    radial-gradient(900px 520px at 12% -12%, rgba(255,77,121,.25), transparent 62%),
    radial-gradient(820px 520px at 92% -4%, rgba(122,86,255,.22), transparent 62%);
  padding:32px 18px calc(44px + env(safe-area-inset-bottom,0px));
}
.auth-card{max-width:480px;margin:0 auto;}
.auth-logo{font-size:54px;text-align:center;line-height:1;}
.auth-card h1{text-align:center;margin:8px 0 6px;font-size:27px;font-weight:800;}
.auth-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 24px;}

/* ============================================================
   TOASTS / EMPTY
   ============================================================ */
#toastRoot{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(100px + env(safe-area-inset-bottom,0px));
  z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:min(440px,92vw);
}
.toast{
  width:100%;padding:13px 16px;border-radius:16px;
  font-size:14px;font-weight:600;text-align:center;
  background:rgba(30,24,44,.97);border:1px solid var(--border);color:#f4f1fa;
  box-shadow:0 14px 34px rgba(0,0,0,.5);
  opacity:0;transform:translateY(14px);transition:.28s;
}
.toast.show{opacity:1;transform:none;}
.toast-success{border-color:rgba(40,209,124,.5);}
.toast-error{border-color:rgba(255,95,95,.55);}
.toast-warn{border-color:rgba(255,190,80,.5);}

.empty{padding:60px 24px;text-align:center;color:var(--muted);}
.empty-icon{font-size:52px;margin-bottom:12px;line-height:1;}
.empty h3{color:var(--text);margin:0 0 8px;font-size:19px;}
.empty p{margin:0 0 20px;font-size:14px;line-height:1.5;}
.empty .btn-primary{max-width:280px;margin:0 auto;}

.section-title{padding:0 16px 12px;font-size:13px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="logo">💖 HeartLink</div>
    <div class="top-emoji" id="topEmoji">✦</div>
  </header>
  <main id="view"></main>
</div>

<nav id="bottomNav">
  <button class="nav-btn" data-view="discover"><span>🔎</span><em>Знакомства</em></button>
  <button class="nav-btn" data-view="likes"><span>❤️</span><em>Лайки</em></button>
  <button class="nav-btn" data-view="matches"><span>💚</span><em>Взаимные</em></button>
  <button class="nav-btn" data-view="me"><span>👤</span><em>Моя анкета</em></button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";

/* ================================================================
   ================================================================
   CONFIGURATION
   ================================================================
   ВСТАВЬТЕ СВОИ ДАННЫЕ НИЖЕ.
   ================================================================ */

/* ----------------------------------------------------------------
   DEMO_MODE
   true  -> приложение работает полностью на localStorage,
            данные не уходят на сервер. Можно открыть index.html
            и сразу всё попробовать.
   false -> приложение работает через NocoDB API + Telegram Bot API.
   ---------------------------------------------------------------- */
const DEMO_MODE = true;

const CONFIG = {

  /* --- NocoDB: URL таблиц (API v2) ------------------------------ */
  usersTableUrl:         "https://nocodb.puzzlebot.top/api/v2/tables/mfx0pd9mbsh10oe/records",
  profilesTableUrl:      "https://nocodb.puzzlebot.top/api/v2/tables/YOUR_PROFILES_TABLE_ID/records",
  likesTableUrl:         "https://nocodb.puzzlebot.top/api/v2/tables/YOUR_LIKES_TABLE_ID/records",
  matchesTableUrl:       "https://nocodb.puzzlebot.top/api/v2/tables/YOUR_MATCHES_TABLE_ID/records",
  commentsTableUrl:      "https://nocodb.puzzlebot.top/api/v2/tables/YOUR_COMMENTS_TABLE_ID/records",
  notificationsTableUrl: "https://nocodb.puzzlebot.top/api/v2/tables/YOUR_NOTIFICATIONS_TABLE_ID/records",

  /* --- NocoDB API TOKEN ----------------------------------------- */
  /* Вставьте сюда свой xc-token из NocoDB */
  apiToken: "YOUR_NOCODB_TOKEN",

  /* --- Telegram Bot --------------------------------------------- */
  /* Вставьте сюда токен вашего бота */
  telegramBotToken: "YOUR_TELEGRAM_BOT_TOKEN",

  /* Необязательно: если у вас появится свой backend-прокси,
     который безопасно пересылает сообщение в Telegram,
     укажите его URL здесь. Тогда токен бота не нужен в браузере. */
  telegramProxyUrl: "",

  /* --- Домен приложения (для генерации ссылок) ------------------ */
  publicBaseUrl: ""   /* если пусто — вычисляется автоматически */
};

/* ================================================================
   КОНЕЦ БЛОКА КОНФИГУРАЦИИ
   ================================================================ */

/* ================================================================
   ДЕМО-АНКЕТЫ
   ================================================================ */
const DEMO_PROFILES = [
  { name:'Алина', age:24, city:'Москва', gender:'female', looking_for:'male',
    description:'Люблю путешествия, утренний кофе и хорошие фильмы. Ищу того, с кем можно встретить закат на набережной и не думать о времени.',
    interests:'путешествия, музыка, кофе, кино',
    photo:'https://picsum.photos/seed/alina-heart/700/900' },

  { name:'Мария', age:27, city:'Санкт-Петербург', gender:'female', looking_for:'male',
    description:'Архитектор. Обожаю свой город, книги и вечерние прогулки. Расскажу, где варят лучший кофе в Питере.',
    interests:'архитектура, книги, прогулки, фотография',
    photo:'https://picsum.photos/seed/maria-heart/700/900' },

  { name:'Екатерина', age:25, city:'Казань', gender:'female', looking_for:'male',
    description:'Врач-ординатор. В свободное время танцую и готовлю десерты. Ищу спокойного и надёжного человека.',
    interests:'танцы, кулинария, медицина, йога',
    photo:'https://picsum.photos/seed/ekaterina-heart/700/900' },

  { name:'Анна', age:23, city:'Москва', gender:'female', looking_for:'male',
    description:'Студентка, будущий дизайнер. Люблю спонтанные поездки и новые знакомства.',

function esc(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function clampNum(v, min, max, def){
  const n = Number(v);
  if (!isFinite(n)) return def;
  return Math.min(max, Math.max(min, n));
}
function lsGet(key, def){
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : def; }
  catch(e){ return def; }
}
function lsSet(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){ console.warn('localStorage:', e); }
}
function lsDel(key){ try { localStorage.removeItem(key); } catch(e){} }

function nextSeq(name, start){
  const all = lsGet(SEQ_KEY, {});
  const cur = Number(all[name]) || (start - 1);
  const next = cur + 1;
  all[name] = next;
  lsSet(SEQ_KEY, all);
  return next;
}

function wasSent(key){ return !!lsGet(SENT_KEY, {})[key]; }
function markSent(key){ const s = lsGet(SENT_KEY, {}); s[key] = 1; lsSet(SENT_KEY, s); }

/* ================================================================
   URL ROUTING
   ================================================================ */
function computeBaseUrl(){
  if (CONFIG.publicBaseUrl) return CONFIG.publicBaseUrl.replace(/\/?$/, '/');
  if (location.protocol === 'file:') {
    return location.href.split('#')[0].split('?')[0];
  }
  let p = location.pathname.replace(/\/(profile|p)\/[^\/]+\/?$/i, '/');
  p = p.replace(/index\.html$/i, '');
  if (!p.endsWith('/')) p = p.replace(/\/[^\/]*$/, '/');
  if (!p) p = '/';
  return location.origin + p;
}

function profileLink(profileId){
  const base = computeBaseUrl();
  if (location.protocol === 'file:'){
    return base + '#/profile/' + profileId;
  }
  return base.replace(/\/$/, '') + '/profile/' + profileId;
}

function getRoute(){
  const path = location.pathname || '';
  let m = path.match(/\/(?:profile|p)\/([^\/?#]+)/i);
  if (m) return { view: 'profile', profileId: decodeURIComponent(m[1]) };

  const hash = (location.hash || '').replace(/^#\/?/, '');
  m = hash.match(/^(?:profile|p)\/([^\/?#]+)/i);
  if (m) return { view: 'profile', profileId: decodeURIComponent(m[1]) };

  if (['discover','likes','matches','me'].indexOf(hash) !== -1) return { view: hash };
  return { view: 'discover' };
}

function navigateTo(view){
  state.view = view;
  state.viewProfileId = null;
  if (view === 'discover') state.deckIndex = 0;
  try {
    if (location.protocol === 'file:'){
      const newHash = '#' + view;
      if (location.hash !== newHash) location.hash = newHash;
    } else {
      history.pushState({}, '', computeBaseUrl() + '#' + view);
    }
  } catch(e){ /* игнорируем */ }
  render();
  window.scrollTo(0, 0);
}

function goToProfile(profileId){
  if (!profileId) return;
  state.view = 'profile';
  state.viewProfileId = profileId;
  try {
    if (location.protocol === 'file:'){
      location.hash = '#/profile/' + profileId;
    } else {
      history.pushState({}, '', profileLink(profileId));
    }
  } catch(e){
    try { location.hash = '#/profile/' + profileId; } catch(e2){}
  }
  render();
  window.scrollTo(0, 0);
}

function toast(message, type){
  const root = $('#toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = message;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 320);
  }, 2800);
}

/* ================================================================
   MODALS
   ================================================================ */
function escKeyHandler(e){ if (e.key === 'Escape') closeModal(); }

function closeModal(){
  const root = $('#modalRoot');
  if (!root) return;
  const wrap = root.querySelector('.modal-backdrop');
  if (!wrap) return;
  wrap.classList.remove('show');
  document.removeEventListener('keydown', escKeyHandler);
  setTimeout(() => wrap.remove(), 260);
}

function openModal(opts){
  const o = opts || {};
  const root = $('#modalRoot');
  const old = root.querySelector('.modal-backdrop');
  if (old) old.remove();

  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head">' +
        '<h3>' + (o.title || '') + '</h3>' +
        '<button class="modal-close" data-close="1" type="button">✕</button>' +
      '</div>' +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.footer ? '<div class="modal-foot">' + o.footer + '</div>' : '') +
    '</div>';

  root.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('show'));

  wrap.addEventListener('click', function(e){
    if (e.target === wrap || (e.target.dataset && e.target.dataset.close)) closeModal();
  });
  document.addEventListener('keydown', escKeyHandler);

  if (typeof o.onMount === 'function') o.onMount(wrap);
  return wrap;
}

function tableUrl(table){
  switch(table){
    case 'users':         return CONFIG.usersTableUrl;
    case 'profiles':      return CONFIG.profilesTableUrl;
    case 'likes':         return CONFIG.likesTableUrl;
    case 'matches':       return CONFIG.matchesTableUrl;
    case 'comments':      return CONFIG.commentsTableUrl;
    case 'notifications': return CONFIG.notificationsTableUrl;
    default: throw new Error('Неизвестная таблица: ' + table);
  }
}

function ncHeaders(){
  const h = { 'Content-Type': 'application/json' };
  if (CONFIG.apiToken && CONFIG.apiToken.indexOf('YOUR_') !== 0){
    h['xc-token'] = CONFIG.apiToken;
  }
  return h;
}

function demoDb(){

    db = seedDemoDb();
    lsSet(DEMO_DB_KEY, db);
  }

}
function saveDemoDb(db){ lsSet(DEMO_DB_KEY, db); }

/* ---------- Универсальные CRUD ---------- */
async function dbList(table){
  if (DEMO_MODE){
    const db = demoDb();
    return (db[table] || []).slice();
  }
  const url = tableUrl(table) + '?limit=1000';
  const res = await fetch(url, { method: 'GET', headers: ncHeaders() });
  if (!res.ok) throw new Error('NocoDB: ошибка загрузки (' + res.status + ')');
  const json = await res.json();
  return json.list || json.records || [];
}

async function dbInsert(table, record){
  if (DEMO_MODE){
    const db = demoDb();
    const arr = db[table] || (db[table] = []);
    const maxId = arr.reduce(function(m, r){ return Math.max(m, Number(r.id) || 0); }, 0);
    const rec = Object.assign({}, record, { id: maxId + 1 });
    arr.push(rec);
    saveDemoDb(db);
    return rec;
  }
  const res = await fetch(tableUrl(table), {
    method: 'POST',
    headers: ncHeaders(),
    body: JSON.stringify(record)
  });
  if (!res.ok){
    const txt = await res.text().catch(function(){ return ''; });
    throw new Error('NocoDB: ошибка создания (' + res.status + ') ' + txt);
  }
  return await res.json();
}

async function dbUpdate(table, id, patch){
  if (DEMO_MODE){
    const db = demoDb();
    const arr = db[table] || [];
    const idx = arr.findIndex(function(r){ return String(r.id) === String(id); });
    if (idx === -1) throw new Error('Запись не найдена');
    arr[idx] = Object.assign({}, arr[idx], patch, { updated_at: nowIso() });
    saveDemoDb(db);
    return arr[idx];
  }
  const res = await fetch(tableUrl(table), {
    method: 'PATCH',
    headers: ncHeaders(),
    body: JSON.stringify(Object.assign({ id: id }, patch))
  });
  if (!res.ok) throw new Error('NocoDB: ошибка обновления (' + res.status + ')');
  return await res.json();
}

async function dbDelete(table, id){
  if (DEMO_MODE){
    const db = demoDb();
    const arr = db[table] || [];
    const idx = arr.findIndex(function(r){ return String(r.id) === String(id); });
    if (idx === -1) return false;
    arr.splice(idx, 1);
    saveDemoDb(db);
    return true;
  }
  const res = await fetch(tableUrl(table), {
    method: 'DELETE',
    headers: ncHeaders(),
    body: JSON.stringify([{ id: id }])
  });
  if (!res.ok) throw new Error('NocoDB: ошибка удаления (' + res.status + ')');
  return true;
}

/* ---------- LIKES ---------- */
async function createLike(fromUserId, toUserId){
  if (!fromUserId || !toUserId) throw new Error('Не указаны пользователи');
  if (fromUserId === toUserId) throw new Error('Нельзя лайкнуть самого себя');

  const likes = await dbList('likes');
  const exists = likes.filter(function(l){
    return l.from_user_id === fromUserId && l.to_user_id === toUserId;
  })[0];
  if (exists) return exists;

  return await dbInsert('likes', {
    from_user_id: fromUserId,
    to_user_id: toUserId,
    created_at: nowIso()
  });
}

async function removeLike(fromUserId, toUserId){
  const likes = await dbList('likes');
  const like = likes.filter(function(l){
    return l.from_user_id === fromUserId && l.to_user_id === toUserId;
  })[0];
  if (!like) return false;
  await dbDelete('likes', like.id);

  const matches = await dbList('matches');
  const m = matches.filter(function(x){
    return (x.user1_id === fromUserId && x.user2_id === toUserId) ||
           (x.user1_id === toUserId   && x.user2_id === fromUserId);
  })[0];
  if (m) await dbDelete('matches', m.id);
  return true;
}

async function checkMutualLike(fromUserId, toUserId){
  const likes = await dbList('likes');
  return likes.filter(function(l){
    return l.from_user_id === toUserId && l.to_user_id === fromUserId;
  })[0] || null;
}

async function createMatch(user1, user2){
  const matches = await dbList('matches');
  const exists = matches.filter(function(m){
    return (m.user1_id === user1 && m.user2_id === user2) ||
           (m.user1_id === user2 && m.user2_id === user1);
  })[0];
  if (exists) return exists;

  return await dbInsert('matches', {
    user1_id: user1,
    user2_id: user2,
    created_at: nowIso()
  });
}

/* ---------- TELEGRAM ---------- */
async function sendTelegramMessage(chatId, text){
  if (!chatId) return null;

  /* Если настроен backend-прокси — используем его (безопасный вариант) */
  if (CONFIG.telegramProxyUrl){
    try {
      const res = await fetch(CONFIG.telegramProxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: text })
      });
      if (!res.ok) throw new Error('Прокси вернул ' + res.status);
      return await res.json();
    } catch(err){
      console.error('Telegram (прокси) ошибка:', err);
      return null;
    }
  }

  /* Прямой запрос к Telegram Bot API */
  if (!CONFIG.telegramBotToken || CONFIG.telegramBotToken.indexOf('YOUR_') === 0){
    console.warn('[DEMO] Telegram не настроен. Сообщение для chat_id=' + chatId + ':\n' + text);
    return null;
  }

  try {
    const url = 'https://api.telegram.org/bot' + CONFIG.telegramBotToken + '/sendMessage';
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text: text })
    });
    const json = await response.json();
    if (!response.ok || json.ok === false){
      console.error('Telegram API ошибка:', json);
    }
    return json;
  } catch(err){
    console.error('Telegram ошибка сети:', err);
    return null;
  }
}

    if (state.profile){
      const fresh = state.profiles.filter(function(p){
        return p.profile_id === state.profile.profile_id;
      })[0];
      if (fresh) { state.profile = fresh; saveSession(); }
    }
  } catch(err){
    console.error(err);
    toast('Ошибка загрузки данных: ' + err.message, 'error');
  }
}

/* ================================================================
   РАБОТА С ИЗОБРАЖЕНИЯМИ
   ================================================================ */
function fileToDataUrl(file, maxSize, quality){
  maxSize = maxSize || 900;
  quality = quality || 0.82;
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){
      const img = new Image();
      img.onload = function(){
        try {
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch(e){
          resolve(reader.result);
        }
      };
      img.onerror = function(){ reject(new Error('Не удалось прочитать изображение')); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error('Ошибка чтения файла')); };
    reader.readAsDataURL(file);
  });
}

async function handleLike(profile){
  if (state.busy) return;
  if (!state.user){ showAuthOverlay(); return; }
  if (!profile) return;

  state.busy = true;
  try {
    const me = state.user;

    if (profile.user_id === me.user_id){
      toast('Нельзя лайкнуть самого себя', 'error');
      return;
    }

    const likes = await dbList('likes');
    const already = likes.filter(function(l){
      return l.from_user_id === me.user_id && l.to_user_id === profile.user_id;
    })[0];

    if (already){
      toast('Вы уже лайкнули эту анкету', 'warn');
      return;
    }

    await createLike(me.user_id, profile.user_id);
    toast('❤️ Лайк отправлен', 'success');

    /* DEMO: имитация ответного лайка от демо-пользователя */
    if (DEMO_MODE && Math.random() < 0.55){
      try { await createLike(profile.user_id, me.user_id); } catch(e){}
    }

    /* --- Уведомление владельцу анкеты --- */
    const myLink = state.profile ? profileLink(state.profile.profile_id) : '';
    const owner = await getUser(profile.user_id);

    if (owner && owner.telegram_chat_id){
      const key = 'like_' + me.user_id + '_' + profile.user_id;
      if (!wasSent(key)){
        markSent(key);
        await sendTelegramMessage(
          owner.telegram_chat_id,
          '❤️ Вам поставили лайк!\n\nОткрыть анкету: ' + (myLink || '(ссылка недоступна)')
        );
      }
    }

    await createNotification({
      user_id: profile.user_id,
      from_user_id: me.user_id,
      type: 'like',
      message: '❤️ Вам поставили лайк',
      profile_id: profile.profile_id,
      is_read: false
    });

    /* --- Проверка взаимности --- */
    const mutual = await checkMutualLike(me.user_id, profile.user_id);

    if (mutual){
      await createMatch(me.user_id, profile.user_id);
      await notifyMatch(me, profile);
      await refreshData();
      render();
      showMatchModal(profile);
      return;
    }

    await refreshData();
    render();

  } catch(err){
    console.error(err);
    toast('Ошибка: ' + err.message, 'error');
  } finally {
    state.busy = false;
  }
}

async function notifyMatch(me, profile){
  const myLink = state.profile ? profileLink(state.profile.profile_id) : '';
  const theirLink = profileLink(profile.profile_id);

  /* Мне */
  if (me.telegram_chat_id){
    const key1 = 'match_' + me.user_id + '_' + profile.user_id;
    if (!wasSent(key1)){
      markSent(key1);
      await sendTelegramMessage(
        me.telegram_chat_id,
        '💚 Взаимная симпатия!\n\nПользователь тоже поставил вам лайк.\n\nОткрыть анкету: ' + theirLink
      );
    }
  }

  /* Ему */
  const owner = await getUser(profile.user_id);
  if (owner && owner.telegram_chat_id){
    const key2 = 'match_' + profile.user_id + '_' + me.user_id;
    if (!wasSent(key2)){
      markSent(key2);
      await sendTelegramMessage(
        owner.telegram_chat_id,
        '💚 Взаимная симпатия!\n\nПользователь тоже поставил вам лайк.\n\nОткрыть анкету: ' + (myLink || theirLink)
      );
    }
  }

  await createNotification({
    user_id: profile.user_id,
    from_user_id: me.user_id,
    type: 'match',
    message: '💚 Взаимная симпатия',
    profile_id: profile.profile_id,
    is_read: false
  });
}

async function copyMyLink(){
  if (!state.profile){
    toast('Сначала создайте анкету', 'warn');
    return;
  }
  const link = profileLink(state.profile.profile_id);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(link);
      toast('📋 Ссылка скопирована', 'success');
      return;
    }
    throw new Error('no clipboard');
  } catch(e){
    const ta = document.createElement('textarea');
    ta.value = link;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      toast('📋 Ссылка скопирована', 'success');
    } catch(err){
      toast('Ссылка: ' + link, 'info');
    }
    ta.remove();
  }
}

/* ---------- Знакомства ---------- */
function viewDiscover(){
  const me = state.user;
  if (!me) return '';

  const myLikes = {};
  state.likes.forEach(function(l){
    if (l.from_user_id === me.user_id) myLikes[l.to_user_id] = true;
  });

  let list = state.profiles.filter(function(p){
    return p.user_id !== me.user_id && isVisible(p) && !myLikes[p.user_id];
  });

  const f = state.filters;
  list = list.filter(function(p){
    const age = Number(p.age) || 0;
    if (age < f.ageFrom) return false;
    if (age > f.ageTo) return false;
    if (f.city && String(p.city || '').toLowerCase().indexOf(f.city.toLowerCase()) === -1) return false;
    if (f.gender && p.gender !== f.gender) return false;
    if (f.lookingFor && f.lookingFor !== 'any' && p.looking_for !== f.lookingFor && p.looking_for !== 'any') return false;
    return true;
  });

  state._deck = list;

  if (state.deckIndex >= list.length) state.deckIndex = 0;
  if (state.deckIndex < 0) state.deckIndex = 0;

  const filtersHtml =
    '<div class="filters' + (state.filtersOpen ? ' open' : '') + '">' +
      '<button class="filters-toggle" data-act="toggleFilters" type="button">' +
        '<span>🔎 Поиск и фильтры</span><span class="chev">▼</span>' +
      '</button>' +
      '<div class="filters-body">' +
        '<div class="row2">' +
          '<label>Возраст от<input id="fAgeFrom" type="number" min="18" max="100" value="' + esc(f.ageFrom) + '"></label>' +
          '<label>Возраст до<input id="fAgeTo" type="number" min="18" max="100" value="' + esc(f.ageTo) + '"></label>' +
        '</div>' +
        '<label>Город<input id="fCity" type="text" maxlength="60" placeholder="Любой" value="' + esc(f.city) + '"></label>' +
        '<div class="row2">' +
          '<label>Пол<select id="fGender">' +
            '<option value=""' + (f.gender === '' ? ' selected' : '') + '>Любой</option>' +
            '<option value="female"' + (f.gender === 'female' ? ' selected' : '') + '>Женщина</option>' +
            '<option value="male"' + (f.gender === 'male' ? ' selected' : '') + '>Мужчина</option>' +
          '</select></label>' +
          '<label>Кого ищет<select id="fLookingFor">' +
            '<option value=""' + (f.lookingFor === '' ? ' selected' : '') + '>Любой</option>' +
            '<option value="male"' + (f.lookingFor === 'male' ? ' selected' : '') + '>Мужчину</option>' +
            '<option value="female"' + (f.lookingFor === 'female' ? ' selected' : '') + '>Женщину</option>' +
          '</select></label>' +
        '</div>' +
        '<div class="row2">' +
          '<button class="btn-ghost" data-act="resetFilters" type="button">Сбросить</button>' +
          '<button class="btn-primary" data-act="applyFilters" type="button">Применить</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  if (!list.length){
    return filtersHtml +
      '<div class="empty">' +
        '<div class="empty-icon">🔎</div>' +
        '<h3>Анкеты закончились</h3>' +
        '<p>Вы посмотрели все доступные анкеты. Попробуйте изменить фильтры или зайдите позже.</p>' +
        '<button class="btn-primary" data-act="resetFilters" type="button">Сбросить фильтры</button>' +
      '</div>';
  }

  const p = list[state.deckIndex];

  const cardHtml =
    '<div class="deck">' +
      '<div class="card" id="mainCard">' +
        '<div class="card-photo">' +
          '<img src="' + esc(p.photo_url || FALLBACK_IMG) + '" alt="' + esc(p.name) + '" ' +
            'onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">' +
          '<div class="photo-shade"></div>' +
          '<div class="card-counter">' + (state.deckIndex + 1) + ' / ' + list.length + '</div>' +
        '</div>' +
        '<div class="card-body">' +
          '<h2>' + esc(p.name) + ', ' + esc(p.age) + '</h2>' +
          '<div class="card-city">📍 ' + esc(p.city) + '</div>' +
          (p.description ? '<p class="card-desc">' + esc(p.description) + '</p>' : '') +
          '<div class="tags">' + tagsHtml(p.interests) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="deck-actions">' +
        '<button class="act act-skip" data-act="skip" type="button" title="Пропустить">✕</button>' +
        '<button class="act act-comment" data-act="comment" data-uid="' + esc(p.user_id) + '" type="button" title="Комментарий">💬</button>' +
        '<button class="act act-like" data-act="like" data-uid="' + esc(p.user_id) + '" type="button" title="Нравится">❤️</button>' +
      '</div>' +
      '<button class="btn-open-profile" data-act="open" data-pid="' + esc(p.profile_id) + '" type="button">' +
        '👤 Открыть профиль' +
      '</button>' +
    '</div>';

  return filtersHtml + cardHtml;
}

/* ---------- Лайки ---------- */
function viewLikes(){
  const me = state.user;
  if (!me) return '';

  const tab = state.likedTab;
  let items = [];

  if (tab === 'incoming'){
    items = state.likes
      .filter(function(l){ return l.to_user_id === me.user_id; })
      .map(function(l){ return { profile: profileByUserId(l.from_user_id), like: l }; })
      .filter(function(x){ return !!x.profile; });
  } else if (tab === 'outgoing'){
    items = state.likes
      .filter(function(l){ return l.from_user_id === me.user_id; })
      .map(function(l){ return { profile: profileByUserId(l.to_user_id), like: l }; })
      .filter(function(x){ return !!x.profile; });
  } else {
    items = state.matches
      .filter(function(m){ return m.user1_id === me.user_id || m.user2_id === me.user_id; })
      .map(function(m){
        const other = m.user1_id === me.user_id ? m.user2_id : m.user1_id;
        return { profile: profileByUserId(other), match: m };
      })
      .filter(function(x){ return !!x.profile; });
  }

  const tabsHtml =
    '<div class="tabs">' +
      '<button class="tab' + (tab === 'incoming' ? ' active' : '') + '" data-act="tab" data-tab="incoming" type="button">Меня лайкнули</button>' +
      '<button class="tab' + (tab === 'outgoing' ? ' active' : '') + '" data-act="tab" data-tab="outgoing" type="button">Я лайкнул</button>' +
      '<button class="tab' + (tab === 'mutual' ? ' active' : '') + '" data-act="tab" data-tab="mutual" type="button">Взаимные</button>' +
    '</div>';

  if (!items.length){
    const texts = {
      incoming: ['💌', 'Пока никто не лайкнул', 'Создайте красивую анкету и делитесь ссылкой — лайки появятся здесь.'],
      outgoing: ['❤️', 'Вы ещё никого не лайкнули', 'Перейдите в «Знакомства» и поставьте первый лайк.'],
      mutual: ['💚', 'Взаимных симпатий пока нет', 'Когда вы и другой человек лайкнете друг друга — это появится здесь.']
    };
    const t = texts[tab];
    return tabsHtml +
      '<div class="empty">' +
        '<div class="empty-icon">' + t[0] + '</div>' +
        '<h3>' + t[1] + '</h3>' +
        '<p>' + t[2] + '</p>' +
      '</div>';
  }

  const cards = items.map(function(item){
    const p = item.profile;
    let actionBtn = '';
    if (tab === 'incoming'){
      actionBtn = '<button data-act="like" data-uid="' + esc(p.user_id) + '" type="button" title="Ответить лайком">❤️</button>';
    } else if (tab === 'outgoing'){
      actionBtn = '<button data-act="unlike" data-uid="' + esc(p.user_id) + '" type="button" title="Убрать лайк">💔</button>';
    } else {
      actionBtn = '<button data-act="comment" data-uid="' + esc(p.user_id) + '" type="button" title="Написать">💬</button>';
    }

    return '<div class="mini">' +
      '<div class="mini-photo">' +
        '<img src="' + esc(p.photo_url || FALLBACK_IMG) + '" alt="' + esc(p.name) + '" ' +
          'onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">' +
      '</div>' +
      '<div class="mini-body">' +
        '<div class="mini-name">' + esc(p.name) + ', ' + esc(p.age) + '</div>' +
        '<div class="mini-city">📍 ' + esc(p.city) + '</div>' +
      '</div>' +
      '<div class="mini-actions">' +
        '<button data-act="open" data-pid="' + esc(p.profile_id) + '" type="button" title="Открыть профиль">👤</button>' +
        actionBtn +
      '</div>' +
    '</div>';
  }).join('');

  return tabsHtml + '<div class="grid">' + cards + '</div>';
}

/* ---------- Взаимные ---------- */
function viewMatches(){
  const me = state.user;
  if (!me) return '';

  const items = state.matches
    .filter(function(m){ return m.user1_id === me.user_id || m.user2_id === me.user_id; })
    .map(function(m){
      const other = m.user1_id === me.user_id ? m.user2_id : m.user1_id;
      return { profile: profileByUserId(other), match: m };
    })
    .filter(function(x){ return !!x.profile; });

  if (!items.length){
    return '<div class="empty">' +
      '<div class="empty-icon">💚</div>' +
      '<h3>Взаимных симпатий пока нет</h3>' +
      '<p>Ставьте лайки в разделе «Знакомства» — когда симпатия будет взаимной, она появится здесь.</p>' +
    '</div>';
  }

  const cards = items.map(function(item){
    const p = item.profile;
    return '<div class="mini">' +
      '<div class="mini-photo">' +
        '<img src="' + esc(p.photo_url || FALLBACK_IMG) + '" alt="' + esc(p.name) + '" ' +
          'onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">' +
      '</div>' +
      '<div class="mini-body">' +
        '<div class="mini-name">' + esc(p.name) + ', ' + esc(p.age) + '</div>' +
        '<div class="mini-city">📍 ' + esc(p.city) + '</div>' +
      '</div>' +
      '<div class="mini-actions">' +
        '<button data-act="open" data-pid="' + esc(p.profile_id) + '" type="button" title="Открыть профиль">👤</button>' +
        '<button data-act="comment" data-uid="' + esc(p.user_id) + '" type="button" title="Написать">💬</button>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="section-title">💚 Взаимные симпатии — ' + items.length + '</div>' +
         '<div class="grid">' + cards + '</div>';
}

/* ---------- Моя анкета ---------- */
function viewMe(){
  const me = state.user;
  if (!me) return '';
  const p = state.profile;

  if (!p){
    return '<div class="empty">' +
      '<div class="empty-icon">📝</div>' +
      '<h3>У вас пока нет анкеты</h3>' +
      '<p>Создайте анкету, чтобы получать лайки и сообщения.</p>' +
      '<button class="btn-primary" data-act="editProfile" type="button">Создать анкету</button>' +
    '</div>';
  }

  const likesReceived = state.likes.filter(function(l){ return l.to_user_id === me.user_id; }).length;
  const likesGiven = state.likes.filter(function(l){ return l.from_user_id === me.user_id; }).length;
  const matchCount = state.matches.filter(function(m){
    return m.user1_id === me.user_id || m.user2_id === me.user_id;
  }).length;

  const link = profileLink(p.profile_id);

  return '<div class="me">' +
    '<div class="me-photo">' +
      '<img src="' + esc(p.photo_url || FALLBACK_IMG) + '" alt="' + esc(p.name) + '" ' +
        'onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">' +
    '</div>' +
    '<div class="me-info">' +
      '<h2>' + esc(p.name) + ', ' + esc(p.age) + '</h2>' +
      '<div class="city">📍 ' + esc(p.city) + ' · ' + genderLabel(p.gender) + ' · ищет: ' + lookingLabel(p.looking_for) + '</div>' +
      (p.description ? '<p class="desc">' + esc(p.description) + '</p>' : '') +
      '<div class="tags">' + tagsHtml(p.interests) + '</div>' +
      '<div style="margin-top:14px;font-size:12.5px;color:var(--muted);word-break:break-all;">' +
        '🆔 ' + esc(p.profile_id) + '<br>🔗 ' + esc(link) +
      '</div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + likesReceived + '</b><span>Лайков получено</span></div>' +
      '<div class="stat"><b>' + matchCount + '</b><span>Взаимных симпатий</span></div>' +
    '</div>' +
    '<div class="stats" style="grid-template-columns:1fr;">' +
      '<div class="stat"><b>' + likesGiven + '</b><span>Лайков поставлено</span></div>' +
    '</div>' +
    '<div class="actions-col">' +
      '<button class="btn-primary" data-act="editProfile" type="button">✏️ Редактировать</button>' +
      '<button class="btn-ghost" data-act="copyLink" type="button">📋 Скопировать ссылку</button>' +
      '<button class="btn-ghost" data-act="openMine" type="button">🔗 Открыть анкету</button>' +
      '<button class="btn-ghost" data-act="logout" type="button">🚪 Выйти из аккаунта</button>' +
    '</div>' +
  '</div>';
}

/* ---------- Просмотр анкеты по ссылке ---------- */
function viewProfile(profileId){
  const p = profileByProfileId(profileId);

  if (!p){
    return '<div class="empty">' +
      '<div class="empty-icon">🔍</div>' +
      '<h3>Анкета не найдена.</h3>' +
      '<p>Возможно, ссылка неверна или анкета была удалена.</p>' +
      '<button class="btn-primary" data-act="goHome" type="button">На главную</button>' +
    '</div>';
  }

  const me = state.user;
  const isMine = me && p.user_id === me.user_id;
  const alreadyLiked = me && state.likes.some(function(l){
    return l.from_user_id === me.user_id && l.to_user_id === p.user_id;
  });

  let actionsHtml = '';
  if (!me){
    actionsHtml =
      '<div class="actions-col">' +
        '<button class="btn-primary" data-act="goHome" type="button">Войти, чтобы поставить лайк</button>' +
      '</div>';
  } else if (isMine){
    actionsHtml =
      '<div class="actions-col">' +
        '<button class="btn-ghost" data-act="copyLink" type="button">📋 Скопировать ссылку</button>' +
        '<button class="btn-primary" data-act="editProfile" type="button">✏️ Редактировать</button>' +
      '</div>';
  } else {
    actionsHtml =
      '<div class="deck-actions">' +
        '<button class="act act-comment" data-act="comment" data-uid="' + esc(p.user_id) + '" type="button" title="Комментарий">💬</button>' +
        (alreadyLiked
          ? '<button class="act act-like" data-act="unlike" data-uid="' + esc(p.user_id) + '" type="button" title="Убрать лайк">💔</button>'
          : '<button class="act act-like" data-act="like" data-uid="' + esc(p.user_id) + '" type="button" title="Нравится">❤️</button>') +
      '</div>' +
      '<div style="text-align:center;margin-top:10px;font-size:12.5px;color:var(--muted);">' +
        (alreadyLiked ? 'Вы уже лайкнули эту анкету' : 'Поставьте лайк, чтобы познакомиться') +
      '</div>';
  }

  return '<div class="pv">' +
    '<div class="pv-photo">' +
      '<button class="pv-back" data-act="goHome" type="button">←</button>' +
      '<img src="' + esc(p.photo_url || FALLBACK_IMG) + '" alt="' + esc(p.name) + '" ' +
        'onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">' +
      '<div class="photo-shade"></div>' +
    '</div>' +
    '<div class="pv-body">' +
      '<h2>' + esc(p.name) + ', ' + esc(p.age) + '</h2>' +
      '<div class="city">📍 ' + esc(p.city) + ' · ' + genderLabel(p.gender) + ' · ищет: ' + lookingLabel(p.looking_for) + '</div>' +
      (p.description ? '<p class="desc">' + esc(p.description) + '</p>' : '') +
      '<div class="tags">' + tagsHtml(p.interests) + '</div>' +
      '<div style="margin-top:12px;font-size:12px;color:var(--muted);">🆔 ' + esc(p.profile_id) + '</div>' +
      actionsHtml +
    '</div>' +
  '</div>';
}

/* ================================================================
   RENDER
   ================================================================ */
function render(){
  const view = document.getElementById('view');

  /* Если пользователя нет и мы не смотрим чужую анкету — показываем регистрацию */
  if (!state.user && state.view !== 'profile'){
    showAuthOverlay();
    view.innerHTML = '';
    updateNav();
    return;
  }
  hideAuthOverlay();

  /* Пользователь есть, но анкеты ещё нет */
  if (state.user && !state.profile && state.view !== 'profile'){
    view.innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">📝</div>' +
        '<h3>Остался последний шаг</h3>' +
        '<p>Создайте анкету, чтобы вас могли найти другие пользователи.</p>' +
        '<button class="btn-primary" data-act="editProfile" type="button">Создать анкету</button>' +
      '</div>';
    updateNav();
    return;
  }

  if (state.view === 'discover')      view.innerHTML = viewDiscover();
  else if (state.view === 'likes')    view.innerHTML = viewLikes();
  else if (state.view === 'matches')  view.innerHTML = viewMatches();
  else if (state.view === 'me')       view.innerHTML = viewMe();
  else if (state.view === 'profile')  view.innerHTML = viewProfile(state.viewProfileId);
  else                                view.innerHTML = viewDiscover();

  updateNav();
}

function updateNav(){
  $$('#bottomNav .nav-btn').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.view === state.view);
  });
  const nav = document.getElementById('bottomNav');
  if (nav){
    nav.style.display = (!state.user && state.view === 'profile') ? 'none' : 'grid';
  }
}

/* ================================================================
   ДЕЛЕГИРОВАНИЕ СОБЫТИЙ
   ================================================================ */
async function onViewClick(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;

  const act = el.dataset.act;

  if (act === 'toggleFilters'){
    state.filtersOpen = !state.filtersOpen;
    render();
    return;
  }

  if (act === 'applyFilters'){
    const f = {
      ageFrom: clampNum($('#fAgeFrom') ? $('#fAgeFrom').value : 18, 18, 100, 18),
      ageTo: clampNum($('#fAgeTo') ? $('#fAgeTo').value : 100, 18, 100, 100),
      city: ($('#fCity') ? $('#fCity').value : '').trim(),
      gender: $('#fGender') ? $('#fGender').value : '',
      lookingFor: $('#fLookingFor') ? $('#fLookingFor').value : ''
    };
    if (f.ageFrom > f.ageTo){
      const t = f.ageFrom; f.ageFrom = f.ageTo; f.ageTo = t;
    }
    state.filters = f;
    state.deckIndex = 0;
    state.filtersOpen = true;
    toast('Фильтры применены', 'success');
    render();
    return;
  }

  if (act === 'resetFilters'){
    state.filters = { ageFrom: 18, ageTo: 100, city: '', gender: '', lookingFor: '' };
    state.deckIndex = 0;
    render();
    return;
  }

  if (act === 'tab'){
    state.likedTab = el.dataset.tab || 'incoming';
    render();
    return;
  }

  if (act === 'goHome'){
    navigateTo('discover');
    return;
  }

  if (act === 'open'){
    goToProfile(el.dataset.pid);
    return;
  }

  if (act === 'comment'){
    const p = profileByUserId(el.dataset.uid);
    if (p) openCommentModal(p);
    return;
  }

  if (act === 'skip'){
    state.deckIndex++;
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (act === 'like'){
    if (!state.user){ showAuthOverlay(); return; }
    const p = profileByUserId(el.dataset.uid);
    if (!p) return;
    const card = document.getElementById('mainCard');
    if (card){
      card.classList.add('fly-right');
      await sleep(260);
    }
    await handleLike(p);
    return;
  }

  if (act === 'unlike'){
    const p = profileByUserId(el.dataset.uid);
    if (p) openUnlikeConfirm(p);
    return;
  }

  if (act === 'editProfile'){
    openProfileEditor(false);
    return;
  }

  if (act === 'copyLink'){
    copyMyLink();
    return;
  }

  if (act === 'openMine'){
    if (state.profile) goToProfile(state.profile.profile_id);
    return;
  }

  if (act === 'logout'){
    logout();
    return;
  }
}

/* ================================================================
   ЗАПУСК
   ================================================================ */
async function start(){
  /* Инициализируем демо-базу заранее */
  if (DEMO_MODE) demoDb();

  loadSession();

  /* Подписываемся на клики внутри #view один раз */
  document.getElementById('view').addEventListener('click', function(e){
    onViewClick(e).catch(function(err){
      console.error(err);
      toast('Ошибка: ' + err.message, 'error');
    });
  });

  /* Нижняя навигация */
  $$('#bottomNav .nav-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      if (!state.user){
        showAuthOverlay();
        return;
      }
      navigateTo(btn.dataset.view);
    });
  });

  /* Кнопка "назад" в браузере */
  window.addEventListener('popstate', function(){
    const r = getRoute();
    if (r.view === 'profile'){
      state.view = 'profile';
      state.viewProfileId = r.profileId;
    } else {
      state.view = r.view;
      state.viewProfileId = null;
    }
    render();
  });

  /* Загружаем данные и открываем нужный маршрут */
  await refreshData();

  const route = getRoute();
  if (route.view === 'profile'){
    state.view = 'profile';
    state.viewProfileId = route.profileId;
  } else {
    state.view = route.view;
    state.viewProfileId = null;
  }

  render();
}

document.addEventListener('DOMContentLoaded', function(){
  start().catch(function(err){
    console.error(err);
    toast('Ошибка запуска: ' + err.message, 'error');
  });
});
</script>
