<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Reels Feed</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden; background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff; overscroll-behavior: none;
    position: fixed; inset: 0; touch-action: pan-y;
  }
  body { padding: 0 !important; margin: 0 !important; }

  .site-loader {
    position: fixed; inset: 0; background: #000;
    z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .site-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .site-loader-spinner {
    width: 42px; height: 42px;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: siteSpin 0.85s linear infinite;
  }
  @keyframes siteSpin { to { transform: rotate(360deg); } }
  .site-loader-text { color: rgba(255,255,255,0.55); font-size: 13px; font-weight: 500; letter-spacing: 0.2px; }

  .feed {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .feed::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .reel {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    overflow: hidden; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .reel video, .reel .bg-image {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  .reel::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 22%, transparent 55%, rgba(0,0,0,0.9) 100%);
    z-index: 2; pointer-events: none;
  }
  .reel.intro-slide::before { display: none; }
  .intro-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover; z-index: 1;
  }
  .intro-video::-webkit-media-controls,
  .intro-video::-webkit-media-controls-enclosure,
  .intro-video::-webkit-media-controls-panel,
  .intro-video::-webkit-media-controls-play-button,
  .intro-video::-webkit-media-controls-start-playback-button {
    display: none !important;
    -webkit-appearance: none !important;
  }
  .swipe-hint {
    position: absolute; bottom: 110px; left: 50%;
    transform: translateX(-50%); z-index: 8;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    pointer-events: none;
    animation: hintFadeIn 0.6s ease-out 0.4s both;
  }
  @keyframes hintFadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .swipe-hint svg {
    width: 42px; height: 42px;
    stroke: #fff; stroke-width: 2.5;
    stroke-linecap: round; stroke-linejoin: round;
    fill: none;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));
    animation: arrowBounce 1.6s ease-in-out infinite;
  }
  @keyframes arrowBounce {
    0%   { transform: translateY(0);    opacity: 0.55; }
    40%  { transform: translateY(-16px); opacity: 1; }
    70%  { transform: translateY(-16px); opacity: 1; }
    100% { transform: translateY(0);    opacity: 0.55; }
  }
  .swipe-hint-text {
    font-size: 12px; font-weight: 600;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    letter-spacing: 0.4px;
    animation: textPulse 1.6s ease-in-out infinite;
  }
  @keyframes textPulse { 0%, 100% { opacity: 0.5; } 40%, 70% { opacity: 1; } }

  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 6;
    padding: calc(env(safe-area-inset-top, 0px) + 51px) 16px 0;
    pointer-events: none;
  }
  .top-bar .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    object-fit: cover;
    flex-shrink: 0;
    display: block;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
    pointer-events: auto;
  }
  .username-wrap {
    position: absolute;
    left: 50%;
    top: calc(env(safe-area-inset-top, 0px) + 47px);
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 24px;
    padding: 8px 20px;
    max-width: 66vw;
    pointer-events: auto;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 4px 16px rgba(0, 0, 0, 0.3);
  }
  .username {
    display: block;
    font-weight: 700;
    font-size: 15px;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .premium-badge {
    width: 16px; height: 16px;
    flex-shrink: 0;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.5));
  }
  .premium-inline {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  .info {
    position: absolute;
    left: 14px;
    right: 78px;
    bottom: 108px;
    z-index: 5;
  }
  .caption-box {
    position: relative;
    display: inline-block;
    max-width: 100%;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 20px;
    padding: 10px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 4px 16px rgba(0, 0, 0, 0.25);
  }
  .caption-box:active {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.22);
  }
  .caption-box .caption {
    font-size: 14px; line-height: 1.4; color: #ffffff;
    word-wrap: break-word; overflow-wrap: break-word;
    white-space: pre-wrap;
  }
  .caption-box.has-overflow .caption {
    max-height: calc(1.4em * 3);
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .caption-box.has-overflow.expanded .caption { max-height: 1000px; }
  .caption-toggle {
    display: none;
    align-items: center; justify-content: center;
    margin-top: 6px; opacity: 0.7;
    transition: opacity 0.2s ease;
  }
  .caption-box.has-overflow .caption-toggle { display: flex; }
  .caption-toggle svg { width: 16px; height: 16px; transition: transform 0.3s ease; }
  .caption-box.expanded .caption-toggle svg { transform: rotate(180deg); }
  .caption-box.empty { display: none; }

  .music {
    display: flex; align-items: center;
    gap: 8px; font-size: 13px; overflow: hidden;
  }
  .music-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .music-text-wrap {
    flex: 1; min-width: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 32px, #000 calc(100% - 12px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 32px, #000 calc(100% - 12px), transparent 100%);
  }
  .music-text {
    display: inline-block; white-space: nowrap;
    color: #fff; font-weight: 500;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    animation: marquee 14s linear infinite;
  }
  @keyframes marquee {
    0%, 15%  { transform: translateX(0); }
    50%, 65% { transform: translateX(-40%); }
    100%     { transform: translateX(0); }
  }

  .tap-gif {
    position: absolute;
    pointer-events: none;
    z-index: 10;
    font-size: 120px;
    line-height: 1;
    color: #000;
    text-shadow: 0 6px 18px rgba(0,0,0,0.5);
    user-select: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0);
    will-change: transform, opacity;
  }
  .tap-gif.animate { animation: gifPop 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes gifPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    35%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    85%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(1.05); }
  }

  .pause-icon {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    width: 80px; height: 80px;
    background: rgba(0,0,0,0.5); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: all 0.2s ease; z-index: 6;
  }
  .pause-icon.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .side-panel {
    position: fixed;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 54px;
    padding: 14px 0;
    background: rgba(20, 20, 22, 0.68);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 15;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    touch-action: manipulation;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .side-panel.hidden {
    opacity: 0;
    transform: translateY(-50%) translateX(20px);
    pointer-events: none;
  }
  .side-panel button {
    position: relative;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 50%;
    cursor: pointer; padding: 0;
    transition: background 0.2s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .side-panel button:active {
    background: rgba(255, 255, 255, 0.12);
    transform: scale(0.92);
  }
  .side-panel button svg {
    width: 24px; height: 24px;
    display: block; pointer-events: none;
  }
  .side-panel button.muted svg { opacity: 0.45; }
  .side-panel button.active { background: rgba(255, 255, 255, 0.15); }
  .side-panel button.liked svg path { fill: #ff2d55; stroke: #ff2d55; }
  .side-panel button.liked { background: rgba(255, 45, 85, 0.14); }
  .side-panel button.liked svg { animation: likePulse 0.4s ease; }
  @keyframes likePulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .like-badge, .comment-badge {
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    background: rgba(255, 45, 85, 0.95);
    border-radius: 8px;
    padding: 1px 5px;
    line-height: 1.3;
    min-width: 14px;
    text-align: center;
    letter-spacing: 0.1px;
    pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    display: none;
  }
  .like-badge.show, .comment-badge.show { display: block; }
  .comment-badge { background: rgba(42, 171, 238, 0.95); }

  .share-modal-backdrop, .comments-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9998;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  .share-modal-backdrop.show, .comments-backdrop.show { opacity: 1; visibility: visible; }

  .share-modal {
    position: fixed;
    left: 16px; right: 16px; bottom: 16px;
    background: rgba(28, 28, 30, 0.92);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    padding: 10px 10px 14px;
    z-index: 9999;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    transform: translateY(calc(100% + 30px));
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
    max-width: 500px;
    margin: 0 auto;
  }
  .share-modal.show { transform: translateY(0); }
  .share-modal-handle {
    width: 40px; height: 4px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 2px;
    margin: 0 auto 10px;
  }
  .share-modal-title {
    font-size: 15px; font-weight: 700;
    color: #fff; text-align: center;
    margin-bottom: 12px; letter-spacing: -0.2px;
  }
  .share-option {
    display: flex; align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.05);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .share-option:last-child { margin-bottom: 0; }
  .share-option:active {
    background: rgba(255, 255, 255, 0.12);
    transform: scale(0.98);
  }
  .share-option-icon {
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; flex-shrink: 0;
  }
  .share-option-icon svg { width: 22px; height: 22px; display: block; }
  .share-option-contacts .share-option-icon {
    background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
  }
  .share-option-story .share-option-icon {
    background: linear-gradient(135deg, #FF7A00 0%, #FF0080 50%, #7928CA 100%);
  }
  .share-option-text { flex: 1; min-width: 0; }
  .share-option-title {
    font-size: 15px; font-weight: 600;
    color: #fff; margin-bottom: 2px; letter-spacing: -0.1px;
  }
  .share-option-sub {
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.55);
    line-height: 1.3;
  }
  .share-option-arrow { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.4; }

  .comments-sheet {
    position: fixed;
    left: 8px; right: 8px; bottom: 8px;
    height: 80vh;
    max-height: 700px;
    background: rgba(22, 22, 24, 0.97);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 30px;
    padding: 10px 0 0;
    z-index: 9999;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
    transform: translateY(calc(100% + 30px));
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
    display: flex;
    flex-direction: column;
    max-width: 500px;
    margin: 0 auto;
    overflow: hidden;
  }
  .comments-sheet.show { transform: translateY(0); }

  .comments-handle {
    width: 40px; height: 4px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 2px;
    margin: 0 auto 8px;
    flex-shrink: 0;
  }
  .comments-header {
    display: flex; align-items: center; justify-content: center;
    position: relative;
    padding: 4px 16px 12px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .comments-title {
    font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.2px;
  }
  .comments-count-inline {
    color: rgba(255, 255, 255, 0.5);
    font-weight: 500;
    margin-left: 6px;
  }
  .comments-close {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: none; cursor: pointer; padding: 0;
    transition: background 0.2s ease;
  }
  .comments-close:active { background: rgba(255, 255, 255, 0.16); }
  .comments-close svg { width: 14px; height: 14px; display: block; }

  .comments-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px 12px 16px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .comments-list::-webkit-scrollbar { display: none; width: 0; height: 0; }

  .comment-thread { padding: 6px 0; }
  .comment-item {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    align-items: flex-start;
    animation: commentIn 0.28s ease-out;
  }
  @keyframes commentIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .comment-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: linear-gradient(135deg, #2AABEE, #229ED9);
    border: 1.5px solid rgba(255, 255, 255, 0.1);
    display: block;
  }
  .comment-body { flex: 1; min-width: 0; padding-top: 1px; }
  .comment-head {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .comment-name {
    font-size: 13.5px; font-weight: 700; color: #fff;
    letter-spacing: -0.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 55%;
  }
  .comment-item.is-own .comment-name { color: #2AABEE; }
  .comment-premium {
    width: 13px; height: 13px;
    flex-shrink: 0; display: block; object-fit: contain;
  }
  .comment-time {
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.4);
    font-weight: 500;
    flex-shrink: 0;
  }
  .comment-text {
    font-size: 14px; line-height: 1.4;
    color: rgba(255, 255, 255, 0.92);
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    margin-bottom: 4px;
  }
  .comment-sticker {
    max-width: 140px;
    max-height: 140px;
    border-radius: 12px;
    display: block;
    margin-top: 2px;
    object-fit: contain;
  }
  .comment-voice {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(42, 171, 238, 0.12);
    border: 1px solid rgba(42, 171, 238, 0.25);
    border-radius: 14px;
    padding: 8px 12px;
    margin-top: 4px;
    max-width: 260px;
  }
  .comment-voice svg {
    width: 18px; height: 18px;
    flex-shrink: 0;
    color: #2AABEE;
  }
  .comment-voice audio {
    flex: 1;
    min-width: 0;
    height: 32px;
  }

  .comment-actions {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 4px;
  }
  .comment-action-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    font-weight: 600;
    padding: 2px 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 0.2s ease;
    font-family: inherit;
  }
  .comment-action-btn:active { color: #fff; }
  .comment-action-btn svg { width: 12px; height: 12px; display: block; }
  .comment-action-btn.danger { color: rgba(255, 92, 92, 0.7); }
  .comment-action-btn.danger:active { color: #ff3b30; }

  .comment-replies {
    margin-left: 24px;
    padding-left: 14px;
    border-left: 1.5px solid rgba(255, 255, 255, 0.08);
    margin-top: 2px;
  }
  .comment-replies .comment-avatar { width: 30px; height: 30px; }
  .comment-replies .comment-name { font-size: 12.5px; }
  .comment-replies .comment-text { font-size: 13px; }
  .comment-replies .comment-sticker { max-width: 110px; max-height: 110px; }
  .reply-to-badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    color: #2AABEE;
    margin-right: 4px;
  }

  .comments-empty, .comments-loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    padding: 50px 20px;
    color: rgba(255, 255, 255, 0.45);
    font-size: 13.5px; text-align: center;
  }
  .comments-loading .spinner-mini {
    width: 26px; height: 26px;
    border: 2.5px solid rgba(255, 255, 255, 0.15);
    border-top-color: rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .comments-empty svg { width: 44px; height: 44px; opacity: 0.35; }

  .comment-input-wrap {

  .bottom-menu {
    position: fixed; bottom: 16px; left: 16px; right: 16px;

    left: 30px; right: 30px;

    border-radius: 3px;

  }

  // ==================== УТИЛИТЫ ====================
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
  function isValidVideoUrl(url) {
    if (!url || typeof url !== 'string') return false;
    const trimmed = url.trim();
    if (trimmed.length < 5) return false;
    if (!/^https?:\/\//i.test(trimmed)) return false;
    if (trimmed === 'null' || trimmed === 'undefined' || trimmed === '-') return false;
    return true;
  }
  function resolveImg(val) {
    if (!val) return '';
    if (typeof val === 'string') return val.trim();
    if (Array.isArray(val) && val.length) {
      const a = val[0];
      if (typeof a === 'string') return a;
      return a.url || a.signedUrl ||
        (a.thumbnails && a.thumbnails.small && a.thumbnails.small.url) || '';
    }
    if (typeof val === 'object') return val.url || val.signedUrl || '';
    return '';
  }
  function extractVideoId(url) {
    if (!url) return null;
    try {
      const u = new URL(url, window.location.href);
      let last = (u.pathname.split('/').filter(Boolean).pop() || '');
      last = last.replace(/\.(mp4|mov|webm|m4v)$/i, '');
      return last || null;
    } catch (e) {
      const m = String(url).match(/([A-Za-z0-9_-]+)\.(mp4|mov|webm|m4v)(?:[?#]|$)/i);
      return m ? m[1] : null;
    }
  }
  function getStartVideoId() {
    try {
      const payload = '{{WEB_PAGES_START_PAYLOAD}}';
      if (payload && payload.indexOf('{{') === -1) {
        const raw = String(payload).trim();
        if (raw) {
          const parts = raw.split('_');
          return parts.length > 1 ? parts[parts.length - 1] : raw;
        }
      }
    } catch (e) {}
    const tg = window.Telegram && window.Telegram.WebApp;
    const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    if (sp) {
      const parts = String(sp).split('_');
      return parts.length > 1 ? parts[parts.length - 1] : String(sp);
    }
    try {
      const p = new URLSearchParams(window.location.search).get('v');
      if (p) return p;
    } catch (e) {}
    return null;
  }
  function buildDeepLink(videoId) {
    if (!videoId) return window.location.href;

  function forcePlay(video) {
    if (!video) return;
    if (!video.paused) return;
    video.muted = PLAYBACK.muted;
    const attempt = video.play();
    if (attempt && typeof attempt.catch === 'function') {
      attempt.catch(() => {
        video.muted = true;
        video.play().catch(() => {
          setTimeout(() => { video.play().catch(() => {}); }, 300);
        });
      });
    }
  }
  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    const sec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (sec < 60) return 'только что';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + ' мин';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + ' ч';
    const day = Math.floor(hr / 24);
    if (day < 30) return day + ' дн';
    const mo = Math.floor(day / 30);
    if (mo < 12) return mo + ' мес';
    const yr = Math.floor(mo / 12);
    return yr + ' г';
  }
  function fmtDuration(sec) {
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
  }

    if (video.readyState >= 2) requestAnimationFrame(reveal);

  }

  function createReel(item, index) {
    const videoUrl = (item.Title || '').trim();
    const videoId = extractVideoId(videoUrl) || ('v' + index);
    const recordId = item.Id || item.id || '';
    const avatar = (item.avtor_avatar || '').trim() || `https://i.pravatar.cc/100?u=${index}`;

    const reel = document.createElement('div');

    reel.dataset.index = index;
    reel.dataset.videoUrl = videoUrl;
    reel.dataset.videoId = videoId;
    reel.dataset.recordId = recordId;

    const hasDescription = description.trim().length > 0;
    const premiumHtml = premiumImg
      ? `<img class="premium-badge" src="${premiumImg}" alt="" onerror="this.style.display='none'">`
      : '';

    reel.innerHTML = `
      <video data-src="${videoUrl}" muted preload="none"
        playsinline webkit-playsinline disablepictureinpicture></video>
      <div class="top-bar">
        <img class="avatar" src="${avatar}" alt="" onerror="this.src='https://i.pravatar.cc/100?u=${index}'">

          <span class="username">${authorName}</span>
          ${premiumHtml}
        </div>
      </div>
      <div class="info">
        <div class="caption-box ${hasDescription ? '' : 'empty'}">
          <div class="caption">${description}</div>
          <div class="caption-toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>

          <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>

            <circle cx="18" cy="16" r="3"/>
          </svg>
          <div class="music-text-wrap">
            <div class="music-text">Оригинальный звук — ${authorName}</div>
          </div>
        </div>
      </div>
    `;

    const captionBox = reel.querySelector('.caption-box');
    const caption = reel.querySelector('.caption');
    if (captionBox && hasDescription) {
      const checkOverflow = () => {
        captionBox.classList.remove('has-overflow');
        const fullHeight = caption.scrollHeight;
        const lineHeight = parseFloat(getComputedStyle(caption).lineHeight) || 20;
        const maxHeight = lineHeight * 3;
        if (fullHeight > maxHeight + 2) captionBox.classList.add('has-overflow');
      };
      requestAnimationFrame(checkOverflow);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => requestAnimationFrame(checkOverflow));
      }
      captionBox.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!captionBox.classList.contains('has-overflow')) return;
        captionBox.classList.toggle('expanded');
      });
      captionBox.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    }

    const video = reel.querySelector('video');
    let rafId = null;
    let lastPct = -1;
    function tickProgress() {
      if (!video.duration || isNaN(video.duration)) {
        rafId = requestAnimationFrame(tickProgress); return;
      }
      const pct = Math.min(100, (video.currentTime / video.duration) * 100);
      if (Math.abs(pct - lastPct) > 0.05 && reel === currentActiveSlide) {
        if (menuProgressFill) menuProgressFill.style.width = pct.toFixed(2) + '%';
        lastPct = pct;
      }
      rafId = requestAnimationFrame(tickProgress);
    }
    function startProgressLoop() { if (rafId) return; lastPct = -1; rafId = requestAnimationFrame(tickProgress); }
    function stopProgressLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    video.addEventListener('play', startProgressLoop);
    video.addEventListener('pause', stopProgressLoop);
    video.addEventListener('seeked', () => {
      if (video.currentTime < 0.1) {
        lastPct = -1;
        if (reel === currentActiveSlide && menuProgressFill) menuProgressFill.style.width = '0%';
      }
    });
    video.removeAttribute('loop');
    video.addEventListener('ended', () => {
      if (!PLAYBACK.autoplay) { video.currentTime = 0; forcePlay(video); return; }
      const currentIndex = parseInt(reel.dataset.index);
      const nextReel = document.querySelector(`.reel[data-index="${currentIndex + 1}"]`);
      if (nextReel) nextReel.scrollIntoView({ behavior: 'smooth' });
      else {
        const firstVideoReel = document.querySelector('.reel:not(.intro-slide)');
        if (firstVideoReel) firstVideoReel.scrollIntoView({ behavior: 'smooth' });
      }
    });
    return reel;
  }

  async function loadReels() {
    const feed = document.getElementById('feed');
    try {
      const response = await fetch(API_CONFIG.tableUrl, {
        method: 'GET',
        headers: { 'xc-token': API_CONFIG.token, 'Content-Type': 'application/json' }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      const data = await response.json();
      let items = data.list || data.records || [];
      items = items.filter(item => isValidVideoUrl(item.Title));
      items = items.slice().reverse();
      feed.innerHTML = '';
      feed.appendChild(createIntroSlide());
      if (items.length > 0) items.forEach((item, i) => feed.appendChild(createReel(item, i + 1)));
      initReels();
      scrollToStartVideo();
      setTimeout(() => {
        const allReels = document.querySelectorAll('.reel');
        if (allReels[1]) ensureVideoLoaded(allReels[1]);
        if (allReels[2]) ensureVideoLoaded(allReels[2]);
      }, 200);
      setTimeout(hideSiteLoader, SITE_LOADER_TIMEOUT);
    } catch (error) {
      console.error('Ошибка загрузки:', error);
      hideSiteLoader();
      feed.innerHTML = `
        <div class="error">
          <div class="icon">⚠️</div>
          <div class="title">Ошибка загрузки</div>
          <div class="msg">${escapeHtml(error.message)}</div>
          <button onclick="location.reload()">Повторить</button>
        </div>
      `;
    }
  }
  function scrollToStartVideo() {
    const id = getStartVideoId();
    if (!id) return;
    const reels = document.querySelectorAll('.reel');
    let target = null;
    reels.forEach(r => { if (r.dataset.videoId === id) target = r; });
    if (!target) return;
    requestAnimationFrame(() => {
      try {
        const feed = document.getElementById('feed');
        if (feed) feed.scrollTop = target.offsetTop;
      } catch (e) { target.scrollIntoView({ behavior: 'auto' }); }
    });
  }

  // ==================== ЛАЙКИ ====================
  const btnLike = document.getElementById('btnLike');
  const likeBadge = document.getElementById('likeBadge');
  const likesCache = {};

  async function fetchLikes(videoId) {
    try {
      const url = API_CONFIG.likesTableUrl +
        `?where=${encodeURIComponent(`(video_id,eq,${videoId})`)}&limit=1000`;
      const res = await fetch(url, {
        headers: { 'xc-token': API_CONFIG.token, 'Content-Type': 'application/json' }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const list = data.list || data.records || [];
      let likedId = '';
      list.forEach(r => {
        if (String(r.user_id) === String(USER.id)) likedId = String(r.Id || r.id || '');
      });
      return { count: list.length, likedId: likedId };
    } catch (err) {
      console.error('Likes fetch error:', err);
      return { count: 0, likedId: '' };
    }
  }

  function updateLikeUI() {
    if (!btnLike || !likeBadge) return;
    const id = currentActiveSlide && currentActiveSlide.dataset.videoId;
    if (!id) { likeBadge.classList.remove('show'); btnLike.classList.remove('liked'); return; }
    const c = likesCache[id] || { count: 0, likedId: '' };
    btnLike.classList.toggle('liked', !!c.likedId);
    if (c.count > 0) {
      likeBadge.textContent = c.count > 999 ? '999+' : String(c.count);
      likeBadge.classList.add('show');
    } else {
      likeBadge.classList.remove('show');
    }
  }

  async function ensureLikesForActive() {
    if (!currentActiveSlide) return;
    const id = currentActiveSlide.dataset.videoId;
    if (!id) return;
    if (likesCache[id]) { updateLikeUI(); return; }
    likesCache[id] = { count: 0, likedId: '' };
    updateLikeUI();
    const res = await fetchLikes(id);
    likesCache[id] = res;
    if (currentActiveSlide && currentActiveSlide.dataset.videoId === id) updateLikeUI();
  }

  async function toggleLike() {
    const id = currentActiveSlide && currentActiveSlide.dataset.videoId;
    if (!id) return;
    const c = likesCache[id] || { count: 0, likedId: '' };
    btnLike.disabled = true;
    try {
      if (c.likedId) {
        const res = await fetch(`${API_CONFIG.likesTableUrl}/${encodeURIComponent(c.likedId)}`, {
          method: 'DELETE',
          headers: { 'xc-token': API_CONFIG.token, 'Content-Type': 'application/json' }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        c.likedId = '';
        c.count = Math.max(0, c.count - 1);
      } else {
        const res = await fetch(API_CONFIG.likesTableUrl, {
          method: 'POST',
          headers: { 'xc-token': API_CONFIG.token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ video_id: id, user_id: USER.id })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const created = await res.json().catch(() => ({}));
        c.likedId = String(created.Id || created.id || 'temp');
        c.count += 1;
        if (currentActiveSlide) {
          const rect = currentActiveSlide.getBoundingClientRect();
          window.triggerGif(currentActiveSlide, rect.width / 2, rect.height / 2);
        }
      }
      likesCache[id] = c;
      updateLikeUI();
    } catch (err) {
      console.error('Like toggle error:', err);
      showToast('Ошибка лайка: ' + err.message);
    } finally {
      btnLike.disabled = false;
    }
  }

  if (btnLike) btnLike.addEventListener('click', (e) => { e.stopPropagation(); toggleLike(); });

  const stickerUploadInput = document.getElementById('stickerUploadInput');
  const voiceBtn = document.getElementById('voiceBtn');
  const recordingIndicator = document.getElementById('recordingIndicator');
  const recordingTime = document.getElementById('recordingTime');
  const recordingCancel = document.getElementById('recordingCancel');

  let replyTarget = null;
  const commentsCache = {};

  // ----- Запись голоса -----
  let mediaRecorder = null;
  let mediaChunks = [];
  let mediaStream = null;
  let recStartTime = 0;
  let recTimerId = null;
  let recCancelled = false;

  function resetRecordingUI() {
    if (voiceBtn) voiceBtn.classList.remove('recording', 'uploading');
    if (recordingIndicator) recordingIndicator.classList.remove('show');
    if (commentSend) commentSend.classList.remove('send-recording');
    if (recTimerId) { clearInterval(recTimerId); recTimerId = null; }
  }

  function startRecording() {
    console.log('[VOICE] startRecording');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('getUserMedia не поддерживается');
      return;
    }
    if (typeof MediaRecorder === 'undefined') {
      showToast('MediaRecorder не поддерживается');
      return;
    }
    if (mediaRecorder) return;

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        mediaStream = stream;
        mediaChunks = [];
        recCancelled = false;

        let mime = '';
        const candidates = [
          'audio/webm;codecs=opus',
          'audio/webm',
          'audio/ogg;codecs=opus',
          'audio/mp4'
        ];
        for (let i = 0; i < candidates.length; i++) {
          if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) {
            mime = candidates[i];
            break;
          }
        }

        try {
          mediaRecorder = mime
            ? new MediaRecorder(stream, { mimeType: mime })
            : new MediaRecorder(stream);
        } catch (e) {
          try { mediaRecorder = new MediaRecorder(stream); }
          catch (e2) {
            showToast('Запись недоступна');
            cleanupStream();
            return;
          }
        }

        mediaRecorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) mediaChunks.push(ev.data);
        };

        mediaRecorder.onerror = (ev) => {
          console.error('[VOICE] onerror:', ev && ev.error);
        };

        mediaRecorder.onstop = () => {
          const stoppedMime = mediaRecorder ? mediaRecorder.mimeType : '';
          cleanupStream();
          if (recCancelled) { resetRecordingUI(); return; }
          const blob = new Blob(mediaChunks, { type: stoppedMime || 'audio/webm' });
          if (blob.size < 500) {
            resetRecordingUI();
            showToast('Слишком короткая запись');
            return;
          }
          if (voiceBtn) {
            voiceBtn.classList.remove('recording');
            voiceBtn.classList.add('uploading');
          }
          uploadVoiceAndSend(blob).finally(() => resetRecordingUI());
        };

        mediaRecorder.start();
        recStartTime = Date.now();

        if (voiceBtn) voiceBtn.classList.add('recording');
        if (recordingIndicator) recordingIndicator.classList.add('show');
        if (commentSend) commentSend.classList.add('send-recording');
        if (recordingTime) recordingTime.textContent = '0:00';

        recTimerId = setInterval(() => {
          const elapsed = (Date.now() - recStartTime) / 1000;
          if (recordingTime) recordingTime.textContent = fmtDuration(elapsed);
          if (elapsed >= 120) stopRecording();
        }, 200);
      })
      .catch(err => {
        console.error('[VOICE] getUserMedia error:', err);
        let msg = 'Нет доступа к микрофону';
        if (err && err.name === 'NotAllowedError') msg = 'Разрешите доступ к микрофону';
        else if (err && err.name === 'NotFoundError') msg = 'Микрофон не найден';
        else if (err && err.name === 'NotReadableError') msg = 'Микрофон занят';
        showToast(msg);
      });
  }

  function cleanupStream() {
    if (mediaStream) {
      try { mediaStream.getTracks().forEach(t => t.stop()); } catch (e) {}
      mediaStream = null;
    }
    mediaRecorder = null;
    mediaChunks = [];
  }

  function stopRecording() {
    if (!mediaRecorder) return;
    try {
      if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    } catch (e) {}
    if (recTimerId) { clearInterval(recTimerId); recTimerId = null; }
  }

  function cancelRecording() {
    if (!mediaRecorder) { resetRecordingUI(); return; }
    recCancelled = true;
    try {
      if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    } catch (e) {}
    if (recTimerId) { clearInterval(recTimerId); recTimerId = null; }
    resetRecordingUI();
  }

  function toggleRecording() {
    if (mediaRecorder) stopRecording();
    else startRecording();
  }

  if (voiceBtn) {
    voiceBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleRecording();
    });
  }
  if (recordingCancel) {
    recordingCancel.addEventListener('click', (e) => {
      e.stopPropagation();
      cancelRecording();
    });
  }

  // === Загрузка голосового: PostFile → base64 fallback ===
  async function uploadVoiceAndSend(blob) {
    console.log('[VOICE] start, size =', blob.size, 'type =', blob.type);

    const ext = (blob.type.indexOf('ogg') !== -1) ? 'ogg'
              : (blob.type.indexOf('mp4') !== -1) ? 'm4a'
              : 'webm';
    const filename = 'voice_' + Date.now() + '.' + ext;

    let url = '';

    // --- Попытка 1: PostFile (multipart) ---
    try {
      console.log('[VOICE] try PostFile');
      const fd = new FormData();
      fd.append('file', blob, filename);
      const res = await fetch(POSTFILE_UPLOAD_URL, {
        method: 'POST',
        headers: { 'X-API-Key': POSTFILE_KEY },
        body: fd
      });
      console.log('[VOICE] PostFile status:', res.status);
      if (res.ok) {
        const data = await res.json();
        console.log('[VOICE] PostFile data:', data);
        if (data && data.url) url = data.url;
      } else {
        const txt = await res.text().catch(() => '');
        console.warn('[VOICE] PostFile not ok:', res.status, txt.slice(0, 200));
      }
    } catch (err) {
      console.warn('[VOICE] PostFile fetch error (CORS?):', err && err.message);
    }

    // --- Попытка 2: если PostFile не дал URL — сохраняем как base64 ---
    if (!url) {
      try {
        console.log('[VOICE] fallback: base64 inline');
        const reader = new FileReader();
        const base64Full = await new Promise((resolve, reject) => {
          reader.onload = () => resolve(String(reader.result || ''));
          reader.onerror = () => reject(new Error('FileReader error'));
          reader.readAsDataURL(blob);
        });
        // Оставляем полный data URL — так проще воспроизводить
        url = base64Full; // "data:audio/webm;base64,...."
        console.log('[VOICE] base64 length =', base64Full.length);
      } catch (err) {
        console.error('[VOICE] base64 error:', err);
        showToast('Не удалось сохранить голосовое');
        return;
      }
    }

    // --- Отправка комментария ---
    try {
      const videoId = await postComment(VOICE_PREFIX + url);
      delete commentsCache[videoId];
      await loadComments(videoId);
      setTimeout(() => {
        if (commentsList) commentsList.scrollTop = commentsList.scrollHeight;
      }, 100);
    } catch (err) {
      console.error('[VOICE] postComment error:', err);
      showToast('Ошибка отправки: ' + err.message);
    }
  }

  // ==================== РЕНДЕР СТИКЕРОВ ====================
  function renderStickerGrid() {
    if (!stickerGrid) return;
    const custom = getCustomStickers();

    const uploadHtml = `
      <div class="sticker-item sticker-upload" id="stickerUploadBtn" title="Загрузить свой стикер">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <div class="spinner-sm"></div>
      </div>
    `;

    const customHtml = custom.map(url => `
      <div class="sticker-item sticker-custom" data-url="${escapeHtml(url)}">
        <img src="${escapeHtml(url)}" alt="" loading="lazy">
        <button class="sticker-remove" data-url="${escapeHtml(url)}" title="Удалить">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    `).join('');

    const baseHtml = STICKERS.map(url => `
      <div class="sticker-item" data-url="${escapeHtml(url)}">
        <img src="${escapeHtml(url)}" alt="" loading="lazy">
      </div>
    `).join('');

    stickerGrid.innerHTML = uploadHtml + customHtml + baseHtml;

    stickerGrid.querySelectorAll('.sticker-item').forEach(item => {
      if (item.id === 'stickerUploadBtn') return;
      item.addEventListener('click', (e) => {
        if (e.target.closest('.sticker-remove')) return;
        const url = item.dataset.url;
        if (url) sendSticker(url);
      });
    });

    const uploadBtn = document.getElementById('stickerUploadBtn');
    if (uploadBtn) {
      uploadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (stickerUploadInput) stickerUploadInput.click();
      });
    }

    stickerGrid.querySelectorAll('.sticker-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const url = btn.dataset.url;
        if (!url) return;
        if (confirm('Удалить стикер?')) {
          removeCustomSticker(url);
          renderStickerGrid();
          showToast('Стикер удалён');
        }
      });
    });
  }

  async function uploadStickerToImgbb(file) {
    const form = new FormData();
    form.append('image', file);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${encodeURIComponent(IMGBB_KEY)}`, {
      method: 'POST',
      body: form
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.success || !data.data) {
      throw new Error((data && data.error && data.error.message) || 'Upload failed');
    }
    return data.data.display_url || data.data.url || '';
  }

  if (stickerUploadInput) {
    stickerUploadInput.addEventListener('change', async () => {
      const file = stickerUploadInput.files && stickerUploadInput.files[0];
      stickerUploadInput.value = '';
      if (!file) return;
      const uploadBtn = document.getElementById('stickerUploadBtn');
      if (uploadBtn) uploadBtn.classList.add('loading');
      try {
        const url = await uploadStickerToImgbb(file);
        if (!url) throw new Error('Пустой ответ');
        addCustomSticker(url);
        renderStickerGrid();
        showToast('Стикер добавлен');
      } catch (err) {
        console.error('Sticker upload error:', err);
        showToast('Не удалось загрузить: ' + err.message);
        const b = document.getElementById('stickerUploadBtn');
        if (b) b.classList.remove('loading');
      }
    });
  }

  // ==================== ЭМОДЗИ ====================
  (function renderEmojiStrip() {
    if (!emojiStrip) return;
    emojiStrip.innerHTML = EMOJIS.map(e =>
      `<button class="emoji-btn" type="button" data-emoji="${e}">${e}</button>`
    ).join('');
    emojiStrip.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        insertEmoji(btn.dataset.emoji || btn.textContent);
      });
    });
  })();

  function insertEmoji(emoji) {
    if (!emoji || !commentInput) return;
    const start = commentInput.selectionStart ?? commentInput.value.length;
    const end = commentInput.selectionEnd ?? commentInput.value.length;
    const before = commentInput.value.slice(0, start);
    const after = commentInput.value.slice(end);
    commentInput.value = before + emoji + after;
    const pos = start + emoji.length;
    commentInput.selectionStart = commentInput.selectionEnd = pos;
    commentInput.style.height = 'auto';
    commentInput.style.height = Math.min(commentInput.scrollHeight, 100) + 'px';
    commentInput.focus();
  }

  function toggleStickerPicker(force) {
    if (!stickerPicker) return;
    const show = typeof force === 'boolean' ? force : !stickerPicker.classList.contains('show');
    stickerPicker.classList.toggle('show', show);
    stickerBtn.classList.toggle('active', show);
    if (show) {
      setTimeout(() => {
        if (commentsList) commentsList.scrollTop = commentsList.scrollHeight;
      }, 50);
    }
  }
  stickerBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleStickerPicker(); });

  function setReplyTarget(target) {
    replyTarget = target;
    if (target) {
      replyToName.textContent = target.name;
      replyIndicator.classList.add('show');
      commentInput.focus();
    } else {
      replyIndicator.classList.remove('show');
    }
  }
  replyCancel.addEventListener('click', () => setReplyTarget(null));

  function openCommentsSheet() {
    const id = currentActiveSlide && currentActiveSlide.dataset.videoId;
    if (!id) { showToast('Откройте видео'); return; }
    commentsBackdrop.classList.add('show');
    commentsSheet.classList.add('show');
    setReplyTarget(null);
    toggleStickerPicker(false);
    if (commentsCache[id]) renderComments(commentsCache[id]);
    else loadComments(id);
  }
  function closeCommentsSheet() {
    commentsBackdrop.classList.remove('show');
    commentsSheet.classList.remove('show');
    setReplyTarget(null);
    toggleStickerPicker(false);
    if (mediaRecorder) cancelRecording();
  }

  async function loadComments(videoId) {
    commentsList.innerHTML = `
      <div class="comments-loading">
        <div class="spinner-mini"></div>
        <div>Загрузка комментариев…</div>
      </div>
    `;
    commentsCountInline.textContent = '';

    try {
      const url = API_CONFIG.commentsTableUrl +
        `?where=${encodeURIComponent(`(video_id,eq,${videoId})`)}` +
        `&sort=${encodeURIComponent('-created_att')}` +
        `&limit=500`;
      const res = await fetch(url, {
        headers: { 'xc-token': API_CONFIG.token, 'Content-Type': 'application/json' }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const items = (data.list || data.records || []).map(mapComment);
      commentsCache[videoId] = items;
      renderComments(items);
      updateCommentBadge(items.length);
    } catch (err) {
      console.error('Comments load error:', err);
      commentsList.innerHTML = `
        <div class="comments-empty">
          <div>Не удалось загрузить комментарии</div>
          <div style="font-size:12px;opacity:.7;margin-top:6px">${escapeHtml(err.message)}</div>
        </div>
      `;
    }
  }

  function mapComment(row) {
    return {
      id: String(row.Id || row.id || ''),
      parentId: String(row.parent_id || ''),
      userId: String(row.user_id || row.USER_ID || ''),
      name: row.user_name || row.USER_NAME || 'Пользователь',
      avatar: resolveImg(row.user_avatar || row.USER_AVATAR || ''),
      premium: resolveImg(row.user_premium_img || row.PREMIUM_IMG || ''),
      text: row.text || row.TEXT || '',
      createdAt: row.created_att || row.created_at || '',
      isOwn: String(row.user_id || row.USER_ID || '') === String(USER.id)
    };
  }

  function renderComments(items) {
    commentsCountInline.textContent = items.length ? '(' + items.length + ')' : '';
    updateCommentBadge(items.length);

    if (!items.length) {
      commentsList.innerHTML = `
        <div class="comments-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z"/>
          </svg>
          <div>Пока нет комментариев</div>
          <div style="font-size:12px;opacity:.7;margin-top:4px">Будьте первым!</div>
        </div>
      `;
      return;
    }

    const roots = items.filter(c => !c.parentId);
    const childrenByParent = {};
    items.forEach(c => {
      if (c.parentId) {
        if (!childrenByParent[c.parentId]) childrenByParent[c.parentId] = [];
        childrenByParent[c.parentId].push(c);
      }
    });

    const html = roots.map(root => {
      const children = (childrenByParent[root.id] || []);
      return `<div class="comment-thread">${renderCommentItem(root, null)}${children.length ? `<div class="comment-replies">${children.map(ch => renderCommentItem(ch, root)).join('')}</div>` : ''}</div>`;
    }).join('');
    commentsList.innerHTML = html;

    commentsList.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = el.dataset.action;
        const id = el.dataset.id;
        const name = el.dataset.name || '';
        if (action === 'reply') setReplyTarget({ id: id, name: name });
        else if (action === 'delete') deleteComment(id);
      });
    });
  }

  function renderCommentItem(c, parentComment) {
    const isSticker = c.text.indexOf(STICKER_PREFIX) === 0;
    const isVoice = c.text.indexOf(VOICE_PREFIX) === 0;
    const stickerUrl = isSticker ? c.text.slice(STICKER_PREFIX.length) : '';
    const voiceUrl = isVoice ? c.text.slice(VOICE_PREFIX.length) : '';
    const safeName = escapeHtml(c.name);
    const av = c.avatar || `https://i.pravatar.cc/100?u=${encodeURIComponent(c.name)}`;
    const timeHtml = c.createdAt
      ? `<span class="comment-time">${escapeHtml(timeAgo(c.createdAt))}</span>`
      : '';
    const premiumHtml = c.premium
      ? `<img class="comment-premium" src="${c.premium}" alt="" onerror="this.style.display='none'">`
      : '';
    const replyTo = (parentComment && c.parentId === parentComment.id)
      ? `<span class="reply-to-badge">→ ${escapeHtml(parentComment.name)}</span>`
      : '';

    let bodyContent;
    if (isSticker) {
      bodyContent = `<img class="comment-sticker" src="${escapeHtml(stickerUrl)}" alt="sticker" onerror="this.style.display='none'">`;
    } else if (isVoice) {
      bodyContent = `
        <div class="comment-voice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 11v1a7 7 0 0 0 14 0v-1"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
            <line x1="8" y1="22" x2="16" y2="22"/>
          </svg>
          <audio controls preload="metadata" src="${escapeHtml(voiceUrl)}"></audio>
        </div>
      `;
    } else {
      bodyContent = `<span>${replyTo}${escapeHtml(c.text)}</span>`;
    }

    const deleteBtn = c.isOwn
      ? `<button class="comment-action-btn danger" data-action="delete" data-id="${escapeHtml(c.id)}">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <polyline points="3 6 5 6 21 6"/>
             <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
             <path d="M10 11v6M14 11v6"/>
           </svg>
           Удалить
         </button>`
      : '';

    return `
      <div class="comment-item ${c.isOwn ? 'is-own' : ''}" data-comment-id="${escapeHtml(c.id)}">
        <img class="comment-avatar" src="${av}" alt="" onerror="this.src='https://i.pravatar.cc/100?u=${encodeURIComponent(c.name)}'">
        <div class="comment-body">
          <div class="comment-head">
            <span class="comment-name">${safeName}</span>
            ${premiumHtml}
            ${timeHtml}
          </div>
          <div class="comment-text">${bodyContent}</div>
          <div class="comment-actions">
            <button class="comment-action-btn" data-action="reply" data-id="${escapeHtml(c.id)}" data-name="${escapeHtml(c.name)}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 17 4 12 9 7"/>
                <path d="M20 18v-2a4 4 0 0 0-4-4H4"/>
              </svg>
              Ответить
            </button>
            ${deleteBtn}
          </div>
        </div>
      </div>
    `;
  }

  async function postComment(text) {
    const videoId = currentActiveSlide && currentActiveSlide.dataset.videoId;
    if (!videoId) throw new Error('Видео не найдено');

    const payload = {
      video_id: videoId,
      user_id: USER.id,
      user_name: USER.name,
      user_avatar: USER.avatar,
      text: text,
      parent_id: replyTarget ? replyTarget.id : ''
    };

    const res = await fetch(API_CONFIG.commentsTableUrl, {
      method: 'POST',
      headers: {
        'xc-token': API_CONFIG.token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status} ${errText.slice(0, 200)}`);
    }
    return videoId;
  }

  async function sendComment() {
    // Если идёт запись — останавливаем её и отправляем голос
    if (mediaRecorder) {
      stopRecording();
      return;
    }
    const text = (commentInput.value || '').trim();
    if (!text) return;
    commentSend.disabled = true;
    try {
      const videoId = await postComment(text);
      commentInput.value = '';
      commentInput.style.height = 'auto';
      setReplyTarget(null);
      toggleStickerPicker(false);
      delete commentsCache[videoId];
      await loadComments(videoId);
    } catch (err) {
      console.error('Send comment error:', err);
      showToast('Не удалось отправить: ' + err.message);
    } finally {
      commentSend.disabled = false;
    }
  }

  async function sendSticker(url) {
    if (!url) return;
    toggleStickerPicker(false);
    try {
      const videoId = await postComment(STICKER_PREFIX + url);
      setReplyTarget(null);
      delete commentsCache[videoId];
      await loadComments(videoId);
      setTimeout(() => {
        if (commentsList) commentsList.scrollTop = commentsList.scrollHeight;
      }, 100);
    } catch (err) {
      console.error('Send sticker error:', err);
      showToast('Не удалось отправить стикер: ' + err.message);
    }
  }

  async function deleteComment(commentId) {
    if (!confirm('Удалить комментарий?')) return;
    try {
      const res = await fetch(
        `${API_CONFIG.commentsTableUrl}/${encodeURIComponent(commentId)}`,
        {
          method: 'DELETE',
          headers: { 'xc-token': API_CONFIG.token, 'Content-Type': 'application/json' }
        }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const videoId = currentActiveSlide && currentActiveSlide.dataset.videoId;
      if (videoId && commentsCache[videoId]) {
        commentsCache[videoId] = commentsCache[videoId].filter(c => String(c.id) !== String(commentId));
        renderComments(commentsCache[videoId]);
      }
      showToast('Комментарий удалён');
    } catch (err) {
      console.error('Delete comment error:', err);
      showToast('Не удалось удалить: ' + err.message);
    }
  }

  function updateCommentBadge(count) {
    if (!commentBadge) return;
    if (count > 0) {
      commentBadge.textContent = count > 999 ? '999+' : String(count);
      commentBadge.classList.add('show');
    } else {
      commentBadge.classList.remove('show');
    }
  }

  if (commentSend) commentSend.addEventListener('click', sendComment);
  if (commentInput) {
    commentInput.addEventListener('input', () => {
      commentInput.style.height = 'auto';
      commentInput.style.height = Math.min(commentInput.scrollHeight, 100) + 'px';
    });
    commentInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendComment();
      }
    });
    commentInput.addEventListener('focus', () => {
      toggleStickerPicker(false);
    });
  }
  commentsClose.addEventListener('click', closeCommentsSheet);
  commentsBackdrop.addEventListener('click', closeCommentsSheet);
  if (btnComments) {
    btnComments.addEventListener('click', (e) => {
      e.stopPropagation();
      openCommentsSheet();
    });
  }

  // ==================== TOAST ====================
  function showToast(message) {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.cssText = `
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30, 30, 32, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      z-index: 99999;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
      max-width: 80vw;
      text-align: center;
    `;
    document.body.appendChild(toast);
    requestAnimationFrame(() => {
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
    });
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(-50%) translateY(20px)';
      setTimeout(() => toast.remove(), 400);
    }, 2500);
  }

  // ==================== SHARE ====================
  const shareModal = document.getElementById('shareModal');
  const shareBackdrop = document.getElementById('shareBackdrop');
  function openShareModal() { shareBackdrop.classList.add('show'); shareModal.classList.add('show'); }
  function closeShareModal() { shareBackdrop.classList.remove('show'); shareModal.classList.remove('show'); }
  function getCurrentDeepLink() {
    if (currentActiveSlide && currentActiveSlide.dataset.videoId) return buildDeepLink(currentActiveSlide.dataset.videoId);
    return window.location.href;
  }
  function shareToContacts() {
    const url = getCurrentDeepLink();
    const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(url);
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && typeof tg.openTelegramLink === 'function') { tg.openTelegramLink(shareUrl); return; }
    if (tg && typeof tg.openLink === 'function') { tg.openLink(shareUrl); return; }
    window.open(shareUrl, '_blank');
  }
  function shareToStory() {
    const originalUrl = currentActiveSlide && currentActiveSlide.dataset.videoUrl;
    if (!originalUrl) { showToast('Ссылка на видео не найдена'); return; }
    const tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) { showToast('Доступно только в Telegram'); return; }
    if (typeof tg.shareToStory !== 'function') { showToast('Обновите Telegram для этой функции'); return; }
    try { tg.shareToStory(originalUrl, { text: 'Видео опубликовано с помощью @brootsbot' }); }
    catch (err) { console.error('shareToStory error:', err); showToast('Не удалось поделиться в историю'); }
  }
  document.getElementById('shareContacts').addEventListener('click', () => { closeShareModal(); setTimeout(shareToContacts, 200); });
  document.getElementById('shareStoryBtn').addEventListener('click', () => { closeShareModal(); setTimeout(shareToStory, 200); });
  shareBackdrop.addEventListener('click', closeShareModal);

  // ==================== ПАНЕЛЬ ====================
  function setupSidePanel() {
    const btnMute = document.getElementById('btnMute');
    const btnAutoplay = document.getElementById('btnAutoplay');
    const btnShare = document.getElementById('btnShare');
    btnMute.addEventListener('click', (e) => {
      e.stopPropagation();
      PLAYBACK.muted = !PLAYBACK.muted;
      document.querySelectorAll('video').forEach(v => { v.muted = PLAYBACK.muted; });
      btnMute.classList.toggle('muted', PLAYBACK.muted);
      btnMute.title = PLAYBACK.muted ? 'Включить звук' : 'Выключить звук';
    });
    btnAutoplay.addEventListener('click', (e) => {
      e.stopPropagation();
      PLAYBACK.autoplay = !PLAYBACK.autoplay;
      btnAutoplay.classList.toggle('active', PLAYBACK.autoplay);
      btnAutoplay.title = PLAYBACK.autoplay ? 'Выключить автопрокрутку' : 'Включить автопрокрутку';
      showToast(PLAYBACK.autoplay ? 'Автопрокрутка включена' : 'Автопрокрутка выключена');
    });
    btnShare.addEventListener('click', (e) => { e.stopPropagation(); openShareModal(); });
    if (!PLAYBACK.autoplay) {
      btnAutoplay.classList.remove('active');
      btnAutoplay.title = 'Включить автопрокрутку';
    }
  }

  // ==================== ИНИЦИАЛИЗАЦИЯ ====================
  function initReels() {
    const feed = document.getElementById('feed');
    const reels = document.querySelectorAll('.reel');
    const pauseIcon = document.getElementById('pauseIcon');
    const bottomMenu = document.getElementById('bottomMenu');
    const sidePanel = document.getElementById('sidePanel');
    let currentIndex = 0;

    reels.forEach((reel) => {
      const video = reel.querySelector('video');
      if (!video) return;
      let clickTimer = null;
      let lastTap = 0;

      reel.addEventListener('click', (e) => {
        if (reel.classList.contains('intro-slide')) return;
        if (e.target.closest('.info, .caption-box, .bottom-menu, .side-panel, .top-bar')) return;

        const now = Date.now();
        const timeSinceLastTap = now - lastTap;
        if (timeSinceLastTap < 300 && timeSinceLastTap > 0) {
          clearTimeout(clickTimer);
          lastTap = 0;
          triggerGif(reel, e.clientX, e.clientY);
          const id = reel.dataset.videoId;
          if (id && reel === currentActiveSlide) {
            const c = likesCache[id] || { count: 0, likedId: '' };
            if (!c.likedId) toggleLike();
          }
        } else {
          lastTap = now;
          clickTimer = setTimeout(() => {
            if (!video.paused) {
              video.pause();
              pauseIcon.classList.add('show');
              setTimeout(() => pauseIcon.classList.remove('show'), 700);
            } else {
              forcePlay(video);
            }
          }, 300);
        }
      });
    });

    window.triggerGif = triggerGif;
    function triggerGif(reel, x, y) {
      const rect = reel.getBoundingClientRect();
      const heart = document.createElement('div');
      heart.className = 'tap-gif';
      heart.textContent = REACTION_EMOJI;
      heart.style.left = (x - rect.left) + 'px';
      heart.style.top = (y - rect.top) + 'px';
      reel.appendChild(heart);
      requestAnimationFrame(() => heart.classList.add('animate'));
      setTimeout(() => {
        if (heart.parentNode) heart.parentNode.removeChild(heart);
      }, 1500);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting || entry.intersectionRatio <= 0.6) return;
        const index = parseInt(entry.target.dataset.index);
        currentIndex = index;
        currentActiveSlide = entry.target;
        const isIntroSlide = entry.target.classList.contains('intro-slide');

        if (isIntroSlide) {
          bottomMenu.classList.add('menu-hidden');
          sidePanel.classList.add('hidden');
          if (menuProgressFill) menuProgressFill.style.width = '0%';
        } else {
          bottomMenu.classList.remove('menu-hidden');
          sidePanel.classList.remove('hidden');
          if (menuProgressFill) menuProgressFill.style.width = '0%';
          updateLikeUI();
          ensureLikesForActive();
          const vid = entry.target.dataset.videoId;
          if (vid && commentsCache[vid]) updateCommentBadge(commentsCache[vid].length);
          else updateCommentBadge(0);
        }

        reels.forEach((r, i) => {
          const v = r.querySelector('video');
          if (!v) return;
          if (i === index || i === index - 1 || i === index + 1) {
            ensureVideoLoaded(r);
          }
          if (i === index) {
            if (isIntroSlide) forcePlay(v);
            else {
              try { v.currentTime = 0; } catch (e) {}
              forcePlay(v);
            }
          } else {
            v.pause();
          }
        });
      });
    }, { root: feed, threshold: [0.6] });
    reels.forEach(reel => observer.observe(reel));

    const resumeAll = () => {
      const currentReel = reels[currentIndex];
      if (!currentReel) return;
      const currentVideo = currentReel.querySelector('video');
      if (currentVideo && currentVideo.paused) forcePlay(currentVideo);
    };
    document.addEventListener('touchstart', resumeAll, { passive: true });
    document.addEventListener('click', resumeAll);

    document.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
      if (e.target && e.target.closest && e.target.closest('.comments-sheet, .share-modal')) return;

      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const dir = e.key === 'ArrowDown' ? 1 : -1;
        const next = Math.max(0, Math.min(reels.length - 1, currentIndex + dir));
        reels[next].scrollIntoView({ behavior: 'smooth' });
      }
      if (e.key === ' ' || e.key === 'k') {
        e.preventDefault();
        const currentReel = reels[currentIndex];
        if (!currentReel || currentReel.classList.contains('intro-slide')) return;
        const video = currentReel.querySelector('video');
        if (!video) return;
        if (video.paused) forcePlay(video); else video.pause();
      }
      if (e.key === 'm') { const b = document.getElementById('btnMute'); if (b) b.click(); }
      if (e.key === 'l') { if (btnLike) btnLike.click(); }
      if (e.key === 'c') { if (btnComments) btnComments.click(); }
      if (e.key === 'Escape') { closeCommentsSheet(); closeShareModal(); }
    });

    let wheelTimeout = null;
    let wheelAccum = 0;
    feed.addEventListener('wheel', (e) => {
      e.preventDefault();
      wheelAccum += e.deltaY;
      clearTimeout(wheelTimeout);
      wheelTimeout = setTimeout(() => {
        if (Math.abs(wheelAccum) > 30) {
          const dir = wheelAccum > 0 ? 1 : -1;
          const next = Math.max(0, Math.min(reels.length - 1, currentIndex + dir));
          reels[next].scrollIntoView({ behavior: 'smooth' });
        }
        wheelAccum = 0;
      }, 50);
    }, { passive: false });
  }

  // ==================== СТАРТ ====================
  function start() {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { try { tg.ready(); tg.expand(); } catch (err) {} }
    setupSidePanel();
    renderStickerGrid();
    loadReels();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
