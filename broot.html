<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b13">
<title>HeartLink — знакомства</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0d0b13;--card:#1b1729;--card-2:#241e35;--text:#f4f1fa;--muted:#9b93b2;
  --accent:#ff4d79;--accent2:#ff8a5b;--green:#28d17c;--danger:#ff5f5f;
  --border:rgba(255,255,255,.09);--radius:24px;
}
html,body{height:100%;}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color:var(--text);background-color:#0d0b13;
  background-image:
    radial-gradient(900px 520px at 12% -12%, rgba(255,77,121,.25), transparent 62%),
    radial-gradient(820px 520px at 92% -4%, rgba(122,86,255,.22), transparent 62%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:16px;}
img{display:block;}
h1,h2,h3{margin:0;}
.muted-text{color:var(--muted);font-size:14.5px;line-height:1.5;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

#app{max-width:520px;margin:0 auto;padding:0 0 110px;min-height:100%;}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:linear-gradient(180deg, rgba(13,11,19,.96) 65%, rgba(13,11,19,0));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.logo{font-weight:800;font-size:19px;letter-spacing:.3px;
  background:linear-gradient(90deg,#ff4d79,#ff8a5b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.top-emoji{font-size:20px;cursor:pointer;}

#bottomNav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);
  display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(20,16,30,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);z-index:60;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:16px;
  color:var(--muted);transition:background .2s, color .2s, transform .15s;}
.nav-btn span{font-size:20px;line-height:1;transition:transform .2s;}
.nav-btn em{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.1px;}
.nav-btn.active{color:#fff;background:rgba(255,77,121,.14);}
.nav-btn.active span{transform:translateY(-1px) scale(1.12);}
.nav-btn:active{transform:scale(.94);}

.filters{padding:0 16px 14px;}
.filters-toggle{width:100%;padding:13px 16px;border-radius:18px;background:var(--card);
  border:1px solid var(--border);font-size:14px;font-weight:600;color:#d8d3e6;text-align:left;
  display:flex;align-items:center;justify-content:space-between;transition:transform .15s;}
.filters-toggle:active{transform:scale(.98);}
.filters-toggle .chev{transition:transform .25s;color:var(--muted);font-size:12px;}
.filters.open .filters-toggle .chev{transform:rotate(180deg);}
.filters-body{display:none;flex-direction:column;gap:11px;margin-top:11px;padding:16px;border-radius:20px;
  background:var(--card);border:1px solid var(--border);animation:cardIn .3s ease;}
.filters.open .filters-body{display:flex;}

.deck{padding:0 16px;}
.card{position:relative;border-radius:28px;overflow:hidden;background:var(--card);border:1px solid var(--border);
  box-shadow:0 24px 60px rgba(0,0,0,.55);animation:cardIn .42s cubic-bezier(.2,.8,.25,1);will-change:transform,opacity;}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:none;}}
.card.fly-right{animation:flyRight .32s ease forwards;}
@keyframes flyRight{to{opacity:0;transform:translateX(125%) rotate(14deg);}}
.card-photo{position:relative;height:clamp(260px,46vh,430px);background:var(--card-2);}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.photo-shade{position:absolute;left:0;right:0;bottom:0;height:45%;
  background:linear-gradient(180deg,transparent,rgba(20,16,30,.92));pointer-events:none;}
.card-counter{position:absolute;top:12px;right:12px;padding:5px 11px;border-radius:20px;font-size:12px;
  font-weight:600;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.card-body{padding:16px 18px 20px;}
.card-body h2{font-size:23px;font-weight:800;line-height:1.15;}
.card-city{color:var(--muted);font-size:13.5px;margin-top:4px;}
.card-desc{margin:11px 0 0;font-size:14.5px;line-height:1.5;color:#d8d3e6;}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.tag{font-size:12px;padding:5px 11px;border-radius:20px;background:rgba(255,77,121,.13);color:#ff9db6;font-weight:600;}
.deck-actions{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:20px;}
.act{width:64px;height:64px;border-radius:50%;font-size:26px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--border);box-shadow:0 10px 26px rgba(0,0,0,.45);
  transition:transform .16s ease, box-shadow .2s;}
.act:active{transform:scale(.9);}
.act-like{background:linear-gradient(135deg,#ff4d79,#ff7a4d);border-color:transparent;
  box-shadow:0 12px 30px rgba(255,77,121,.45);}
.act-skip{width:52px;height:52px;font-size:18px;color:var(--muted);}
.act-comment{background:var(--card-2);}
.btn-open-profile{display:block;width:100%;margin:16px 0 0;padding:14px;border-radius:18px;
  background:var(--card);border:1px solid var(--border);font-weight:600;font-size:15px;color:#d8d3e6;transition:transform .15s;}
.btn-open-profile:active{transform:scale(.98);}

.tabs{display:flex;gap:7px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:9px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);font-size:13.5px;font-weight:600;white-space:nowrap;transition:.2s;}
.tab.active{background:linear-gradient(135deg,#ff4d79,#ff7a4d);color:#fff;border-color:transparent;}
.tab:active{transform:scale(.95);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px;}
.mini{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;animation:cardIn .35s ease;}
.mini-photo{height:168px;background:var(--card-2);}
.mini-photo img{width:100%;height:100%;object-fit:cover;}
.mini-body{padding:10px 12px 6px;}
.mini-name{font-weight:700;font-size:14.5px;}
.mini-city{font-size:12px;color:var(--muted);margin-top:2px;}
.mini-actions{display:flex;gap:6px;padding:8px 10px 10px;}
.mini-actions button{flex:1;padding:9px;border-radius:12px;background:var(--card-2);font-size:15px;transition:transform .15s;}
.mini-actions button:active{transform:scale(.93);}

.me{padding:0 16px;}
.me-photo{position:relative;border-radius:26px;overflow:hidden;height:clamp(240px,40vh,380px);
  background:var(--card-2);border:1px solid var(--border);}
.me-photo img{width:100%;height:100%;object-fit:cover;}
.me-info{margin-top:16px;}
.me-info h2{font-size:24px;font-weight:800;}
.me-info .city{color:var(--muted);font-size:14px;margin-top:4px;}
.me-info .desc{margin-top:12px;font-size:14.5px;line-height:1.55;color:#d8d3e6;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;text-align:center;}
.stat b{display:block;font-size:26px;font-weight:800;
  background:linear-gradient(90deg,#ff4d79,#ff8a5b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat span{font-size:12.5px;color:var(--muted);}
.actions-col{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

.pv{padding:0 16px;}
.pv-photo{position:relative;border-radius:26px;overflow:hidden;height:clamp(300px,52vh,520px);
  background:var(--card-2);border:1px solid var(--border);}
.pv-photo img{width:100%;height:100%;object-fit:cover;}
.pv-back{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;font-size:18px;z-index:3;}
.pv-body{padding:18px 4px 0;}
.pv-body h2{font-size:25px;font-weight:800;}
.pv-body .city{color:var(--muted);font-size:14px;margin-top:4px;}
.pv-body .desc{margin-top:13px;font-size:15px;line-height:1.55;color:#d8d3e6;}

.form{display:flex;flex-direction:column;gap:12px;}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;}
.form input,.form textarea,.form select{width:100%;padding:13px 14px;border-radius:14px;
  background-color:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  outline:none;transition:border-color .2s, background .2s;}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--accent);background-color:rgba(255,77,121,.07);}
.form textarea{resize:vertical;min-height:80px;}
.form select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#9b93b2 50%),linear-gradient(135deg,#9b93b2 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:38px;}
option{background:#1b1729;color:#f4f1fa;}
.form .check{flex-direction:row;align-items:center;gap:9px;font-size:13.5px;color:#d8d3e6;}
.form .check input{width:18px;height:18px;accent-color:#ff4d79;padding:0;}

.btn-primary{width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:15.5px;color:#fff;
  background:linear-gradient(135deg,#ff4d79,#ff7a4d);box-shadow:0 12px 28px rgba(255,77,121,.35);transition:transform .16s;}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.55;}
.btn-ghost{width:100%;padding:15px;border-radius:16px;font-weight:600;font-size:15px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);color:#d8d3e6;transition:transform .16s;}
.btn-ghost:active{transform:scale(.97);}

.photo-picker{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px;}
.photo-picker img{width:130px;height:130px;border-radius:50%;object-fit:cover;
  border:3px solid rgba(255,77,121,.4);background:var(--card-2);}
.photo-btn{padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.07);
  border:1px solid var(--border);font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .15s;}
.photo-btn:active{transform:scale(.96);}

.modal-backdrop{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(5,4,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transition:opacity .22s ease;}
.modal-backdrop.show{opacity:1;}
.modal{width:min(520px,100%);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#171323;border:1px solid var(--border);border-radius:26px 26px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(26px);transition:transform .28s cubic-bezier(.2,.8,.25,1);}
.modal-backdrop.show .modal{transform:none;}
@media (min-width:640px){
  .modal-backdrop{align-items:center;padding:24px;}
  .modal{border-radius:26px;max-height:88vh;}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.modal-head h3{font-size:18px;font-weight:800;}
.modal-close{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);
  font-size:15px;color:var(--muted);display:grid;place-items:center;transition:transform .15s;}
.modal-close:active{transform:scale(.9);}
.modal-foot{margin-top:16px;}
.err{color:var(--danger);font-size:13px;min-height:16px;font-weight:600;}

.comment-target{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
.comment-target img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--card-2);}
.comment-target b{display:block;font-size:15px;}
.comment-target span{font-size:12.5px;color:var(--muted);}
.counter{text-align:right;font-size:12px;color:var(--muted);margin-top:6px;}

.match-box{text-align:center;padding:6px 0 0;}
.match-heart{font-size:64px;line-height:1;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.16);}}
.match-box h2{margin:12px 0 6px;font-size:23px;font-weight:800;}
.match-box p{margin:0 0 16px;color:var(--muted);font-size:14px;}
.match-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:0 auto;
  border:3px solid rgba(40,209,124,.55);background:var(--card-2);}
.match-name{margin-top:10px;font-weight:700;font-size:16px;}

.auth-overlay{position:fixed;inset:0;z-index:150;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background-color:#0d0b13;
  background-image:
    radial-gradient(900px 520px at 12% -12%, rgba(255,77,121,.25), transparent 62%),
    radial-gradient(820px 520px at 92% -4%, rgba(122,86,255,.22), transparent 62%);
  padding:32px 18px calc(44px + env(safe-area-inset-bottom,0px));}
.auth-card{max-width:480px;margin:0 auto;}
.auth-logo{font-size:54px;text-align:center;line-height:1;}
.auth-card h1{text-align:center;margin:8px 0 6px;font-size:27px;font-weight:800;}
.auth-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 24px;}

#toastRoot{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,92vw);}
.toast{width:100%;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;
  background:rgba(30,24,44,.97);border:1px solid var(--border);color:#f4f1fa;
  box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;transform:translateY(14px);transition:.28s;}
.toast.show{opacity:1;transform:none;}
.toast-success{border-color:rgba(40,209,124,.5);}
.toast-error{border-color:rgba(255,95,95,.55);}
.toast-warn{border-color:rgba(255,190,80,.5);}

.empty{padding:60px 24px;text-align:center;color:var(--muted);}
.empty-icon{font-size:52px;margin-bottom:12px;line-height:1;}
.empty h3{color:var(--text);margin:0 0 8px;font-size:19px;}
.empty p{margin:0 0 20px;font-size:14px;line-height:1.5;}
.empty .btn-primary{max-width:280px;margin:0 auto;}
.section-title{padding:0 16px 12px;font-size:13px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;}

.badge-auto{display:inline-block;margin-left:6px;font-size:10px;padding:2px 6px;border-radius:8px;
  background:rgba(40,209,124,.18);color:#6ee9a4;font-weight:700;letter-spacing:.3px;vertical-align:middle;}

/* ===== DEBUG PANEL ===== */
#debugPanel{
  position:fixed;left:8px;right:8px;bottom:calc(120px + env(safe-area-inset-bottom,0px));
  max-height:44vh;overflow-y:auto;background:rgba(10,8,16,.94);
  border:1px solid rgba(255,255,255,.15);border-radius:14px;
  padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
  color:#cfc8e0;z-index:90;display:none;line-height:1.5;white-space:pre-wrap;word-break:break-word;
}
#debugPanel.show{display:block;}
#debugPanel .dbg-ok{color:#6ee9a4;}
#debugPanel .dbg-err{color:#ff8080;}
#debugPanel .dbg-info{color:#9cc2ff;}
#debugPanel .dbg-hd{padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;color:#fff;font-weight:700;}
#debugPanel .dbg-hd span{cursor:pointer;color:#ff8080;}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="logo">💖 HeartLink</div>
    <div class="top-emoji" id="topEmoji" title="Отладка">🐞</div>
  </header>
  <main id="view"></main>
</div>

<nav id="bottomNav">
  <button class="nav-btn" data-view="discover"><span>🔎</span><em>Знакомства</em></button>
  <button class="nav-btn" data-view="likes"><span>❤️</span><em>Лайки</em></button>
  <button class="nav-btn" data-view="matches"><span>💚</span><em>Взаимные</em></button>
  <button class="nav-btn" data-view="me"><span>👤</span><em>Моя анкета</em></button>
</nav>

<div id="debugPanel">
  <div class="dbg-hd">🐞 Отладка <span id="dbgClose">закрыть</span></div>
  <div id="dbgBody"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";

/* ================================================================
   CONFIGURATION
   ================================================================ */
const DEMO_MODE = false;

const CONFIG = {
  usersTableUrl:         "https://nocodb.puzzlebot.top/api/v2/tables/myavvyt83qvewaf/records",
  profilesTableUrl:      "https://nocodb.puzzlebot.top/api/v2/tables/mygnkngvzgdml67/records",
  likesTableUrl:         "https://nocodb.puzzlebot.top/api/v2/tables/mfqpfkxnfy261v6/records",
  matchesTableUrl:       "https://nocodb.puzzlebot.top/api/v2/tables/muyc3dcysl45uji/records",
  commentsTableUrl:      "https://nocodb.puzzlebot.top/api/v2/tables/m17mzz95ypg36u5/records",
  notificationsTableUrl: "https://nocodb.puzzlebot.top/api/v2/tables/mxr1i1f2fypq0bm/records",
  apiToken: "kFqvkaYA9_ZMb3oTH4D8m0Brsj84hJRDN68RDP9O",
  telegramBotToken: "8842784777:AAFG_J4NEmV_8hmXPgw8gToaASnWB0dmS68",
  telegramProxyUrl: "",
  publicBaseUrl: ""
};

/* ============ ИМЕНА ПОЛЕЙ ============
   Id — системное поле NocoDB.
   created_att / updated_att — ваши переименования.
   Если у вас они называются иначе, поменяйте ЗДЕСЬ.
   Если в базе created_at (без второго t), поставьте 'created_at'.
   ВАЖНО: код умеет работать, даже если колонки нет — просто не будет её заполнять.
======================================== */
const FIELD_ID      = 'Id';
const FIELD_CREATED = 'created_att';
const FIELD_UPDATED = 'updated_att';

/* ================================================================
   DEBUG PANEL
   ================================================================ */
const DEBUG_LOG = [];
function dlog(type, text){
  const time = new Date().toLocaleTimeString();
  const line = '[' + time + '] ' + text;
  DEBUG_LOG.push({ type: type, text: line });
  if (DEBUG_LOG.length > 200) DEBUG_LOG.shift();
  const box = document.getElementById('dbgBody');
  if (box){
    const cls = type === 'ok' ? 'dbg-ok' : type === 'err' ? 'dbg-err' : 'dbg-info';
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = line;
    box.appendChild(div);
    box.parentElement.scrollTop = box.parentElement.scrollHeight;
  }
  if (type === 'err') console.error(line);
  else if (type === 'ok') console.log(line);
  else console.log(line);
}
function showDebug(){ document.getElementById('debugPanel').classList.add('show'); }
function hideDebug(){ document.getElementById('debugPanel').classList.remove('show'); }

/* ================================================================
   ВСПОМОГАТЕЛЬНЫЕ
   ================================================================ */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nowIso = () => new Date().toISOString();

function esc(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function clampNum(v, min, max, def){
  const n = Number(v); if (!isFinite(n)) return def;
  return Math.min(max, Math.max(min, n));
}
function lsGet(k, d){ try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

const SESSION_KEY = 'heartlink_session_v4';
const SEQ_KEY     = 'heartlink_seq_v4';
const SENT_KEY    = 'heartlink_sent_v4';

function nextSeq(name, start){
  const all = lsGet(SEQ_KEY, {});
  const cur = Number(all[name]) || (start - 1);
  const next = cur + 1;
  all[name] = next; lsSet(SEQ_KEY, all);
  return next;
}
function wasSent(k){ return !!lsGet(SENT_KEY, {})[k]; }
function markSent(k){ const s = lsGet(SENT_KEY, {}); s[k] = 1; lsSet(SENT_KEY, s); }

function readPlatformVars(){
  const out = {};
  function set(k, v){
    if (v === null || v === undefined) return;
    const s = String(v).trim(); if (!s) return;
    if (out[k] === undefined) out[k] = s;
  }
  try {
    const tg = window.Telegram && window.Telegram.WebApp;
    const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u){
      set('USER_ID_TEXT', u.id);
      set('FIRST_NAME_TEXT', u.first_name);
      set('LAST_NAME_TEXT', u.last_name);
      set('USERNAME_TEXT', u.username);
      set('USER_AVATAR_URL', u.photo_url);
      set('HAS_PREMIUM_BOOL', u.is_premium ? '1' : '0');
      set('MINI_APP_SESSION_LANG_CODE', u.language_code);
      const full = [u.first_name, u.last_name].filter(Boolean).join(' ');
      set('FULL_NAME', full);
      set('FIRST_AND_LAST_NAME_TEXT', full);
    }
  } catch(e){}
  try {
    const p = new URLSearchParams(location.search || '');
    p.forEach(function(v, k){ set(k, v); });
  } catch(e){}
  try {
    const h = location.hash || '';
    const qi = h.indexOf('?');
    if (qi !== -1){
      const p = new URLSearchParams(h.slice(qi + 1));
      p.forEach(function(v, k){ set(k, v); });
    }
  } catch(e){}
  ['BROOT_VARS','PLATFORM_VARS','BOT_VARS','INIT_VARS','TG_USER_VARS'].forEach(function(n){
    const o = window[n];
    if (o && typeof o === 'object'){
      for (const k in o) if (Object.prototype.hasOwnProperty.call(o, k)) set(k, o[k]);
    }
  });
  return out;
}
const PLATFORM = readPlatformVars();

    [PLATFORM.FIRST_NAME_TEXT, PLATFORM.LAST_NAME_TEXT].filter(Boolean).join(' ') || ''
  ).slice(0, 50);
}

function platformAvatarUrl(){ return PLATFORM.USER_AVATAR_URL || ''; }
function platformUsername(){ return PLATFORM.USERNAME_TEXT || ''; }

/* ================================================================
   ROUTING
   ================================================================ */
function computeBaseUrl(){
  if (CONFIG.publicBaseUrl) return CONFIG.publicBaseUrl.replace(/\/?$/, '/');
  if (location.protocol === 'file:') return location.href.split('#')[0].split('?')[0];
  let p = location.pathname.replace(/\/(profile|p)\/[^\/]+\/?$/i, '/');
  p = p.replace(/index\.html$/i, '');
  if (!p.endsWith('/')) p = p.replace(/\/[^\/]*$/, '/');
  if (!p) p = '/';
  return location.origin + p;
}
function profileLink(pid){
  const base = computeBaseUrl();
  if (location.protocol === 'file:') return base + '#/profile/' + pid;
  return base.replace(/\/$/, '') + '/profile/' + pid;
}
function getRoute(){
  const path = location.pathname || '';
  let m = path.match(/\/(?:profile|p)\/([^\/?#]+)/i);
  if (m) return { view: 'profile', profileId: decodeURIComponent(m[1]) };
  const hash = (location.hash || '').replace(/^#\/?/, '');
  m = hash.match(/^(?:profile|p)\/([^\/?#]+)/i);
  if (m) return { view: 'profile', profileId: decodeURIComponent(m[1]) };
  if (['discover','likes','matches','me'].indexOf(hash) !== -1) return { view: hash };
  return { view: 'discover' };
}
function navigateTo(v){
  state.view = v; state.viewProfileId = null;
  if (v === 'discover') state.deckIndex = 0;
  try {
    if (location.protocol === 'file:'){
      if (location.hash !== '#' + v) location.hash = '#' + v;
    } else {
      history.pushState({}, '', computeBaseUrl() + '#' + v);
    }
  } catch(e){}
  render(); window.scrollTo(0, 0);
}
function goToProfile(pid){
  if (!pid) return;
  state.view = 'profile'; state.viewProfileId = pid;
  try {
    if (location.protocol === 'file:') location.hash = '#/profile/' + pid;
    else history.pushState({}, '', profileLink(pid));
  } catch(e){ try { location.hash = '#/profile/' + pid; } catch(e2){} }
  render(); window.scrollTo(0, 0);
}

function toast(msg, type){
  const root = $('#toastRoot'); if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 320); }, 3000);
  dlog(type === 'error' ? 'err' : type === 'success' ? 'ok' : 'info', 'TOAST: ' + msg);
}
function escKeyHandler(e){ if (e.key === 'Escape') closeModal(); }
function closeModal(){
  const root = $('#modalRoot'); if (!root) return;
  const wrap = root.querySelector('.modal-backdrop'); if (!wrap) return;
  wrap.classList.remove('show');
  document.removeEventListener('keydown', escKeyHandler);
  setTimeout(() => wrap.remove(), 260);
}
function openModal(opts){
  const o = opts || {};
  const root = $('#modalRoot');
  const old = root.querySelector('.modal-backdrop'); if (old) old.remove();
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head">' +
        '<h3>' + (o.title || '') + '</h3>' +
        '<button class="modal-close" data-close="1" type="button">✕</button>' +
      '</div>' +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.footer ? '<div class="modal-foot">' + o.footer + '</div>' : '') +
    '</div>';
  root.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('show'));
  wrap.addEventListener('click', function(e){
    if (e.target === wrap || (e.target.dataset && e.target.dataset.close)) closeModal();
  });
  document.addEventListener('keydown', escKeyHandler);
  if (typeof o.onMount === 'function') o.onMount(wrap);
  return wrap;
}

/* ================================================================
   NOCODB CRUD
   ================================================================ */
function tableUrl(table){
  const m = {
    users:         CONFIG.usersTableUrl,
    profiles:      CONFIG.profilesTableUrl,
    likes:         CONFIG.likesTableUrl,
    matches:       CONFIG.matchesTableUrl,
    comments:      CONFIG.commentsTableUrl,
    notifications: CONFIG.notificationsTableUrl
  };
  if (!m[table]) throw new Error('Неизвестная таблица: ' + table);
  return m[table];
}
function ncHeaders(){
  const h = { 'Content-Type': 'application/json' };
  if (CONFIG.apiToken) h['xc-token'] = CONFIG.apiToken;
  return h;
}

/* Разбор ответа */
async function parseNoco(res, action){
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch(e){}
  if (!res.ok){
    const msg = (json && (json.msg || json.message || json.error)) || text || res.statusText;
    dlog('err', 'NocoDB ' + action + ' ' + res.status + ': ' + msg);
    throw new Error('NocoDB ' + res.status + ': ' + msg);
  }
  return json;
}

/* ---------- LIST ---------- */
async function dbList(table){
  const url = tableUrl(table) + '?limit=1000';
  dlog('info', 'GET ' + table);
  const res = await fetch(url, { method: 'GET', headers: ncHeaders() });
  const json = await parseNoco(res, 'GET ' + table);
  const list = (json && (json.list || json.records)) || [];
  dlog('ok', 'GET ' + table + ' → ' + list.length + ' записей');
  return list;
}

/* ---------- INSERT (с fallback) ---------- */
async function dbInsert(table, record){
  const url = tableUrl(table);
  dlog('info', 'POST ' + table + ' → ' + JSON.stringify(record).slice(0, 200));

  let res = await fetch(url, {
    method: 'POST',
    headers: ncHeaders(),
    body: JSON.stringify(record)
  });
  let text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch(e){}

  /* Если ошибка 400 и она упоминает created_att / updated_att —
     пробуем снова без этих полей */
  if (!res.ok && res.status === 400){
    const combined = (text + ' ' + JSON.stringify(json || {})).toLowerCase();
    if (combined.indexOf('created_att') !== -1 ||
        combined.indexOf('updated_att') !== -1 ||
        combined.indexOf('created_at')  !== -1 ||
        combined.indexOf('updated_at')  !== -1 ||
        combined.indexOf('column') !== -1 ||
        combined.indexOf('field') !== -1){

      dlog('err', 'POST ' + table + ' 400 (проблема с датой). Повтор без ' + FIELD_CREATED + ' / ' + FIELD_UPDATED);
      const copy = Object.assign({}, record);
      delete copy[FIELD_CREATED];
      delete copy[FIELD_UPDATED];

      res = await fetch(url, {
        method: 'POST',
        headers: ncHeaders(),
        body: JSON.stringify(copy)
      });
      text = await res.text();
      try { json = text ? JSON.parse(text) : null; } catch(e){ json = null; }

      if (res.ok){
        dlog('ok', 'POST ' + table + ' → OK (без даты)');
        return json;
      }
    }
  }

  if (!res.ok){
    const msg = (json && (json.msg || json.message || json.error)) || text || res.statusText;
    dlog('err', 'POST ' + table + ' ' + res.status + ': ' + msg);
    throw new Error('NocoDB ' + res.status + ': ' + msg);
  }

  dlog('ok', 'POST ' + table + ' → OK');
  return json;
}

/* ---------- UPDATE ---------- */
async function dbUpdate(table, id, patch){
  const payload = Object.assign({}, patch);
  payload[FIELD_ID] = id;
  const url = tableUrl(table);
  dlog('info', 'PATCH ' + table + ' Id=' + id);

  let res = await fetch(url, {
    method: 'PATCH',
    headers: ncHeaders(),
    body: JSON.stringify(payload)
  });
  let text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch(e){}

  if (!res.ok && res.status === 400){
    const combined = (text + ' ' + JSON.stringify(json || {})).toLowerCase();
    if (combined.indexOf('updated_att') !== -1 || combined.indexOf('updated_at') !== -1){
      dlog('err', 'PATCH 400 (проблема с ' + FIELD_UPDATED + '). Повтор без него');
      const copy = Object.assign({}, patch);
      copy[FIELD_ID] = id;
      delete copy[FIELD_UPDATED];
      res = await fetch(url, { method: 'PATCH', headers: ncHeaders(), body: JSON.stringify(copy) });
      text = await res.text();
      try { json = text ? JSON.parse(text) : null; } catch(e){ json = null; }
      if (res.ok){ dlog('ok', 'PATCH ' + table + ' → OK (без даты)'); return json; }
    }
  }

  if (!res.ok){
    const msg = (json && (json.msg || json.message || json.error)) || text || res.statusText;
    dlog('err', 'PATCH ' + table + ' ' + res.status + ': ' + msg);
    throw new Error('NocoDB ' + res.status + ': ' + msg);
  }
  dlog('ok', 'PATCH ' + table + ' → OK');
  return json;
}

/* ---------- DELETE ---------- */
async function dbDelete(table, id){
  const url = tableUrl(table);
  dlog('info', 'DELETE ' + table + ' Id=' + id);
  const res = await fetch(url, {
    method: 'DELETE',
    headers: ncHeaders(),
    body: JSON.stringify([{ [FIELD_ID]: id }])
  });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch(e){}
  if (!res.ok){
    const msg = (json && (json.msg || json.message || json.error)) || text || res.statusText;
    dlog('err', 'DELETE ' + table + ' ' + res.status + ': ' + msg);
    throw new Error('NocoDB ' + res.status + ': ' + msg);
  }
  dlog('ok', 'DELETE ' + table + ' → OK');
  return true;
}

async function createUser(data){
  const seq = nextSeq('user', 100001);
  const userId = 'USER_' + seq;
  const record = {
    user_id: userId,
    telegram_chat_id: String(data.telegram_chat_id || '').trim(),
    name: String(data.name || '').trim(),
    age: Number(data.age),
    gender: data.gender,
    city: String(data.city || '').trim(),

  };

}
async function getUser(userId){
  if (!userId) return null;
  const list = await dbList('users');
  return list.filter(u => u.user_id === userId)[0] || null;
}
async function createProfile(data){
  const seq = nextSeq('profile', 100001);
  const pid = 'PROFILE_' + seq;
  const record = {
    profile_id: pid,
    user_id: data.user_id,
    name: String(data.name || '').trim(),

  };

async function updateProfile(id, patch){
  const p = Object.assign({}, patch);
  p[FIELD_UPDATED] = nowIso();

}
async function createLike(fromUserId, toUserId){
  if (!fromUserId || !toUserId) throw new Error('Не указаны пользователи');
  if (fromUserId === toUserId) throw new Error('Нельзя лайкнуть самого себя');
  const likes = await dbList('likes');
  const exists = likes.filter(l => l.from_user_id === fromUserId && l.to_user_id === toUserId)[0];
  if (exists){ dlog('info', 'Лайк уже существует'); return exists; }
  return await dbInsert('likes', {
    from_user_id: fromUserId,
    to_user_id: toUserId,
    [FIELD_CREATED]: nowIso()
  });
}
async function removeLike(fromUserId, toUserId){
  const likes = await dbList('likes');
  const like = likes.filter(l => l.from_user_id === fromUserId && l.to_user_id === toUserId)[0];
  if (!like) return false;
  await dbDelete('likes', getRecordId(like));
  const matches = await dbList('matches');
  const m = matches.filter(x =>
    (x.user1_id === fromUserId && x.user2_id === toUserId) ||
    (x.user1_id === toUserId   && x.user2_id === fromUserId))[0];
  if (m) await dbDelete('matches', getRecordId(m));
  return true;
}
async function checkMutualLike(a, b){
  const likes = await dbList('likes');
  return likes.filter(l => l.from_user_id === b && l.to_user_id === a)[0] || null;
}
async function createMatch(u1, u2){
  const matches = await dbList('matches');
  const exists = matches.filter(m =>
    (m.user1_id === u1 && m.user2_id === u2) ||
    (m.user1_id === u2 && m.user2_id === u1))[0];
  if (exists) return exists;
  return await dbInsert('matches', {
    user1_id: u1, user2_id: u2, [FIELD_CREATED]: nowIso()
  });
}
async function createComment(d){
  return await dbInsert('comments', {
    from_user_id: d.from_user_id,
    to_user_id: d.to_user_id,
    profile_id: d.profile_id,
    text: String(d.text || ''),
    [FIELD_CREATED]: nowIso()
  });
}
async function createNotification(d){
  return await dbInsert('notifications', {
    user_id: d.user_id,
    from_user_id: d.from_user_id || '',
    type: d.type || 'info',
    message: d.message || '',
    profile_id: d.profile_id || '',
    is_read: d.is_read === true,
    [FIELD_CREATED]: nowIso()
  });
}
async function sendTelegramMessage(chatId, text){
  if (!chatId) return null;
  if (!CONFIG.telegramBotToken || CONFIG.telegramBotToken.indexOf('YOUR_') === 0) return null;
  const url = 'https://api.telegram.org/bot' + CONFIG.telegramBotToken + '/sendMessage';
  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: String(chatId), text: String(text) })
    });
    const json = await response.json();
    if (!response.ok || json.ok === false) dlog('err', 'Telegram: ' + JSON.stringify(json));
    else dlog('ok', 'Telegram → OK');
    return json;
  } catch(err){ dlog('err', 'Telegram сеть: ' + err.message); return null; }
}

function saveSession(){ lsSet(SESSION_KEY, { user: state.user, profile: state.profile, saved_at: nowIso() }); }
function loadSession(){
  const s = lsGet(SESSION_KEY, null);
  if (s && s.user){ state.user = s.user; state.profile = s.profile || null; }

async function refreshData(){
  try {
    state.profiles = await getProfiles();
    state.likes    = await dbList('likes');
    state.matches  = await dbList('matches');
    if (state.profile){
      const fresh = state.profiles.filter(p => p.profile_id === state.profile.profile_id)[0];
      if (fresh){ state.profile = fresh; saveSession(); }
    }
    dlog('ok', 'Данные: профилей=' + state.profiles.length +
                ', лайков=' + state.likes.length +
                ', матчей=' + state.matches.length);
  } catch(err){
    dlog('err', 'refreshData: ' + err.message);
    toast('Ошибка загрузки: ' + err.message, 'error');
  }
}

    catch(e){ toast('Не удалось загрузить фото', 'error'); }
  });

  $('#regForm', ov).addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = $('#regErr', ov); errBox.textContent = '';
    const fd = new FormData(e.target);
    const name = String(fd.get('name') || '').trim();
    const age = Number(fd.get('age'));
    const city = String(fd.get('city') || '').trim();
    const gender = fd.get('gender');
    const lookingFor = fd.get('looking_for');
    const description = String(fd.get('description') || '').trim();
    const chatId = String(fd.get('telegram_chat_id') || '').trim();

    if (name.length < 2 || name.length > 50){ errBox.textContent = 'Имя 2–50 символов.'; return; }
    if (!isFinite(age) || age < 18 || age > 100){ errBox.textContent = 'Возраст 18–100.'; return; }
    if (city.length < 2){ errBox.textContent = 'Укажите город.'; return; }

    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Создаём…';

    try {
      const user = await createUser({ name, age, gender, city, telegram_chat_id: chatId });
      state.user = user;
      state.pendingRegistration = {
        name, age, gender, city, looking_for: lookingFor,
        description, photo_url: photoData || ''
      };
      saveSession();
      hideAuthOverlay();
      toast('🎉 Аккаунт создан: ' + user.user_id, 'success');
      openProfileEditor(true);
      render();
    } catch(err){
      dlog('err', 'Регистрация: ' + err.message);
      errBox.textContent = 'Ошибка: ' + err.message;
      btn.disabled = false; btn.textContent = 'Создать аккаунт';
    }
  });
}

/* ================================================================
   ФОТО
   ================================================================ */
function fileToDataUrl(file, maxSize, quality){
  maxSize = maxSize || 900; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          let w = img.width, h = img.height;
          const sc = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        } catch(e){ resolve(reader.result); }
      };
      img.onerror = () => reject(new Error('Ошибка чтения изображения'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Ошибка чтения файла'));
    reader.readAsDataURL(file);
  });
}

async function handleLike(profile){
  if (state.busy) return;
  if (!state.user){ showAuthOverlay(); return; }
  if (!profile) return;
  state.busy = true;
  try {
    const me = state.user;
    if (profile.user_id === me.user_id){ toast('Нельзя лайкнуть себя', 'error'); return; }

    const likes = await dbList('likes');
    const already = likes.filter(l => l.from_user_id === me.user_id && l.to_user_id === profile.user_id)[0];
    if (already){ toast('Вы уже лайкнули эту анкету', 'warn'); return; }

    await createLike(me.user_id, profile.user_id);
    toast('❤️ Лайк отправлен', 'success');

    const myLink = state.profile ? profileLink(state.profile.profile_id) : '';
    const owner = await getUser(profile.user_id);
    if (owner && owner.telegram_chat_id){
      const k = 'like_' + me.user_id + '_' + profile.user_id;
      if (!wasSent(k)){
        markSent(k);
        await sendTelegramMessage(owner.telegram_chat_id,
          '❤️ Вам поставили лайк!\n\nОткрыть анкету: ' + (myLink || '(ссылка недоступна)'));
      }
    }
    try {
      await createNotification({
        user_id: profile.user_id, from_user_id: me.user_id,
        type: 'like', message: '❤️ Вам поставили лайк',
        profile_id: profile.profile_id, is_read: false
      });
    } catch(e){ dlog('err', 'Notification: ' + e.message); }

    const mutual = await checkMutualLike(me.user_id, profile.user_id);
    if (mutual){
      await createMatch(me.user_id, profile.user_id);
      await notifyMatch(me, profile);
      await refreshData();
      render();
      showMatchModal(profile);
      return;
    }
    await refreshData();
    render();
  } catch(err){
    dlog('err', 'handleLike: ' + err.message);
    toast('Ошибка: ' + err.message, 'error');
  } finally {
    state.busy = false;
  }
}

async function copyMyLink(){
  if (!state.profile){ toast('Сначала создайте анкету', 'warn'); return; }
  const link = profileLink(state.profile.profile_id);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(link);
      toast('📋 Ссылка скопирована', 'success'); return;
    }
    throw new Error('no clipboard');
  } catch(e){
    const ta = document.createElement('textarea');
    ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('📋 Ссылка скопирована', 'success'); }
    catch(err){ toast('Ссылка: ' + link, 'info'); }
    ta.remove();
  }
}

function viewLikes(){
  const me = state.user; if (!me) return '';
  const tab = state.likedTab;
  let items = [];
  if (tab === 'incoming'){
    items = state.likes.filter(l => l.to_user_id === me.user_id)
      .map(l => ({ profile: profileByUserId(l.from_user_id), like: l }))
      .filter(x => !!x.profile);
  } else if (tab === 'outgoing'){
    items = state.likes.filter(l => l.from_user_id === me.user_id)
      .map(l => ({ profile: profileByUserId(l.to_user_id), like: l }))
      .filter(x => !!x.profile);
  } else {
    items = state.matches.filter(m => m.user1_id === me.user_id || m.user2_id === me.user_id)
      .map(m => {
        const other = m.user1_id === me.user_id ? m.user2_id : m.user1_id;
        return { profile: profileByUserId(other), match: m };
      }).filter(x => !!x.profile);
  }
  const tabsHtml = '<div class="tabs">' +
    '<button class="tab' + (tab === 'incoming' ? ' active' : '') + '" data-act="tab" data-tab="incoming" type="button">Меня лайкнули</button>' +
    '<button class="tab' + (tab === 'outgoing' ? ' active' : '') + '" data-act="tab" data-tab="outgoing" type="button">Я лайкнул</button>' +
    '<button class="tab' + (tab === 'mutual' ? ' active' : '') + '" data-act="tab" data-tab="mutual" type="button">Взаимные</button></div>';
  if (!items.length){
    const texts = {
      incoming: ['💌', 'Пока никто не лайкнул', 'Поделитесь ссылкой — лайки появятся здесь.'],
      outgoing: ['❤️', 'Вы ещё никого не лайкнули', 'Перейдите в «Знакомства».'],
      mutual:   ['💚', 'Взаимных пока нет', 'Когда совпадёт — появится здесь.']
    };
    const t = texts[tab];
    return tabsHtml + '<div class="empty"><div class="empty-icon">' + t[0] + '</div>' +
      '<h3>' + t[1] + '</h3><p>' + t[2] + '</p></div>';
  }
  const cards = items.map(item => {
    const p = item.profile; let actionBtn = '';
    if (tab === 'incoming') actionBtn = '<button data-act="like" data-uid="' + esc(p.user_id) + '" type="button">❤️</button>';
    else if (tab === 'outgoing') actionBtn = '<button data-act="unlike" data-uid="' + esc(p.user_id) + '" type="button">💔</button>';
    else actionBtn = '<button data-act="comment" data-uid="' + esc(p.user_id) + '" type="button">💬</button>';
    return '<div class="mini">' +
      '<div class="mini-photo"><img src="' + esc(p.photo_url || FALLBACK_IMG) + '" onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'"></div>' +
      '<div class="mini-body"><div class="mini-name">' + esc(p.name) + ', ' + esc(p.age) + '</div>' +
      '<div class="mini-city">📍 ' + esc(p.city) + '</div></div>' +
      '<div class="mini-actions">' +
        '<button data-act="open" data-pid="' + esc(p.profile_id) + '" type="button">👤</button>' +
        actionBtn + '</div></div>';
  }).join('');
  return tabsHtml + '<div class="grid">' + cards + '</div>';
}

function viewMatches(){
  const me = state.user; if (!me) return '';
  const items = state.matches.filter(m => m.user1_id === me.user_id || m.user2_id === me.user_id)
    .map(m => {
      const other = m.user1_id === me.user_id ? m.user2_id : m.user1_id;
      return { profile: profileByUserId(other), match: m };
    }).filter(x => !!x.profile);
  if (!items.length){
    return '<div class="empty"><div class="empty-icon">💚</div>' +
      '<h3>Взаимных пока нет</h3><p>Ставьте лайки — когда совпадёт, матч появится здесь.</p></div>';
  }
  const cards = items.map(item => {
    const p = item.profile;
    return '<div class="mini">' +
      '<div class="mini-photo"><img src="' + esc(p.photo_url || FALLBACK_IMG) + '" onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'"></div>' +
      '<div class="mini-body"><div class="mini-name">' + esc(p.name) + ', ' + esc(p.age) + '</div>' +
      '<div class="mini-city">📍 ' + esc(p.city) + '</div></div>' +
      '<div class="mini-actions">' +
        '<button data-act="open" data-pid="' + esc(p.profile_id) + '" type="button">👤</button>' +
        '<button data-act="comment" data-uid="' + esc(p.user_id) + '" type="button">💬</button>' +
      '</div></div>';
  }).join('');
  return '<div class="section-title">💚 Матчи — ' + items.length + '</div><div class="grid">' + cards + '</div>';
}

function viewMe(){
  const me = state.user; if (!me) return '';
  const p = state.profile;
  if (!p){
    return '<div class="empty"><div class="empty-icon">📝</div>' +
      '<h3>Анкеты пока нет</h3><p>Создайте анкету.</p>' +
      '<button class="btn-primary" data-act="editProfile" type="button">Создать</button></div>';
  }
  const likesReceived = state.likes.filter(l => l.to_user_id === me.user_id).length;
  const likesGiven = state.likes.filter(l => l.from_user_id === me.user_id).length;
  const matchCount = state.matches.filter(m => m.user1_id === me.user_id || m.user2_id === me.user_id).length;
  const link = profileLink(p.profile_id);
  return '<div class="me">' +
    '<div class="me-photo"><img src="' + esc(p.photo_url || FALLBACK_IMG) + '" onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'"></div>' +
    '<div class="me-info">' +
      '<h2>' + esc(p.name) + ', ' + esc(p.age) + '</h2>' +
      '<div class="city">📍 ' + esc(p.city) + ' · ' + genderLabel(p.gender) + ' · ищет: ' + lookingLabel(p.looking_for) + '</div>' +
      (p.description ? '<p class="desc">' + esc(p.description) + '</p>' : '') +
      '<div class="tags">' + tagsHtml(p.interests) + '</div>' +
      '<div style="margin-top:14px;font-size:12.5px;color:var(--muted);word-break:break-all;">🆔 ' + esc(p.profile_id) + '<br>🔗 ' + esc(link) + '</div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + likesReceived + '</b><span>Лайков получено</span></div>' +
      '<div class="stat"><b>' + matchCount + '</b><span>Матчей</span></div>' +
    '</div>' +
    '<div class="stats" style="grid-template-columns:1fr;">' +
      '<div class="stat"><b>' + likesGiven + '</b><span>Лайков поставлено</span></div>' +
    '</div>' +
    '<div class="actions-col">' +
      '<button class="btn-primary" data-act="editProfile" type="button">✏️ Редактировать</button>' +
      '<button class="btn-ghost" data-act="copyLink" type="button">📋 Скопировать ссылку</button>' +
      '<button class="btn-ghost" data-act="openMine" type="button">🔗 Открыть анкету</button>' +
      '<button class="btn-ghost" data-act="logout" type="button">🚪 Выйти</button>' +
    '</div>' +
  '</div>';
}

function viewProfile(pid){
  const p = profileByProfileId(pid);
  if (!p){
    return '<div class="empty"><div class="empty-icon">🔍</div>' +
      '<h3>Анкета не найдена</h3><p>Возможно, ссылка неверна.</p>' +
      '<button class="btn-primary" data-act="goHome" type="button">На главную</button></div>';
  }
  const me = state.user;
  const isMine = me && p.user_id === me.user_id;
  const alreadyLiked = me && state.likes.some(l => l.from_user_id === me.user_id && l.to_user_id === p.user_id);
  let actionsHtml = '';
  if (!me){
    actionsHtml = '<div class="actions-col"><button class="btn-primary" data-act="goHome" type="button">Войти, чтобы лайкнуть</button></div>';
  } else if (isMine){
    actionsHtml = '<div class="actions-col">' +
      '<button class="btn-ghost" data-act="copyLink" type="button">📋 Скопировать ссылку</button>' +
      '<button class="btn-primary" data-act="editProfile" type="button">✏️ Редактировать</button></div>';
  } else {
    actionsHtml = '<div class="deck-actions">' +
      '<button class="act act-comment" data-act="comment" data-uid="' + esc(p.user_id) + '" type="button">💬</button>' +
      (alreadyLiked
        ? '<button class="act act-like" data-act="unlike" data-uid="' + esc(p.user_id) + '" type="button">💔</button>'
        : '<button class="act act-like" data-act="like" data-uid="' + esc(p.user_id) + '" type="button">❤️</button>') +
      '</div><div style="text-align:center;margin-top:10px;font-size:12.5px;color:var(--muted);">' +
      (alreadyLiked ? 'Вы уже лайкнули' : 'Поставьте лайк') + '</div>';
  }
  return '<div class="pv">' +
    '<div class="pv-photo">' +
      '<button class="pv-back" data-act="goHome" type="button">←</button>' +
      '<img src="' + esc(p.photo_url || FALLBACK_IMG) + '" onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">' +
      '<div class="photo-shade"></div>' +
    '</div>' +
    '<div class="pv-body">' +
      '<h2>' + esc(p.name) + ', ' + esc(p.age) + '</h2>' +
      '<div class="city">📍 ' + esc(p.city) + ' · ' + genderLabel(p.gender) + ' · ищет: ' + lookingLabel(p.looking_for) + '</div>' +
      (p.description ? '<p class="desc">' + esc(p.description) + '</p>' : '') +
      '<div class="tags">' + tagsHtml(p.interests) + '</div>' +
      '<div style="margin-top:12px;font-size:12px;color:var(--muted);">🆔 ' + esc(p.profile_id) + '</div>' +
      actionsHtml +
    '</div></div>';
}

/* ================================================================
   RENDER
   ================================================================ */
function render(){
  const view = document.getElementById('view');
  if (!state.user && state.view !== 'profile'){
    showAuthOverlay(); view.innerHTML = ''; updateNav(); return;
  }
  hideAuthOverlay();
  if (state.user && !state.profile && state.view !== 'profile'){
    view.innerHTML =
      '<div class="empty"><div class="empty-icon">📝</div>' +
      '<h3>Остался последний шаг</h3>' +
      '<p>Создайте анкету, чтобы вас могли найти.</p>' +
      '<button class="btn-primary" data-act="editProfile" type="button">Создать анкету</button></div>';
    updateNav(); return;
  }
  if (state.view === 'discover')      view.innerHTML = viewDiscover();
  else if (state.view === 'likes')    view.innerHTML = viewLikes();
  else if (state.view === 'matches')  view.innerHTML = viewMatches();
  else if (state.view === 'me')       view.innerHTML = viewMe();
  else if (state.view === 'profile')  view.innerHTML = viewProfile(state.viewProfileId);
  else                                view.innerHTML = viewDiscover();
  updateNav();
}
function updateNav(){
  $$('#bottomNav .nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  const nav = document.getElementById('bottomNav');
  if (nav) nav.style.display = (!state.user && state.view === 'profile') ? 'none' : 'grid';
}

/* ================================================================
   EVENTS
   ================================================================ */
async function onViewClick(e){
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;

  if (act === 'toggleFilters'){ state.filtersOpen = !state.filtersOpen; render(); return; }
  if (act === 'applyFilters'){
    const f = {
      ageFrom: clampNum($('#fAgeFrom').value, 18, 100, 18),
      ageTo: clampNum($('#fAgeTo').value, 18, 100, 100),
      city: $('#fCity').value.trim(),
      gender: $('#fGender').value,
      lookingFor: $('#fLookingFor').value
    };
    if (f.ageFrom > f.ageTo){ const t = f.ageFrom; f.ageFrom = f.ageTo; f.ageTo = t; }
    state.filters = f; state.deckIndex = 0; state.filtersOpen = true;
    toast('Фильтры применены', 'success'); render(); return;
  }
  if (act === 'resetFilters'){
    state.filters = { ageFrom: 18, ageTo: 100, city: '', gender: '', lookingFor: '' };
    state.deckIndex = 0; render(); return;
  }
  if (act === 'tab'){ state.likedTab = el.dataset.tab || 'incoming'; render(); return; }
  if (act === 'goHome'){ navigateTo('discover'); return; }
  if (act === 'open'){ goToProfile(el.dataset.pid); return; }
  if (act === 'comment'){ const p = profileByUserId(el.dataset.uid); if (p) openCommentModal(p); return; }
  if (act === 'skip'){ state.deckIndex++; render(); window.scrollTo(0, 0); return; }
  if (act === 'like'){
    if (!state.user){ showAuthOverlay(); return; }
    const p = profileByUserId(el.dataset.uid); if (!p) return;
    const card = document.getElementById('mainCard');
    if (card){ card.classList.add('fly-right'); await sleep(260); }
    await handleLike(p); return;
  }
  if (act === 'unlike'){ const p = profileByUserId(el.dataset.uid); if (p) openUnlikeConfirm(p); return; }
  if (act === 'editProfile'){ openProfileEditor(false); return; }
  if (act === 'copyLink'){ copyMyLink(); return; }
  if (act === 'openMine'){ if (state.profile) goToProfile(state.profile.profile_id); return; }
  if (act === 'logout'){ logout(); return; }
}

/* ================================================================
   START
   ================================================================ */
async function start(){
  loadSession();

  dlog('info', 'DEMO_MODE = ' + DEMO_MODE);
  dlog('info', 'Токен: ' + CONFIG.apiToken.slice(0, 8) + '...');
  if (Object.keys(PLATFORM).length) dlog('info', 'PLATFORM: ' + JSON.stringify(PLATFORM).slice(0, 200));

  document.getElementById('view').addEventListener('click', function(e){
    onViewClick(e).catch(err => {
      dlog('err', 'UI: ' + err.message);
      toast('Ошибка: ' + err.message, 'error');
    });
  });
  $$('#bottomNav .nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!state.user){ showAuthOverlay(); return; }
      navigateTo(btn.dataset.view);
    });
  });
  window.addEventListener('popstate', () => {
    const r = getRoute();
    if (r.view === 'profile'){ state.view = 'profile'; state.viewProfileId = r.profileId; }
    else { state.view = r.view; state.viewProfileId = null; }
    render();
  });

  await refreshData();

  const route = getRoute();
  if (route.view === 'profile'){ state.view = 'profile'; state.viewProfileId = route.profileId; }
  else { state.view = route.view; state.viewProfileId = null; }
  render();
}

document.addEventListener('DOMContentLoaded', () => {
  /* Кнопка открытия/закрытия панели отладки */
  const topEmoji = document.getElementById('topEmoji');
  if (topEmoji) topEmoji.addEventListener('click', () => {
    const p = document.getElementById('debugPanel');
    p.classList.toggle('show');
  });
  const dbgClose = document.getElementById('dbgClose');
  if (dbgClose) dbgClose.addEventListener('click', hideDebug);

  /* Автопоказ панели отладки при ошибке */
  const origErr = console.error;
  console.error = function(){
    origErr.apply(console, arguments);
    showDebug();
  };

  start().catch(err => {
    dlog('err', 'START: ' + err.message);
    toast('Ошибка запуска: ' + err.message, 'error');
    showDebug();
  });
});
