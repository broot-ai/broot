<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0b13">
<title>HeartLink</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0d0b13;--card:#1b1729;--card-2:#241e35;--text:#f4f1fa;--muted:#9b93b2;
--accent:#ff4d79;--green:#28d17c;--danger:#ff5f5f;--border:rgba(255,255,255,.09);}
html,body{height:100%;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
color:var(--text);background-color:#0d0b13;
background-image:radial-gradient(900px 520px at 12% -12%,rgba(255,77,121,.25),transparent 62%),
radial-gradient(820px 520px at 92% -4%,rgba(122,86,255,.22),transparent 62%);
background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font-family:inherit;font-size:16px;}
img{display:block;}
h1,h2,h3{margin:0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.muted-text{color:var(--muted);font-size:14.5px;line-height:1.5;}

#app{max-width:520px;margin:0 auto;padding:0 0 110px;min-height:100%;}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
padding:14px 18px;background:linear-gradient(180deg,rgba(13,11,19,.96) 65%,rgba(13,11,19,0));
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.logo{font-weight:800;font-size:19px;
background:linear-gradient(90deg,#ff4d79,#ff8a5b);-webkit-background-clip:text;background-clip:text;color:transparent;}
#syncStatus{font-size:11px;font-weight:600;padding:4px 10px;border-radius:10px;
background:rgba(255,255,255,.06);color:var(--muted);transition:.3s;}
#syncStatus.ok{background:rgba(40,209,124,.18);color:#6ee9a4;}
#syncStatus.err{background:rgba(255,95,95,.18);color:#ff8080;}
#syncStatus.loading{background:rgba(255,190,80,.18);color:#ffd166;}

#bottomNav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);
display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0));
background:rgba(20,16,30,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border-top:1px solid var(--border);z-index:60;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:16px;
color:var(--muted);transition:.2s;}
.nav-btn span{font-size:20px;line-height:1;}
.nav-btn em{font-style:normal;font-size:10.5px;font-weight:600;}
.nav-btn.active{color:#fff;background:rgba(255,77,121,.14);}
.nav-btn:active{transform:scale(.94);}

.filters{padding:0 16px 14px;}
.filters-toggle{width:100%;padding:13px 16px;border-radius:18px;background:var(--card);
border:1px solid var(--border);font-size:14px;font-weight:600;color:#d8d3e6;text-align:left;
display:flex;align-items:center;justify-content:space-between;}
.filters-toggle .chev{transition:.25s;color:var(--muted);font-size:12px;}
.filters.open .filters-toggle .chev{transform:rotate(180deg);}
.filters-body{display:none;flex-direction:column;gap:11px;margin-top:11px;padding:16px;border-radius:20px;
background:var(--card);border:1px solid var(--border);}
.filters.open .filters-body{display:flex;}

.deck{padding:0 16px;}
.card{position:relative;border-radius:28px;overflow:hidden;background:var(--card);border:1px solid var(--border);
box-shadow:0 24px 60px rgba(0,0,0,.55);animation:cardIn .42s cubic-bezier(.2,.8,.25,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:none;}}
.card.fly-right{animation:flyRight .3s ease forwards;}
@keyframes flyRight{to{opacity:0;transform:translateX(125%) rotate(14deg);}}
.card-photo{position:relative;height:clamp(260px,46vh,430px);background:var(--card-2);}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.photo-shade{position:absolute;left:0;right:0;bottom:0;height:45%;
background:linear-gradient(180deg,transparent,rgba(20,16,30,.92));pointer-events:none;}
.card-counter{position:absolute;top:12px;right:12px;padding:5px 11px;border-radius:20px;font-size:12px;
font-weight:600;background:rgba(0,0,0,.45);}
.card-body{padding:16px 18px 20px;}
.card-body h2{font-size:23px;font-weight:800;line-height:1.15;}
.card-city{color:var(--muted);font-size:13.5px;margin-top:4px;}
.card-desc{margin:11px 0 0;font-size:14.5px;line-height:1.5;color:#d8d3e6;}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.tag{font-size:12px;padding:5px 11px;border-radius:20px;background:rgba(255,77,121,.13);color:#ff9db6;font-weight:600;}
.deck-actions{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:20px;}
.act{width:64px;height:64px;border-radius:50%;font-size:26px;display:grid;place-items:center;
background:var(--card);border:1px solid var(--border);box-shadow:0 10px 26px rgba(0,0,0,.45);
transition:transform .15s ease, box-shadow .2s;-webkit-tap-highlight-color:transparent;user-select:none;}
.act:active{transform:scale(.85);box-shadow:0 4px 12px rgba(0,0,0,.6);}
.act-like{background:linear-gradient(135deg,#ff4d79,#ff7a4d);border-color:transparent;
box-shadow:0 12px 30px rgba(255,77,121,.45);}
.act-like:active{background:linear-gradient(135deg,#ff3050,#ff6030);}
.act-skip{width:52px;height:52px;font-size:18px;color:var(--muted);}
.act-comment{background:var(--card-2);}
.btn-open-profile{display:block;width:100%;margin:16px 0 0;padding:14px;border-radius:18px;
background:var(--card);border:1px solid var(--border);font-weight:600;font-size:15px;color:#d8d3e6;}

.tabs{display:flex;gap:7px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:9px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);
color:var(--muted);font-size:13.5px;font-weight:600;white-space:nowrap;}
.tab.active{background:linear-gradient(135deg,#ff4d79,#ff7a4d);color:#fff;border-color:transparent;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px;}
.mini{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.mini-photo{height:168px;background:var(--card-2);}
.mini-photo img{width:100%;height:100%;object-fit:cover;}
.mini-body{padding:10px 12px 6px;}
.mini-name{font-weight:700;font-size:14.5px;}
.mini-city{font-size:12px;color:var(--muted);margin-top:2px;}
.mini-actions{display:flex;gap:6px;padding:8px 10px 10px;}
.mini-actions button{flex:1;padding:9px;border-radius:12px;background:var(--card-2);font-size:15px;}

.me{padding:0 16px;}
.me-photo{border-radius:26px;overflow:hidden;height:clamp(240px,40vh,380px);background:var(--card-2);border:1px solid var(--border);}
.me-photo img{width:100%;height:100%;object-fit:cover;}
.me-info{margin-top:16px;}
.me-info h2{font-size:24px;font-weight:800;}
.me-info .city{color:var(--muted);font-size:14px;margin-top:4px;}
.me-info .desc{margin-top:12px;font-size:14.5px;line-height:1.55;color:#d8d3e6;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;text-align:center;}
.stat b{display:block;font-size:26px;font-weight:800;
background:linear-gradient(90deg,#ff4d79,#ff8a5b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat span{font-size:12.5px;color:var(--muted);}
.actions-col{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

.pv{padding:0 16px;}
.pv-photo{position:relative;border-radius:26px;overflow:hidden;height:clamp(300px,52vh,520px);background:var(--card-2);border:1px solid var(--border);}
.pv-photo img{width:100%;height:100%;object-fit:cover;}
.pv-back{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:50%;
background:rgba(0,0,0,.5);display:grid;place-items:center;font-size:18px;z-index:3;}
.pv-body{padding:18px 4px 0;}
.pv-body h2{font-size:25px;font-weight:800;}
.pv-body .city{color:var(--muted);font-size:14px;margin-top:4px;}
.pv-body .desc{margin-top:13px;font-size:15px;line-height:1.55;color:#d8d3e6;}

.form{display:flex;flex-direction:column;gap:12px;}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;}
.form input,.form textarea,.form select{width:100%;padding:13px 14px;border-radius:14px;
background-color:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);outline:none;}
.form input:focus,.form textarea:focus{border-color:var(--accent);}
.form textarea{resize:vertical;min-height:80px;}
.form select{appearance:none;-webkit-appearance:none;
background-image:linear-gradient(45deg,transparent 50%,#9b93b2 50%),linear-gradient(135deg,#9b93b2 50%,transparent 50%);
background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;
background-repeat:no-repeat;padding-right:38px;}
option{background:#1b1729;color:#f4f1fa;}
.form .check{flex-direction:row;align-items:center;gap:9px;font-size:13.5px;color:#d8d3e6;}
.form .check input{width:18px;height:18px;accent-color:#ff4d79;padding:0;}

.btn-primary{width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:15.5px;color:#fff;
background:linear-gradient(135deg,#ff4d79,#ff7a4d);box-shadow:0 12px 28px rgba(255,77,121,.35);transition:.15s;}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.55;}
.btn-ghost{width:100%;padding:15px;border-radius:16px;font-weight:600;font-size:15px;
background:rgba(255,255,255,.06);border:1px solid var(--border);color:#d8d3e6;}

.photo-picker{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px;}
.photo-picker img{width:130px;height:130px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,77,121,.4);background:var(--card-2);}
.photo-btn{padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.07);
border:1px solid var(--border);font-size:13.5px;font-weight:600;cursor:pointer;display:inline-block;}

.modal-backdrop{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
background:rgba(5,4,10,.72);backdrop-filter:blur(6px);opacity:0;transition:.22s;}
.modal-backdrop.show{opacity:1;}
.modal{width:min(520px,100%);max-height:92vh;overflow-y:auto;background:#171323;border:1px solid var(--border);
border-radius:26px 26px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0));
transform:translateY(26px);transition:transform .28s cubic-bezier(.2,.8,.25,1);}
.modal-backdrop.show .modal{transform:none;}
@media (min-width:640px){.modal-backdrop{align-items:center;padding:24px;}.modal{border-radius:26px;max-height:88vh;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.modal-head h3{font-size:18px;font-weight:800;}
.modal-close{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);
font-size:15px;color:var(--muted);display:grid;place-items:center;}
.modal-foot{margin-top:16px;}
.err{color:var(--danger);font-size:13px;min-height:16px;font-weight:600;}

.comment-target{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
.comment-target img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--card-2);}
.comment-target b{display:block;font-size:15px;}
.comment-target span{font-size:12.5px;color:var(--muted);}
.counter{text-align:right;font-size:12px;color:var(--muted);margin-top:6px;}

.match-box{text-align:center;padding:6px 0 0;}
.match-heart{font-size:64px;line-height:1;}
.match-box h2{margin:12px 0 6px;font-size:23px;font-weight:800;}
.match-box p{margin:0 0 16px;color:var(--muted);font-size:14px;}
.match-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:0 auto;
border:3px solid rgba(40,209,124,.55);background:var(--card-2);}
.match-name{margin-top:10px;font-weight:700;font-size:16px;}

.auth-overlay{position:fixed;inset:0;z-index:150;overflow-y:auto;background-color:#0d0b13;
background-image:radial-gradient(900px 520px at 12% -12%,rgba(255,77,121,.25),transparent 62%),
radial-gradient(820px 520px at 92% -4%,rgba(122,86,255,.22),transparent 62%);
padding:32px 18px calc(44px + env(safe-area-inset-bottom,0));}
.auth-card{max-width:480px;margin:0 auto;}
.auth-logo{font-size:54px;text-align:center;line-height:1;}
.auth-card h1{text-align:center;margin:8px 0 6px;font-size:27px;font-weight:800;}
.auth-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 24px;}

#toastRoot{position:fixed;left:50%;transform:translateX(-50%);
bottom:calc(100px + env(safe-area-inset-bottom,0));z-index:200;
display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,92vw);}
.toast{width:100%;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;
background:rgba(30,24,44,.97);border:1px solid var(--border);color:#f4f1fa;
box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;transform:translateY(14px);transition:.28s;}
.toast.show{opacity:1;transform:none;}
.toast-success{border-color:rgba(40,209,124,.5);}
.toast-error{border-color:rgba(255,95,95,.55);}
.toast-warn{border-color:rgba(255,190,80,.5);}

.empty{padding:60px 24px;text-align:center;color:var(--muted);}
.empty-icon{font-size:52px;margin-bottom:12px;line-height:1;}
.empty h3{color:var(--text);margin:0 0 8px;font-size:19px;}
.empty p{margin:0 0 20px;font-size:14px;line-height:1.5;}
.empty .btn-primary{max-width:280px;margin:0 auto;}
.section-title{padding:0 16px 12px;font-size:13px;font-weight:700;color:var(--muted);
text-transform:uppercase;letter-spacing:.8px;}
.badge-auto{display:inline-block;margin-left:6px;font-size:10px;padding:2px 6px;border-radius:8px;
background:rgba(40,209,124,.18);color:#6ee9a4;font-weight:700;}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="logo">💖 HeartLink</div>
    <div id="syncStatus">готово</div>
  </header>
  <main id="view"></main>
</div>

<nav id="bottomNav">
  <button class="nav-btn" data-view="discover"><span>🔎</span><em>Знакомства</em></button>
  <button class="nav-btn" data-view="likes"><span>❤️</span><em>Лайки</em></button>
  <button class="nav-btn" data-view="matches"><span>💚</span><em>Взаимные</em></button>
  <button class="nav-btn" data-view="me"><span>👤</span><em>Моя анкета</em></button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";

/* ================= CONFIG ================= */
const DEMO_MODE = false;

const CONFIG = {
  usersTableUrl:         "https://nocodb.puzzlebot.top/api/v2/tables/myavvyt83qvewaf/records",
  profilesTableUrl:      "https://nocodb.puzzlebot.top/api/v2/tables/mygnkngvzgdml67/records",
  likesTableUrl:         "https://nocodb.puzzlebot.top/api/v2/tables/mfqpfkxnfy261v6/records",
  matchesTableUrl:       "https://nocodb.puzzlebot.top/api/v2/tables/muyc3dcysl45uji/records",
  commentsTableUrl:      "https://nocodb.puzzlebot.top/api/v2/tables/m17mzz95ypg36u5/records",
  notificationsTableUrl: "https://nocodb.puzzlebot.top/api/v2/tables/mxr1i1f2fypq0bm/records",
  apiToken: "kFqvkaYA9_ZMb3oTH4D8m0Brsj84hJRDN68RDP9O",
  telegramBotToken: "8842784777:AAFG_J4NEmV_8hmXPgw8gToaASnWB0dmS68",
  publicBaseUrl: ""
};

const FIELD_CREATED = 'created_att';
const FIELD_UPDATED = 'updated_att';

/* ================= UTILS ================= */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nowIso = () => new Date().toISOString();

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function clampNum(v,min,max,def){ const n=Number(v); if(!isFinite(n))return def; return Math.min(max,Math.max(min,n)); }
function lsGet(k,d){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

const SESSION_KEY      = 'heartlink_session_v6';
const SEQ_KEY          = 'heartlink_seq_v6';
const SENT_KEY         = 'heartlink_sent_v6';
const LOCAL_LIKES_KEY  = 'heartlink_local_likes_v6';
const LOCAL_MATCH_KEY  = 'heartlink_local_matches_v6';

function nextSeq(n,s){ const a=lsGet(SEQ_KEY,{}); const c=Number(a[n])||(s-1); a[n]=c+1; lsSet(SEQ_KEY,a); return a[n]; }
function wasSent(k){ return !!lsGet(SENT_KEY,{})[k]; }
function markSent(k){ const s=lsGet(SENT_KEY,{}); s[k]=1; lsSet(SENT_KEY,s); }
function getRecordId(r){ if(!r)return undefined; if(r.Id!=null)return r.Id; if(r.id!=null)return r.id; return undefined; }

const FALLBACK_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800">' +
  '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
  '<stop offset="0" stop-color="#3a2b52"/><stop offset="1" stop-color="#1b1729"/></linearGradient></defs>' +
  '<rect width="600" height="800" fill="url(#g)"/>' +
  '<text x="300" y="430" font-size="120" text-anchor="middle" fill="#ffffff44" font-family="sans-serif">📷</text></svg>'
);

/* ================= STATUS ================= */
function setStatus(text, type){
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = text;
  el.className = type || '';
}

/* ================= PLATFORM ================= */
function readPlatformVars(){
  const out={};
  const set=(k,v)=>{ if(v==null)return; const s=String(v).trim(); if(!s)return; if(out[k]===undefined)out[k]=s; };
  try{
    const tg=window.Telegram&&window.Telegram.WebApp;
    const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(u){
      set('USER_ID_TEXT',u.id); set('FIRST_NAME_TEXT',u.first_name);
      set('LAST_NAME_TEXT',u.last_name); set('USERNAME_TEXT',u.username);
      set('USER_AVATAR_URL',u.photo_url);
      const f=[u.first_name,u.last_name].filter(Boolean).join(' ');
      set('FULL_NAME',f); set('FIRST_AND_LAST_NAME_TEXT',f);
    }
  }catch(e){}
  try{ new URLSearchParams(location.search||'').forEach((v,k)=>set(k,v)); }catch(e){}
  try{
    const h=location.hash||''; const qi=h.indexOf('?');
    if(qi!==-1) new URLSearchParams(h.slice(qi+1)).forEach((v,k)=>set(k,v));
  }catch(e){}
  ['BROOT_VARS','PLATFORM_VARS','BOT_VARS','INIT_VARS','TG_USER_VARS'].forEach(n=>{
    const o=window[n]; if(o&&typeof o==='object') for(const k in o) if(Object.prototype.hasOwnProperty.call(o,k)) set(k,o[k]);
  });
  return out;
}
const PLATFORM = readPlatformVars();
const platformName = () => (PLATFORM.FIRST_AND_LAST_NAME_TEXT||PLATFORM.FULL_NAME||
  [PLATFORM.FIRST_NAME_TEXT,PLATFORM.LAST_NAME_TEXT].filter(Boolean).join(' ')||'').slice(0,50);
const platformChatId = () => PLATFORM.USER_ID_TEXT||'';
const platformAvatarUrl = () => PLATFORM.USER_AVATAR_URL||'';
const platformUsername = () => PLATFORM.USERNAME_TEXT||'';

/* ================= STATE ================= */
const state = {
  user: null, profile: null, pendingRegistration: null,
  view: 'discover', viewProfileId: null,
  likedTab: 'incoming', deckIndex: 0, filtersOpen: false,
  filters: { ageFrom:18, ageTo:100, city:'', gender:'', lookingFor:'' },
  profiles: [], likes: [], matches: [], busy: false,
  nocoOnline: false
};

/* ================= ROUTING ================= */
function computeBaseUrl(){
  if(CONFIG.publicBaseUrl) return CONFIG.publicBaseUrl.replace(/\/?$/,'/');
  if(location.protocol==='file:') return location.href.split('#')[0].split('?')[0];
  let p=location.pathname.replace(/\/(profile|p)\/[^\/]+\/?$/i,'/');
  p=p.replace(/index\.html$/i,'');
  if(!p.endsWith('/')) p=p.replace(/\/[^\/]*$/,'/');
  if(!p) p='/';
  return location.origin+p;
}
function profileLink(pid){
  const base=computeBaseUrl();
  if(location.protocol==='file:') return base+'#/profile/'+pid;
  return base.replace(/\/$/,'')+'/profile/'+pid;
}
function getRoute(){
  const path=location.pathname||'';
  let m=path.match(/\/(?:profile|p)\/([^\/?#]+)/i);
  if(m) return { view:'profile', profileId:decodeURIComponent(m[1]) };
  const hash=(location.hash||'').replace(/^#\/?/,'');
  m=hash.match(/^(?:profile|p)\/([^\/?#]+)/i);
  if(m) return { view:'profile', profileId:decodeURIComponent(m[1]) };
  if(['discover','likes','matches','me'].indexOf(hash)!==-1) return { view:hash };
  return { view:'discover' };
}
function navigateTo(v){
  state.view=v; state.viewProfileId=null;
  if(v==='discover') state.deckIndex=0;
  try{
    if(location.protocol==='file:'){ if(location.hash!=='#'+v) location.hash='#'+v; }
    else history.pushState({},'','#'+v);
  }catch(e){}
  render(); window.scrollTo(0,0);
}
function goToProfile(pid){
  if(!pid) return;
  state.view='profile'; state.viewProfileId=pid;
  try{
    if(location.protocol==='file:') location.hash='#/profile/'+pid;
    else history.pushState({},'',profileLink(pid));
  }catch(e){ try{ location.hash='#/profile/'+pid; }catch(e2){} }
  render(); window.scrollTo(0,0);
}

/* ================= NOCODB (много стратегий) ================= */
function tableUrl(t){
  const m={
    users:CONFIG.usersTableUrl, profiles:CONFIG.profilesTableUrl,
    likes:CONFIG.likesTableUrl, matches:CONFIG.matchesTableUrl,
    comments:CONFIG.commentsTableUrl, notifications:CONFIG.notificationsTableUrl
  };
  if(!m[t]) throw new Error('Unknown table: '+t);
  return m[t];
}

async function fetchWithTimeout(url,opts,ms){
  ms=ms||15000;
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms);
  try{
    const res=await fetch(url,Object.assign({},opts,{signal:ctrl.signal}));
    clearTimeout(t);
    return res;
  }catch(e){ clearTimeout(t); throw e; }
}

async function nocoRequest(method,url,body){
  const token = CONFIG.apiToken;
  const strategies = [
    { name:'xc-token',     headers:{ 'Content-Type':'application/json', 'xc-token':token } },
    { name:'bearer',       headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token } },
    { name:'xc-token-qs',  headers:{ 'Content-Type':'application/json' }, qs:'?xc-token='+encodeURIComponent(token) }
  ];
  let lastErr='';
  for(const s of strategies){
    try{
      const finalUrl = url + (s.qs ? (url.indexOf('?')===-1?'?':'&') + s.qs.slice(1) : '');
      const opts = { method, headers:s.headers };
      if(body) opts.body = JSON.stringify(body);
      console.log('[NocoDB:'+s.name+'] '+method+' '+finalUrl);
      const res = await fetchWithTimeout(finalUrl,opts,15000);
      const text = await res.text();
      let json=null; try{ json=text?JSON.parse(text):null; }catch(e){}
      if(res.ok){
        console.log('[NocoDB:'+s.name+'] OK');
        state.nocoOnline = true;
        return json;
      }
      lastErr = res.status+': '+((json&&(json.msg||json.message||json.error))||text.slice(0,150));
      console.warn('[NocoDB:'+s.name+'] '+lastErr);
      if(res.status===401||res.status===403){ continue; }
      if(res.status===400){ state.nocoOnline=true; throw new Error(lastErr); }
    }catch(e){
      lastErr = e.message;
      console.warn('[NocoDB:'+s.name+'] exception: '+lastErr);
    }
  }
  state.nocoOnline = false;
  throw new Error(lastErr||'NocoDB: все стратегии провалились');
}

async function dbList(t){ const r = await nocoRequest('GET',tableUrl(t)+'?limit=1000'); return (r&&(r.list||r.records))||[]; }

async function dbInsert(t,rec){
  try{
    return await nocoRequest('POST',tableUrl(t),rec);
  }catch(e){
    // Если ошибка из-за created_att — пробуем без него
    if(String(e.message).indexOf('400')!==-1 || String(e.message).toLowerCase().indexOf('column')!==-1){
      const copy=Object.assign({},rec);
      delete copy[FIELD_CREATED];
      delete copy[FIELD_UPDATED];
      console.warn('[NocoDB] повтор без '+FIELD_CREATED);
      return await nocoRequest('POST',tableUrl(t),copy);
    }
    throw e;
  }
}

async function dbUpdate(t,id,patch){
  const payload=Object.assign({},patch,{Id:id});
  try{
    return await nocoRequest('PATCH',tableUrl(t),payload);
  }catch(e){
    if(String(e.message).toLowerCase().indexOf('column')!==-1){
      const c=Object.assign({},patch,{Id:id});
      delete c[FIELD_UPDATED];
      return await nocoRequest('PATCH',tableUrl(t),c);
    }
    throw e;
  }
}

async function dbDelete(t,id){
  await nocoRequest('DELETE',tableUrl(t),[{Id:id}]);
  return true;
}

/* ================= LIKE (оптимистично) ================= */
async function handleLike(profile){
  if(state.busy) return;
  if(!state.user){ showAuthOverlay(); return; }
  if(!profile) return;
  const me = state.user;
  if(profile.user_id===me.user_id){ toast('Нельзя лайкнуть себя','error'); return; }
  const already = state.likes.filter(l=>l.from_user_id===me.user_id && l.to_user_id===profile.user_id)[0];
  if(already){ toast('Вы уже лайкнули','warn'); return; }

  state.busy = true;
  setStatus('лайк…','loading');

  /* 1. СОХРАНЯЕМ ЛОКАЛЬНО */
  const localLike = {
    Id: 'local_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    from_user_id: me.user_id,
    to_user_id: profile.user_id,
    [FIELD_CREATED]: nowIso(),
    _local: true
  };
  state.likes.push(localLike);
  localLikesAdd(localLike);

  /* 2. ОБНОВЛЯЕМ UI СРАЗУ */
  const card = document.getElementById('mainCard');
  if(card){ card.classList.add('fly-right'); await sleep(280); }
  state.deckIndex++;
  render();
  toast('❤️ Лайк отправлен','success');
  setStatus('сохранено','ok');
  console.log('[LIKE] локально: '+me.user_id+' → '+profile.user_id);

  /* 3. СИНХРОНИЗАЦИЯ С NOCODB В ФОНЕ */
  syncLikeInBackground(localLike, profile);
  /* 4. ПРОВЕРКА ВЗАИМНОСТИ */
  checkMutualInBackground(me, profile);

  state.busy = false;
}

async function syncLikeInBackground(localLike, profile){
  const body = { from_user_id: localLike.from_user_id, to_user_id: localLike.to_user_id };
  try{
    const result = await dbInsert('likes', Object.assign({},body,{ [FIELD_CREATED]: localLike[FIELD_CREATED] }));
    console.log('[SYNC] лайк сохранён в NocoDB: ', result);
    setStatus('синхронизировано','ok');
    localLikesRemove(localLike.Id);
    if(result && result.Id) localLike.Id = result.Id;
    // Обновим из NocoDB
    setTimeout(()=>{ refreshData().then(()=>render()); }, 500);
  }catch(e){
    console.error('[SYNC] не удалось сохранить лайк в NocoDB: '+e.message);
    setStatus('локально (оффлайн)','err');
    toast('Лайк сохранён локально. NocoDB недоступен.','warn');
  }
}

async function checkMutualInBackground(me, profile){
  try{
    const likes = await dbList('likes');
    const mutual = likes.filter(l=>l.from_user_id===profile.user_id && l.to_user_id===me.user_id)[0];
    if(mutual){
      try{ await dbInsert('matches',{ user1_id:me.user_id, user2_id:profile.user_id, [FIELD_CREATED]:nowIso() }); }
      catch(e){ console.warn('match insert failed:', e.message); }
      const myLink = state.profile ? profileLink(state.profile.profile_id) : '';
      const theirLink = profileLink(profile.profile_id);
      // Telegram
      if(me.telegram_chat_id){
        const k1='match_'+me.user_id+'_'+profile.user_id;
        if(!wasSent(k1)){ markSent(k1);
          sendTelegramMessage(me.telegram_chat_id, '💚 Взаимная симпатия!\n\nОткрыть анкету: '+theirLink); }
      }
      const owner = await getUser(profile.user_id);
      if(owner && owner.telegram_chat_id){
        const k2='match_'+profile.user_id+'_'+me.user_id;
        if(!wasSent(k2)){ markSent(k2);
          sendTelegramMessage(owner.telegram_chat_id, '💚 Взаимная симпатия!\n\nОткрыть анкету: '+(myLink||theirLink)); }
      }
      showMatchModal(profile);
      await refreshData();
      render();
    }
  }catch(e){
    console.warn('[MUTUAL] '+e.message);
  }
}

async function removeLikeNoco(from,to){
  const likes = await dbList('likes');
  const like = likes.filter(l=>l.from_user_id===from && l.to_user_id===to)[0];
  if(!like) return false;
  await dbDelete('likes', getRecordId(like));
  const matches = await dbList('matches');
  const m = matches.filter(x=>(x.user1_id===from&&x.user2_id===to)||(x.user1_id===to&&x.user2_id===from))[0];
  if(m) await dbDelete('matches', getRecordId(m));
  return true;
}

function saveSession(){ lsSet(SESSION_KEY,{ user:state.user, profile:state.profile, saved_at:nowIso() }); }

async function refreshData(){
  const out = { profiles:[], likes:[], matches:[] };
  try{ out.profiles = await dbList('profiles'); }catch(e){ console.warn('profiles load fail: '+e.message); }
  try{ out.likes = await dbList('likes'); }catch(e){ console.warn('likes load fail: '+e.message); }
  try{ out.matches = await dbList('matches'); }catch(e){ console.warn('matches load fail: '+e.message); }

  // Мержим локальные и серверные лайки (локальные — только те, что ещё не синхронизированы)
  const localLikes = localLikesAll();
  const serverLikeKeys = new Set(out.likes.map(l=>l.from_user_id+'|'+l.to_user_id));
  const pendingLocal = localLikes.filter(l=>!serverLikeKeys.has(l.from_user_id+'|'+l.to_user_id));

  state.profiles = out.profiles.length ? out.profiles : state.profiles;
  state.likes = out.likes.concat(pendingLocal);
  state.matches = out.matches.concat(localMatchesAll());

  if(state.profile){
    const fresh = state.profiles.filter(p=>p.profile_id===state.profile.profile_id)[0];
    if(fresh){ state.profile=fresh; saveSession(); }
  }
  console.log('[DATA] профилей='+state.profiles.length+' лайков='+state.likes.length+' (из них локальных '+pendingLocal.length+')');
}

function fileToDataUrl(file,maxSize,quality){
  maxSize=maxSize||900; quality=quality||0.82;
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          let w=img.width,h=img.height;
          const sc=Math.min(1,maxSize/Math.max(w,h));
          w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',quality));
        }catch(e){ resolve(r.result); }
      };
      img.onerror=()=>reject(new Error('Ошибка чтения'));
      img.src=r.result;
    };
    r.onerror=()=>reject(new Error('Ошибка файла'));
    r.readAsDataURL(file);
  });
}

        '<label class="photo-btn">📷 Фото<input id="pePhoto" type="file" accept="image/*" hidden></label></div>'+
      '<div class="form">'+
        '<label>Имя<input id="peName" type="text" maxlength="50" value="'+esc(base.name)+'"></label>'+
        '<div class="row2"><label>Возраст<input id="peAge" type="number" min="18" max="100" value="'+esc(base.age)+'"></label>'+
        '<label>Город<input id="peCity" type="text" maxlength="60" value="'+esc(base.city)+'"></label></div>'+
        '<div class="row2"><label>Пол<select id="peGender">'+genderOptions(base.gender)+'</select></label>'+
        '<label>Кого ищу<select id="peLooking">'+lookingOptions(base.looking_for)+'</select></label></div>'+
        '<label>Описание<textarea id="peDesc" rows="3" maxlength="1000">'+esc(base.description)+'</textarea></label>'+
        '<label>Интересы<input id="peInterests" type="text" maxlength="200" value="'+esc(base.interests)+'"></label>'+
        '<label class="check"><input type="checkbox" id="peVisible"'+(base.is_visible?' checked':'')+'> Показывать анкету</label>'+
        '<div class="err" id="peErr"></div></div>',
    footer:'<button class="btn-primary" id="peSave" type="button">Сохранить</button>',
    onMount:w=>{
      $('#pePhoto',w).addEventListener('change', async e=>{
        const f=e.target.files&&e.target.files[0]; if(!f)return;
        try{ photoData=await fileToDataUrl(f); $('#pePreview',w).src=photoData; }
        catch(err){ toast('Ошибка фото','error'); }
      });
      $('#peSave',w).addEventListener('click', async ()=>{
        const errBox=$('#peErr',w); errBox.textContent='';
        const name=$('#peName',w).value.trim();
        const age=Number($('#peAge',w).value);
        const city=$('#peCity',w).value.trim();
        const gender=$('#peGender',w).value;
        const lookingFor=$('#peLooking',w).value;
        const description=$('#peDesc',w).value.trim();
        const interests=$('#peInterests',w).value.trim();
        const visible=$('#peVisible',w).checked;
        if(name.length<2||name.length>50){ errBox.textContent='Имя 2–50.'; return; }
        if(!isFinite(age)||age<18||age>100){ errBox.textContent='Возраст 18–100.'; return; }
        if(city.length<2){ errBox.textContent='Город обязателен.'; return; }
        const btn=$('#peSave',w); btn.disabled=true; btn.textContent='Сохраняем…';
        setStatus('сохранение…','loading');
        try{
          if(state.profile && getRecordId(state.profile)){
            await updateProfile(getRecordId(state.profile),{ name,age,city,gender,looking_for:lookingFor,description,interests,photo_url:photoData||FALLBACK_IMG,is_visible:visible });
            state.profile=Object.assign({},state.profile,{ name,age,city,gender,looking_for:lookingFor,description,interests,photo_url:photoData||FALLBACK_IMG,is_visible:visible });
            toast('✏️ Обновлено','success');
          }else{
            const created = await createProfile({ user_id:state.user.user_id, name,age,city,gender,looking_for:lookingFor,description,interests,photo_url:photoData||FALLBACK_IMG,is_visible:visible });
            state.profile=created;
            toast('🎉 Анкета создана: '+created.profile_id,'success');
          }
          state.pendingRegistration=null;
          saveSession(); setStatus('готово','ok'); closeModal();
          await refreshData(); render();
        }catch(err){
          console.error('saveProfile: '+err.message);
          errBox.textContent='Ошибка: '+err.message;
          btn.disabled=false; btn.textContent='Сохранить';
          setStatus('ошибка','err');
        }
      });
    }
  });
}

/* ================= COMMENT ================= */
function openCommentModal(profile){
  if(!state.user){ showAuthOverlay(); return; }
  if(profile.user_id===state.user.user_id){ toast('Это ваша анкета','warn'); return; }
  openModal({
    title:'💬 Сообщение',
    body:'<div class="comment-target"><img src="'+esc(profile.photo_url||FALLBACK_IMG)+'" onerror="this.onerror=null;this.src=\''+FALLBACK_IMG+'\'">'+
      '<div><b>'+esc(profile.name)+', '+esc(profile.age)+'</b><span>📍 '+esc(profile.city)+'</span></div></div>'+
      '<textarea id="commentText" rows="4" maxlength="500" style="width:100%;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#f4f1fa;outline:none;font-size:16px;" placeholder="Напишите сообщение..."></textarea>'+
      '<div class="counter"><span id="commentCount">0</span>/500</div><div class="err" id="commentErr"></div>',
    footer:'<button class="btn-primary" id="commentSend" type="button">Отправить</button>',
    onMount:w=>{
      const ta=$('#commentText',w), c=$('#commentCount',w), errBox=$('#commentErr',w);
      ta.addEventListener('input',()=>c.textContent=ta.value.length);
      setTimeout(()=>ta.focus(),250);
      $('#commentSend',w).addEventListener('click', async ()=>{
        const text=ta.value.trim(); errBox.textContent='';
        if(!text){ errBox.textContent='Пустое сообщение.'; return; }
        if(text.length>500){ errBox.textContent='Максимум 500.'; return; }
        const btn=$('#commentSend',w); btn.disabled=true; btn.textContent='Отправляем…';
        try{
          await dbInsert('comments',{ from_user_id:state.user.user_id, to_user_id:profile.user_id,
            profile_id:profile.profile_id, text, [FIELD_CREATED]:nowIso() });
          const owner = await getUser(profile.user_id);
          const myLink = state.profile ? profileLink(state.profile.profile_id) : '';
          if(owner && owner.telegram_chat_id){
            await sendTelegramMessage(owner.telegram_chat_id, '💬 Вам написали:\n\n'+text+'\n\nОткрыть анкету: '+(myLink||'(нет)'));
          }
          try{ await dbInsert('notifications',{ user_id:profile.user_id, from_user_id:state.user.user_id,
            type:'comment', message:'💬 Вам написали: '+text.slice(0,80),
            profile_id:profile.profile_id, is_read:false, [FIELD_CREATED]:nowIso() }); }catch(e){}
          toast('💬 Отправлено','success'); closeModal();
        }catch(err){
          errBox.textContent='Ошибка: '+err.message;
          btn.disabled=false; btn.textContent='Отправить';
        }
      });
    }
  });
}

async function copyMyLink(){
  if(!state.profile){ toast('Сначала создайте анкету','warn'); return; }
  const link = profileLink(state.profile.profile_id);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(link); toast('📋 Скопировано','success'); return; }
    throw new Error('no');
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=link; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('📋 Скопировано','success'); }catch(err){ toast('Ссылка: '+link,'info'); }
    ta.remove();
  }
}

/* ================= VIEWS ================= */
function viewDiscover(){
  const me=state.user; if(!me) return '';
  const myLikes={};
  state.likes.forEach(l=>{ if(l.from_user_id===me.user_id) myLikes[l.to_user_id]=true; });
  let list = state.profiles.filter(p=>p.user_id!==me.user_id && isVisible(p) && !myLikes[p.user_id]);
  const f=state.filters;
  list=list.filter(p=>{
    const age=Number(p.age)||0;
    if(age<f.ageFrom||age>f.ageTo) return false;
    if(f.city && String(p.city||'').toLowerCase().indexOf(f.city.toLowerCase())===-1) return false;
    if(f.gender && p.gender!==f.gender) return false;
    if(f.lookingFor && f.lookingFor!=='any' && p.looking_for!==f.lookingFor && p.looking_for!=='any') return false;
    return true;
  });
  if(state.deckIndex>=list.length) state.deckIndex=0;
  if(state.deckIndex<0) state.deckIndex=0;

  const filtersHtml =
    '<div class="filters'+(state.filtersOpen?' open':'')+'">'+
      '<button class="filters-toggle" data-act="toggleFilters" type="button"><span>🔎 Фильтры</span><span class="chev">▼</span></button>'+
      '<div class="filters-body">'+
        '<div class="row2"><label>Возраст от<input id="fAgeFrom" type="number" min="18" max="100" value="'+esc(f.ageFrom)+'"></label>'+
        '<label>Возраст до<input id="fAgeTo" type="number" min="18" max="100" value="'+esc(f.ageTo)+'"></label></div>'+
        '<label>Город<input id="fCity" type="text" maxlength="60" value="'+esc(f.city)+'"></label>'+
        '<div class="row2"><label>Пол<select id="fGender"><option value="">Любой</option><option value="female"'+(f.gender==='female'?' selected':'')+'>Женщина</option><option value="male"'+(f.gender==='male'?' selected':'')+'>Мужчина</option></select></label>'+
        '<label>Кого ищет<select id="fLookingFor"><option value="">Любой</option><option value="male"'+(f.lookingFor==='male'?' selected':'')+'>Мужчину</option><option value="female"'+(f.lookingFor==='female'?' selected':'')+'>Женщину</option></select></label></div>'+
        '<div class="row2"><button class="btn-ghost" data-act="resetFilters" type="button">Сбросить</button>'+
        '<button class="btn-primary" data-act="applyFilters" type="button">Применить</button></div>'+
      '</div></div>';

  if(!list.length){
    return filtersHtml+
      '<div class="empty"><div class="empty-icon">🔎</div>'+
      '<h3>Нет анкет для показа</h3>'+
      '<p>Всего в базе: <b>'+state.profiles.length+'</b> анкет.</p>'+
      '<p style="font-size:12px;color:#aaa;">Зарегистрируйтесь во втором браузере, чтобы создать вторую анкету. Либо добавьте запись вручную в NocoDB → таблица Profiles.</p>'+
      '<button class="btn-primary" data-act="resetFilters" type="button">Сбросить фильтры</button></div>';
  }
  const p = list[state.deckIndex];
  return filtersHtml+
    '<div class="deck"><div class="card" id="mainCard">'+
      '<div class="card-photo"><img src="'+esc(p.photo_url||FALLBACK_IMG)+'" onerror="this.onerror=null;this.src=\''+FALLBACK_IMG+'\'">'+
        '<div class="photo-shade"></div><div class="card-counter">'+(state.deckIndex+1)+' / '+list.length+'</div></div>'+
      '<div class="card-body"><h2>'+esc(p.name)+', '+esc(p.age)+'</h2>'+
        '<div class="card-city">📍 '+esc(p.city)+'</div>'+
        (p.description?'<p class="card-desc">'+esc(p.description)+'</p>':'')+
        '<div class="tags">'+tagsHtml(p.interests)+'</div></div></div>'+
      '<div class="deck-actions">'+
        '<button class="act act-skip" data-act="skip" type="button">✕</button>'+
        '<button class="act act-comment" data-act="comment" data-uid="'+esc(p.user_id)+'" type="button">💬</button>'+
        '<button class="act act-like" data-act="like" data-uid="'+esc(p.user_id)+'" type="button">❤️</button>'+
      '</div>'+
      '<button class="btn-open-profile" data-act="open" data-pid="'+esc(p.profile_id)+'" type="button">👤 Открыть профиль</button></div>';
}

function viewLikes(){
  const me=state.user; if(!me) return '';
  const tab=state.likedTab; let items=[];
  if(tab==='incoming'){
    items = state.likes.filter(l=>l.to_user_id===me.user_id)
      .map(l=>({ profile:profileByUserId(l.from_user_id), like:l }))
      .filter(x=>!!x.profile);
  }else if(tab==='outgoing'){
    items = state.likes.filter(l=>l.from_user_id===me.user_id)
      .map(l=>({ profile:profileByUserId(l.to_user_id), like:l }))
      .filter(x=>!!x.profile);
  }else{
    items = state.matches.filter(m=>m.user1_id===me.user_id||m.user2_id===me.user_id)
      .map(m=>{ const other=m.user1_id===me.user_id?m.user2_id:m.user1_id;
        return { profile:profileByUserId(other), match:m }; })
      .filter(x=>!!x.profile);
  }
  const tabsHtml = '<div class="tabs">'+
    '<button class="tab'+(tab==='incoming'?' active':'')+'" data-act="tab" data-tab="incoming" type="button">Меня лайкнули</button>'+
    '<button class="tab'+(tab==='outgoing'?' active':'')+'" data-act="tab" data-tab="outgoing" type="button">Я лайкнул</button>'+
    '<button class="tab'+(tab==='mutual'?' active':'')+'" data-act="tab" data-tab="mutual" type="button">Взаимные</button></div>';
  if(!items.length){
    const t={ incoming:['💌','Пока никто не лайкнул','Поделитесь ссылкой.'],
      outgoing:['❤️','Вы ещё никого не лайкнули','Перейдите в «Знакомства».'],
      mutual:['💚','Взаимных пока нет','Когда совпадёт — появится здесь.'] }[tab];
    return tabsHtml+'<div class="empty"><div class="empty-icon">'+t[0]+'</div><h3>'+t[1]+'</h3><p>'+t[2]+'</p></div>';
  }
  const cards = items.map(it=>{
    const p=it.profile; let btn='';
    if(tab==='incoming') btn='<button data-act="like" data-uid="'+esc(p.user_id)+'" type="button">❤️</button>';
    else if(tab==='outgoing') btn='<button data-act="unlike" data-uid="'+esc(p.user_id)+'" type="button">💔</button>';
    else btn='<button data-act="comment" data-uid="'+esc(p.user_id)+'" type="button">💬</button>';
    return '<div class="mini"><div class="mini-photo"><img src="'+esc(p.photo_url||FALLBACK_IMG)+'" onerror="this.onerror=null;this.src=\''+FALLBACK_IMG+'\'"></div>'+
      '<div class="mini-body"><div class="mini-name">'+esc(p.name)+', '+esc(p.age)+'</div><div class="mini-city">📍 '+esc(p.city)+'</div></div>'+
      '<div class="mini-actions"><button data-act="open" data-pid="'+esc(p.profile_id)+'" type="button">👤</button>'+btn+'</div></div>';
  }).join('');
  return tabsHtml+'<div class="grid">'+cards+'</div>';
}

function viewMatches(){
  const me=state.user; if(!me) return '';
  const items = state.matches.filter(m=>m.user1_id===me.user_id||m.user2_id===me.user_id)
    .map(m=>{ const other=m.user1_id===me.user_id?m.user2_id:m.user1_id;

    '<button class="btn-primary" data-act="goHome" type="button">На главную</button></div>';
  const me=state.user;
  const isMine = me && p.user_id===me.user_id;

      '<button class="btn-primary" data-act="editProfile" type="button">✏️ Редактировать</button></div>';
  }else{
    actionsHtml='<div class="deck-actions">'+
      '<button class="act act-comment" data-act="comment" data-uid="'+esc(p.user_id)+'" type="button">💬</button>'+
      (alreadyLiked
        ? '<button class="act act-like" data-act="unlike" data-uid="'+esc(p.user_id)+'" type="button">💔</button>'
        : '<button class="act act-like" data-act="like" data-uid="'+esc(p.user_id)+'" type="button">❤️</button>')+
      '</div><div style="text-align:center;margin-top:10px;font-size:12.5px;color:var(--muted);">'+

  return '<div class="pv"><div class="pv-photo">'+
    '<button class="pv-back" data-act="goHome" type="button">←</button>'+
    '<img src="'+esc(p.photo_url||FALLBACK_IMG)+'" onerror="this.onerror=null;this.src=\''+FALLBACK_IMG+'\'">'+

/* ================= RENDER ================= */
function render(){
  const view = document.getElementById('view');
  if(!state.user && state.view!=='profile'){ showAuthOverlay(); view.innerHTML=''; updateNav(); return; }
  hideAuthOverlay();
  if(state.user && !state.profile && state.view!=='profile'){
    view.innerHTML = '<div class="empty"><div class="empty-icon">📝</div><h3>Остался последний шаг</h3>'+
      '<p>Создайте анкету, чтобы вас могли найти.</p>'+
      '<button class="btn-primary" data-act="editProfile" type="button">Создать анкету</button></div>';
    updateNav(); return;
  }
  if(state.view==='discover') view.innerHTML = viewDiscover();
  else if(state.view==='likes') view.innerHTML = viewLikes();
  else if(state.view==='matches') view.innerHTML = viewMatches();
  else if(state.view==='me') view.innerHTML = viewMe();
  else if(state.view==='profile') view.innerHTML = viewProfile(state.viewProfileId);
  else view.innerHTML = viewDiscover();
  updateNav();
}
function updateNav(){
  $$('#bottomNav .nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
  const nav = document.getElementById('bottomNav');
  if(nav) nav.style.display = (!state.user && state.view==='profile') ? 'none' : 'grid';
}

/* ================= EVENTS ================= */
async function onViewClick(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  console.log('[CLICK] '+act);

  if(act==='toggleFilters'){ state.filtersOpen=!state.filtersOpen; render(); return; }
  if(act==='applyFilters'){
    const f={
      ageFrom:clampNum($('#fAgeFrom').value,18,100,18),
      ageTo:clampNum($('#fAgeTo').value,18,100,100),
      city:$('#fCity').value.trim(),
      gender:$('#fGender').value,
      lookingFor:$('#fLookingFor').value
    };
    if(f.ageFrom>f.ageTo){ const t=f.ageFrom; f.ageFrom=f.ageTo; f.ageTo=t; }
    state.filters=f; state.deckIndex=0; state.filtersOpen=true;
    toast('Фильтры применены','success'); render(); return;
  }
  if(act==='resetFilters'){
    state.filters={ ageFrom:18,ageTo:100,city:'',gender:'',lookingFor:'' };
    state.deckIndex=0; render(); return;
  }
  if(act==='tab'){ state.likedTab=el.dataset.tab||'incoming'; render(); return; }
  if(act==='goHome'){ navigateTo('discover'); return; }
  if(act==='open'){ goToProfile(el.dataset.pid); return; }
  if(act==='comment'){ const p=profileByUserId(el.dataset.uid); if(p) openCommentModal(p); return; }
  if(act==='skip'){ state.deckIndex++; render(); window.scrollTo(0,0); return; }
  if(act==='like'){
    if(!state.user){ showAuthOverlay(); return; }
    const p = profileByUserId(el.dataset.uid);
    if(!p){ toast('Профиль не найден','error'); return; }
    await handleLike(p);
    return;
  }
  if(act==='unlike'){ const p=profileByUserId(el.dataset.uid); if(p) openUnlikeConfirm(p); return; }
  if(act==='editProfile'){ openProfileEditor(false); return; }
  if(act==='copyLink'){ copyMyLink(); return; }
  if(act==='openMine'){ if(state.profile) goToProfile(state.profile.profile_id); return; }
  if(act==='logout'){ logout(); return; }
}

/* ================= START ================= */
async function start(){
  loadSession();
  console.log('=== HeartLink DEMO_MODE='+DEMO_MODE+' ===');
  if(Object.keys(PLATFORM).length) console.log('PLATFORM:', PLATFORM);

  document.getElementById('view').addEventListener('click', function(e){
    onViewClick(e).catch(err=>{
      console.error('[UI] '+err.message);
      toast('Ошибка: '+err.message,'error');
    });
  });

  $$('#bottomNav .nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!state.user){ showAuthOverlay(); return; }
      navigateTo(btn.dataset.view);
    });
  });

  window.addEventListener('popstate', ()=>{
    const r=getRoute();
    if(r.view==='profile'){ state.view='profile'; state.viewProfileId=r.profileId; }
    else { state.view=r.view; state.viewProfileId=null; }
    render();
  });

  setStatus('загрузка…','loading');
  await refreshData();
  if(state.nocoOnline) setStatus('готово','ok');
  else setStatus('оффлайн','err');

  const route = getRoute();
  if(route.view==='profile'){ state.view='profile'; state.viewProfileId=route.profileId; }
  else { state.view=route.view; state.viewProfileId=null; }
  render();
  console.log('=== Приложение запущено ===');
}

document.addEventListener('DOMContentLoaded', ()=>{
  start().catch(err=>{
    console.error('START FAILED: '+err.message);
    toast('Ошибка запуска: '+err.message,'error');
  });
});
</script>
