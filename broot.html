<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Secret Signal — знакомства</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000000;
  --surface:#0f0f12;
  --surface-2:#16161c;
  --surface-3:#1e1e26;
  --border:rgba(168,85,247,.18);
  --border-soft:rgba(255,255,255,.06);
  --text:#ffffff;
  --text-dim:#8b8b96;
  --text-muted:#5a5a66;
  --purple:#a855f7;
  --purple-light:#c084fc;
  --purple-dark:#7c3aed;
  --purple-glow:rgba(168,85,247,.35);
  --grad:linear-gradient(135deg,#a855f7,#6366f1);
  --grad-soft:linear-gradient(135deg,#7c3aed,#4f46e5);
}
html,body{width:100%;height:100%;background:#000;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden;position:fixed;top:0;left:0;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;}

#app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;
  position:relative;overflow:hidden;background:var(--bg);}

/* ============ TOPBAR ============ */
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;
  align-items:center;justify-content:space-between;padding:10px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,.95) 55%,rgba(0,0,0,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:32px;height:32px;object-fit:contain;
  background:transparent;border:none;border-radius:0;box-shadow:none;
  display:block;}
.brand-name{font-weight:800;font-size:16px;letter-spacing:.2px;
  background:linear-gradient(90deg,#c084fc,#a855f7 60%,#7c3aed);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:flex;align-items:center;gap:6px;}
.brand-name small{font-weight:500;font-size:11px;color:var(--text-muted);
  background:none;-webkit-text-fill-color:initial;letter-spacing:.4px;}
#syncStatus{font-size:11px;font-weight:700;padding:5px 11px;border-radius:12px;
  background:rgba(255,255,255,.05);color:var(--text-dim);
  border:1px solid rgba(255,255,255,.06);transition:.3s;}
#syncStatus.ok{background:rgba(168,85,247,.15);color:#c084fc;
  border-color:rgba(168,85,247,.35);}
#syncStatus.err{background:rgba(255,95,95,.12);color:#ff8080;
  border-color:rgba(255,95,95,.25);}
#syncStatus.loading{background:rgba(168,85,247,.1);color:#c084fc;
  border-color:rgba(168,85,247,.25);animation:syncPulse 1.4s infinite;}
@keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.65;}}

/* ============ MAIN ============ */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;
  padding-top:52px;position:relative;background:var(--bg);}

/* ============ BOTTOM NAV ============ */
#bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:rgba(10,10,12,.92);backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(168,85,247,.14);}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 4px;border-radius:12px;background:transparent;border:none;
  color:var(--text-muted);cursor:pointer;transition:.2s;font-family:inherit;
  position:relative;}
.nav-btn span{font-size:19px;line-height:1;transition:transform .2s;}
.nav-btn em{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.1px;}
.nav-btn.active{color:var(--purple-light);background:rgba(168,85,247,.14);}
.nav-btn.active span{transform:translateY(-1px) scale(1.1);
  filter:drop-shadow(0 0 6px rgba(168,85,247,.6));}
.nav-btn:active{transform:scale(.94);}

/* ============ DISCOVER ============ */
.discover{display:flex;flex-direction:column;height:100%;overflow:hidden;}

.photos-grid{display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;gap:3px;background:transparent;
  aspect-ratio:1/1;width:100%;flex-shrink:0;padding:6px 8px;
  border-radius:26px;overflow:hidden;}
.photo-item{overflow:hidden;background:var(--surface-2);
  border-radius:24px;cursor:pointer;position:relative;
  transition:transform .3s ease;
  border:1px solid rgba(168,85,247,.12);}
.photo-item img{width:100%;height:100%;display:block;object-fit:cover;
  background:var(--surface-2);pointer-events:none;}
.photo-item--main{grid-row:1 / span 2;}
.photo-item.expanded{position:fixed;inset:0;z-index:1000;border-radius:0!important;
  background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:none;}
.photo-item.expanded img{width:100vw;height:100vh;object-fit:contain;}
.close-expanded-btn{position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%);z-index:1001;background:rgba(168,85,247,.25);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(168,85,247,.45);color:#fff;padding:12px 34px;
  border-radius:30px;font-size:15px;font-weight:600;cursor:pointer;
  letter-spacing:.3px;font-family:inherit;}
.close-expanded-btn:active{transform:translateX(-50%) scale(.95);}

/* ============ INFO ============ */
.info-wrapper{flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding-bottom:150px;
  padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));}
.info-wrapper::-webkit-scrollbar{width:3px;}
.info-wrapper::-webkit-scrollbar-thumb{background:rgba(168,85,247,.35);border-radius:10px;}
.info-block{padding:18px 16px 22px;background:var(--surface);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:26px 26px 0 0;border-top:1px solid rgba(168,85,247,.18);
  box-shadow:0 -8px 30px rgba(168,85,247,.06);}

.name-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.name{font-size:22px;font-weight:750;letter-spacing:-.3px;color:var(--text);
  display:flex;align-items:center;gap:6px;}
.name .age{font-weight:500;color:var(--text-dim);}
.verified-badge{display:inline-grid;place-items:center;width:22px;height:22px;
  border-radius:50%;background:var(--grad);color:#fff;font-size:13px;
  font-weight:800;box-shadow:0 0 12px rgba(168,85,247,.55);}

.chips-container{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.chip{height:34px;padding:0 12px;border-radius:17px;
  background:rgba(168,85,247,.08);color:#e5e5ee;
  display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  white-space:nowrap;border:1px solid rgba(168,85,247,.2);}
.chip svg{width:16px;height:16px;stroke:#c084fc;fill:none;stroke-width:1.8;
  flex-shrink:0;}
.chip svg.filled{fill:#c084fc;stroke:none;}
.bio-text{font-size:15.5px;line-height:1.5;color:#d4d4dc;margin-top:13px;
  word-wrap:break-word;}

/* ============ ACTION BAR ============ */
.actions-bar{position:fixed;left:0;right:0;z-index:70;
  bottom:calc(60px + env(safe-area-inset-bottom,0px));
  padding:10px 16px;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;
  background:rgba(10,10,12,.94);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(168,85,247,.18);
  box-shadow:0 -8px 30px rgba(168,85,247,.08);}
.action-btn{height:60px;border:none;border-radius:16px;display:grid;
  place-items:center;font-size:26px;cursor:pointer;
  transition:opacity .15s,transform .1s,box-shadow .2s;
  color:#fff;border:1px solid rgba(255,255,255,.08);user-select:none;
  font-family:inherit;position:relative;overflow:hidden;}
.action-btn:active{opacity:.85;transform:scale(.94);}

/* ✕ — сдержанная, тёмная */
.action-btn--no{background:rgba(255,255,255,.05);color:#7a7a86;
  border-color:rgba(255,255,255,.08);font-size:24px;}
.action-btn--no:active{background:rgba(255,255,255,.1);}

/* 💬 — комментарий, средняя с фиолетовым отблеском */
.action-btn--comment{background:rgba(168,85,247,.14);color:#c084fc;
  border-color:rgba(168,85,247,.3);font-size:24px;}
.action-btn--comment:active{background:rgba(168,85,247,.24);}

/* ❤️ — главная, яркая фиолетовая */
.action-btn--yes{background:var(--grad);color:#fff;
  border-color:transparent;
  box-shadow:0 6px 24px rgba(168,85,247,.45),
    inset 0 1px 0 rgba(255,255,255,.2);}
.action-btn--yes::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 60%);
  pointer-events:none;}

/* ============ LISTS / CARDS ============ */
.list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px 16px calc(80px + env(safe-area-inset-bottom,0px));}
.tabs{display:flex;gap:7px;padding:0 16px 14px;overflow-x:auto;
  scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:9px 16px;border-radius:17px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);color:var(--text-dim);
  font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;
  font-family:inherit;transition:.2s;}
.tab.active{background:var(--grad);color:#fff;border-color:transparent;
  box-shadow:0 4px 16px rgba(168,85,247,.4);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;}
.mini{background:var(--surface);border-radius:20px;overflow:hidden;
  border:1px solid rgba(168,85,247,.14);
  transition:transform .15s;}
.mini:active{transform:scale(.98);}
.mini-photo{height:160px;background:var(--surface-2);}
.mini-photo img{width:100%;height:100%;object-fit:cover;}
.mini-body{padding:10px 12px 4px;}
.mini-name{font-weight:700;font-size:14px;color:var(--text);}
.mini-city{font-size:12px;color:var(--text-dim);margin-top:2px;}
.mini-actions{display:flex;gap:6px;padding:8px 10px 10px;}
.mini-actions button{flex:1;padding:9px;border-radius:12px;
  background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.22);
  font-size:16px;cursor:pointer;color:#c084fc;transition:.15s;
  font-family:inherit;}
.mini-actions button:active{transform:scale(.94);
  background:rgba(168,85,247,.22);}

/* ============ ME ============ */
.me-card{background:var(--surface);border-radius:24px;padding:18px;
  border:1px solid rgba(168,85,247,.18);margin-bottom:14px;
  box-shadow:0 8px 30px rgba(168,85,247,.08);}
.me-photo{border-radius:22px;overflow:hidden;aspect-ratio:1/1;
  background:var(--surface-2);border:1px solid rgba(168,85,247,.15);}
.me-photo img{width:100%;height:100%;object-fit:cover;}
.me-info{margin-top:16px;}
.me-info h2{font-size:22px;font-weight:750;color:var(--text);}
.me-info .city{color:var(--text-dim);font-size:14px;margin-top:4px;}
.me-info .desc{margin-top:12px;font-size:15px;line-height:1.5;color:#d4d4dc;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.stat{background:rgba(168,85,247,.07);border-radius:18px;padding:14px;
  text-align:center;border:1px solid rgba(168,85,247,.14);}
.stat b{display:block;font-size:24px;font-weight:800;
  background:linear-gradient(90deg,#c084fc,#a855f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.stat span{font-size:12px;color:var(--text-dim);}
.actions-col{display:flex;flex-direction:column;gap:10px;margin-top:16px;}

.btn-primary{width:100%;padding:14px;border-radius:14px;font-weight:700;
  font-size:15px;color:#fff;border:none;cursor:pointer;
  background:var(--grad);
  box-shadow:0 8px 24px rgba(168,85,247,.4);transition:.15s;font-family:inherit;
  position:relative;overflow:hidden;}
.btn-primary::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 60%);
  pointer-events:none;}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.5;}
.btn-ghost{width:100%;padding:14px;border-radius:14px;font-weight:600;
  font-size:15px;background:rgba(168,85,247,.08);
  border:1px solid rgba(168,85,247,.2);
  color:#c084fc;cursor:pointer;font-family:inherit;transition:.15s;}
.btn-ghost:active{transform:scale(.97);background:rgba(168,85,247,.16);}

/* ============ FORMS / MODALS ============ */
.form{display:flex;flex-direction:column;gap:12px;}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;
  color:var(--text-dim);font-weight:600;}
.form input,.form textarea,.form select{width:100%;padding:13px 14px;
  border-radius:14px;background:var(--surface-2);
  border:1px solid rgba(168,85,247,.16);
  color:var(--text);outline:none;font-family:inherit;font-size:16px;
  transition:border-color .2s, box-shadow .2s;}
.form input:focus,.form textarea:focus,.form select:focus{
  border-color:rgba(168,85,247,.6);
  box-shadow:0 0 0 3px rgba(168,85,247,.15);}
.form textarea{resize:vertical;min-height:80px;}
.form select{appearance:none;-webkit-appearance:none;padding-right:38px;
  background-image:linear-gradient(45deg,transparent 50%,#c084fc 50%),
    linear-gradient(135deg,#c084fc 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px;background-repeat:no-repeat;}
.form select option{background:#16161c;color:#fff;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form .check{flex-direction:row;align-items:center;gap:9px;font-size:14px;
  color:#d4d4dc;}
.form .check input{width:18px;height:18px;accent-color:#a855f7;padding:0;}

.modal-backdrop{position:fixed;inset:0;z-index:100;display:flex;
  align-items:flex-end;justify-content:center;background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transition:opacity .22s ease;}
.modal-backdrop.show{opacity:1;}
.modal{width:min(520px,100%);max-height:92vh;overflow-y:auto;
  background:var(--surface);border-radius:26px 26px 0 0;
  border-top:1px solid rgba(168,85,247,.25);
  box-shadow:0 -12px 40px rgba(168,85,247,.15);
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(26px);transition:transform .28s cubic-bezier(.2,.8,.25,1);}
.modal-backdrop.show .modal{transform:none;}
@media (min-width:640px){
  .modal-backdrop{align-items:center;padding:24px;}
  .modal{border-radius:26px;max-height:88vh;
    border:1px solid rgba(168,85,247,.25);}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;gap:10px;}
.modal-head h3{font-size:18px;font-weight:800;color:var(--text);}
.modal-close{width:34px;height:34px;border-radius:50%;
  background:rgba(168,85,247,.12);font-size:15px;color:#c084fc;border:none;
  display:grid;place-items:center;cursor:pointer;font-family:inherit;}
.modal-close:active{background:rgba(168,85,247,.22);}
.modal-foot{margin-top:16px;}
.err{color:#ff8080;font-size:13px;min-height:16px;font-weight:600;}

.photo-picker{display:flex;flex-direction:column;align-items:center;
  gap:12px;margin-bottom:14px;}
.photo-picker img{width:130px;height:130px;border-radius:50%;object-fit:cover;
  border:3px solid rgba(168,85,247,.45);
  box-shadow:0 0 20px rgba(168,85,247,.35);
  background:var(--surface-2);}
.photo-btn{padding:10px 20px;border-radius:14px;
  background:rgba(168,85,247,.12);
  border:1px solid rgba(168,85,247,.3);
  font-size:13px;font-weight:600;cursor:pointer;display:inline-block;
  color:#c084fc;transition:.15s;}
.photo-btn:active{background:rgba(168,85,247,.22);}

.comment-target{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
.comment-target img{width:52px;height:52px;border-radius:50%;object-fit:cover;
  background:var(--surface-2);border:2px solid rgba(168,85,247,.35);}
.comment-target b{display:block;font-size:15px;color:var(--text);}
.comment-target span{font-size:12.5px;color:var(--text-dim);}
.counter{text-align:right;font-size:12px;color:var(--text-dim);margin-top:6px;}

/* Match modal */
.match-box{text-align:center;padding:8px 0 0;}
.match-heart{font-size:70px;line-height:1;
  filter:drop-shadow(0 0 20px rgba(168,85,247,.7));
  animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.match-box h2{margin:14px 0 6px;font-size:23px;font-weight:800;
  background:linear-gradient(90deg,#c084fc,#a855f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.match-box p{margin:0 0 16px;color:var(--text-dim);font-size:14px;}
.match-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;
  margin:0 auto;border:3px solid rgba(168,85,247,.6);
  box-shadow:0 0 30px rgba(168,85,247,.5);
  background:var(--surface-2);}
.match-name{margin-top:10px;font-weight:700;font-size:16px;color:var(--text);}

/* ============ AUTH ============ */
.auth-overlay{position:fixed;inset:0;z-index:150;overflow-y:auto;
  background:#000;
  background-image:
    radial-gradient(900px 520px at 15% -10%,rgba(168,85,247,.22),transparent 60%),
    radial-gradient(820px 520px at 90% -5%,rgba(99,102,241,.15),transparent 60%);
  padding:36px 18px calc(44px + env(safe-area-inset-bottom,0px));}
.auth-card{max-width:480px;margin:0 auto;}
.auth-logo-img{width:96px;height:96px;object-fit:contain;
  display:block;margin:0 auto;
  background:transparent;border:none;border-radius:0;box-shadow:none;}
.auth-card h1{text-align:center;margin:16px 0 4px;font-size:28px;font-weight:800;
  background:linear-gradient(90deg,#c084fc,#a855f7 55%,#7c3aed);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:.3px;}
.auth-card .tagline{text-align:center;font-size:11px;font-weight:600;
  color:#6b21a8;letter-spacing:3px;text-transform:uppercase;margin:0 0 6px;}
.auth-sub{text-align:center;color:var(--text-dim);font-size:14px;margin:0 0 24px;}

/* ============ TOASTS ============ */
#toastRoot{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:min(440px,92vw);}
.toast{width:100%;padding:13px 16px;border-radius:14px;font-size:14px;
  font-weight:600;text-align:center;background:rgba(22,22,28,.96);
  color:#fff;border:1px solid rgba(168,85,247,.35);
  box-shadow:0 14px 34px rgba(168,85,247,.25);
  opacity:0;transform:translateY(14px);transition:.28s;}
.toast.show{opacity:1;transform:none;}
.toast-success{border-color:rgba(168,85,247,.55);
  box-shadow:0 14px 34px rgba(168,85,247,.4);}
.toast-error{background:rgba(60,10,20,.96);border-color:rgba(255,95,95,.5);
  box-shadow:0 14px 34px rgba(255,95,95,.3);}
.toast-warn{background:rgba(60,45,10,.96);border-color:rgba(255,190,80,.45);}

/* ============ EMPTY ============ */
.empty{padding:60px 24px;text-align:center;color:var(--text-dim);}
.empty-icon{font-size:56px;margin-bottom:14px;line-height:1;
  filter:drop-shadow(0 0 16px rgba(168,85,247,.4));}
.empty h3{color:var(--text);margin:0 0 8px;font-size:19px;}
.empty p{margin:0 0 20px;font-size:14px;line-height:1.55;}
.empty .btn-primary{max-width:280px;margin:0 auto;}

.section-title{padding:0 16px 12px;font-size:12px;font-weight:700;
  color:var(--purple-light);text-transform:uppercase;letter-spacing:1.2px;}

.badge-auto{display:inline-block;margin-left:6px;font-size:10px;padding:3px 7px;
  border-radius:8px;background:rgba(168,85,247,.18);color:#c084fc;
  font-weight:700;vertical-align:middle;border:1px solid rgba(168,85,247,.3);}

/* ============ RESPONSIVE ============ */
@media (max-width:480px){
  .info-block{padding:14px 12px 22px;border-radius:22px 22px 0 0;}
  .actions-bar{padding:8px 12px;gap:10px;}
  .action-btn{height:56px;font-size:24px;}
  .name{font-size:20px;}
  .chip{font-size:12px;height:32px;padding:0 10px;}
  .bio-text{font-size:15px;}
  .photos-grid{border-radius:22px;padding:4px 6px;}
  .photo-item{border-radius:22px;}
  .brand-logo{width:28px;height:28px;}
  .brand-name{font-size:14px;}
}
@media (max-width:380px){
  .action-btn{height:50px;font-size:22px;}
  .name{font-size:18px;}
  .chip{font-size:11px;height:28px;padding:0 9px;}
  .bio-text{font-size:14px;}
  .photos-grid{border-radius:18px;}
  .photo-item{border-radius:18px;}

/* ================= ROUTING ================= */
function computeBaseUrl(){
  if(CONFIG.publicBaseUrl) return CONFIG.publicBaseUrl.replace(/\/?$/,'/');
  if(location.protocol==='file:') return location.href.split('#')[0].split('?')[0];
  let p=location.pathname.replace(/\/(profile|p)\/[^\/]+\/?$/i,'/');
  p=p.replace(/index\.html$/i,'');
  if(!p.endsWith('/')) p=p.replace(/\/[^\/]*$/,'/');
  if(!p) p='/';
  return location.origin+p;
}
function profileLink(pid){
  const base=computeBaseUrl();
  if(location.protocol==='file:') return base+'#/profile/'+pid;
  return base.replace(/\/$/,'')+'/profile/'+pid;
}
function getRoute(){
  const path=location.pathname||'';
  let m=path.match(/\/(?:profile|p)\/([^\/?#]+)/i);
  if(m) return {view:'profile',profileId:decodeURIComponent(m[1])};
  const hash=(location.hash||'').replace(/^#\/?/,'');
  m=hash.match(/^(?:profile|p)\/([^\/?#]+)/i);
  if(m) return {view:'profile',profileId:decodeURIComponent(m[1])};
  if(['discover','likes','matches','me'].indexOf(hash)!==-1) return {view:hash};
  return {view:'discover'};
}

/* ================= NOCODB ================= */
function tableUrl(t){
  const m={users:CONFIG.usersTableUrl,profiles:CONFIG.profilesTableUrl,
    likes:CONFIG.likesTableUrl,matches:CONFIG.matchesTableUrl,
    comments:CONFIG.commentsTableUrl,notifications:CONFIG.notificationsTableUrl};
  if(!m[t]) throw new Error('Unknown table: '+t);
  return m[t];
}
async function fetchWithTimeout(url,opts,ms){
  ms=ms||15000;
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms);
  try{const res=await fetch(url,Object.assign({},opts,{signal:ctrl.signal}));
    clearTimeout(t);return res;
  }catch(e){clearTimeout(t);throw e;}
}
async function nocoRequest(method,url,body){
  const token=CONFIG.apiToken;
  const strategies=[
    {name:'xc-token',headers:{'Content-Type':'application/json','xc-token':token}},
    {name:'bearer',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}},
    {name:'qs',headers:{'Content-Type':'application/json'},qs:'?xc-token='+encodeURIComponent(token)}
  ];
  let lastErr='';
  for(const s of strategies){
    try{
      const finalUrl = url + (s.qs ? (url.indexOf('?')===-1?'?':'&') + s.qs.slice(1) : '');
      const opts={method,headers:s.headers};
      if(body) opts.body=JSON.stringify(body);
      console.log('[NocoDB:'+s.name+'] '+method+' '+finalUrl.slice(0,90));
      const res=await fetchWithTimeout(finalUrl,opts,15000);
      const text=await res.text();
      let json=null;try{json=text?JSON.parse(text):null;}catch(e){}
      if(res.ok){
        console.log('[NocoDB:'+s.name+'] OK');
        state.nocoOnline=true;
        return json;
      }
      lastErr=res.status+': '+((json&&(json.msg||json.message||json.error))||text.slice(0,150));
      console.warn('[NocoDB:'+s.name+'] '+lastErr);
      if(res.status===401||res.status===403) continue;
      if(res.status===400){state.nocoOnline=true;throw new Error(lastErr);}
    }catch(e){
      lastErr=e.message;
      console.warn('[NocoDB:'+s.name+'] exception: '+lastErr);
    }
  }
  state.nocoOnline=false;
  throw new Error(lastErr||'NocoDB: все стратегии провалились');
}
async function dbList(t){
  const r=await nocoRequest('GET',tableUrl(t)+'?limit=1000');
  return (r&&(r.list||r.records))||[];
}
async function dbInsert(t,rec){
  try{return await nocoRequest('POST',tableUrl(t),rec);}
  catch(e){
    if(String(e.message).indexOf('400')!==-1||String(e.message).toLowerCase().indexOf('column')!==-1){
      const c=Object.assign({},rec);delete c[FIELD_CREATED];delete c[FIELD_UPDATED];
      console.warn('[NocoDB] повтор без '+FIELD_CREATED);
      return await nocoRequest('POST',tableUrl(t),c);
    }
    throw e;
  }
}
async function dbUpdate(t,id,patch){
  const payload=Object.assign({},patch,{Id:id});
  try{return await nocoRequest('PATCH',tableUrl(t),payload);}
  catch(e){
    if(String(e.message).toLowerCase().indexOf('column')!==-1){
      const c=Object.assign({},patch,{Id:id});delete c[FIELD_UPDATED];
      return await nocoRequest('PATCH',tableUrl(t),c);
    }
    throw e;
  }
}
async function dbDelete(t,id){
  await nocoRequest('DELETE',tableUrl(t),[{Id:id}]);
  return true;
}

/* ================= LOCAL LIKES ================= */
function localLikesAll(){return lsGet(LOCAL_LIKES_KEY,[]);}
function localLikesSave(arr){lsSet(LOCAL_LIKES_KEY,arr);}
function localLikesAdd(like){const a=localLikesAll();a.push(like);localLikesSave(a);}

/* ================= LIKE ================= */
async function handleLike(profile){
  if(state.busy) return;
  if(!state.user){showAuthOverlay();return;}
  if(!profile) return;
  const me=state.user;
  if(profile.user_id===me.user_id){toast('Нельзя лайкнуть себя','error');return;}
  const already=state.likes.filter(l=>l.from_user_id===me.user_id&&l.to_user_id===profile.user_id)[0];
  if(already){toast('Вы уже лайкнули','warn');return;}

  state.busy=true;
  setStatus('лайк…','loading');

  const localLike={
    Id:'local_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    from_user_id:me.user_id,to_user_id:profile.user_id,
    [FIELD_CREATED]:nowIso(),_local:true
  };
  state.likes.push(localLike);
  localLikesAdd(localLike);

  state.deckIndex++;
  render();
  toast('💜 Сигнал отправлен','success');
  setStatus('сохранено','ok');
  console.log('[LIKE] '+me.user_id+' → '+profile.user_id);

  syncLikeInBackground(localLike,profile);
  checkMutualInBackground(me,profile);

  state.busy=false;
}
async function syncLikeInBackground(localLike,profile){
  const body={from_user_id:localLike.from_user_id,to_user_id:localLike.to_user_id};
  try{
    const result=await dbInsert('likes',Object.assign({},body,{[FIELD_CREATED]:localLike[FIELD_CREATED]}));
    console.log('[SYNC] лайк сохранён:',result);
    setStatus('синхронизировано','ok');
    localLikesRemove(localLike.Id);
    if(result && result.Id) localLike.Id=result.Id;
    setTimeout(()=>refreshData().then(()=>render()),500);
  }catch(e){
    console.error('[SYNC] не удалось: '+e.message);
    setStatus('локально','err');
    toast('Сигнал сохранён локально. NocoDB недоступен.','warn');
  }
}
async function checkMutualInBackground(me,profile){
  try{
    const likes=await dbList('likes');
    const mutual=likes.filter(l=>l.from_user_id===profile.user_id&&l.to_user_id===me.user_id)[0];
    if(mutual){
      try{await dbInsert('matches',{user1_id:me.user_id,user2_id:profile.user_id,[FIELD_CREATED]:nowIso()});}
      catch(e){console.warn('match insert:',e.message);}
      const myLink=state.profile?profileLink(state.profile.profile_id):'';
      const theirLink=profileLink(profile.profile_id);
      if(me.telegram_chat_id){
        const k1='match_'+me.user_id+'_'+profile.user_id;
        if(!wasSent(k1)){markSent(k1);
          sendTelegramMessage(me.telegram_chat_id,'💜 Взаимный сигнал!\n\nОткрыть анкету: '+theirLink);}
      }
      const owner=await getUser(profile.user_id);
      if(owner && owner.telegram_chat_id){
        const k2='match_'+profile.user_id+'_'+me.user_id;
        if(!wasSent(k2)){markSent(k2);
          sendTelegramMessage(owner.telegram_chat_id,'💜 Взаимный сигнал!\n\nОткрыть анкету: '+(myLink||theirLink));}
      }
      showMatchModal(profile);
      await refreshData();render();
    }
  }catch(e){console.warn('[MUTUAL] '+e.message);}
}

async function sendTelegramMessage(chatId,text){

  if(!CONFIG.telegramBotToken) return null;
  try{
    const url='https://api.telegram.org/bot'+CONFIG.telegramBotToken+'/sendMessage';
    const res=await fetchWithTimeout(url,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:String(chatId),text:String(text)})
    },10000);
    const json=await res.json();
    if(!res.ok||json.ok===false) console.warn('[Telegram] '+JSON.stringify(json));
    else console.log('[Telegram] OK');
    return json;
  }catch(e){console.warn('[Telegram] '+e.message);return null;}

/* ================= SESSION ================= */
function saveSession(){lsSet(SESSION_KEY,{user:state.user,profile:state.profile,saved_at:nowIso()});}

async function refreshData(){
  const out={profiles:[],likes:[],matches:[]};
  try{out.profiles=await dbList('profiles');}catch(e){console.warn('profiles: '+e.message);}
  try{out.likes=await dbList('likes');}catch(e){console.warn('likes: '+e.message);}
  try{out.matches=await dbList('matches');}catch(e){console.warn('matches: '+e.message);}

  const localLikes=localLikesAll();
  const serverKeys=new Set(out.likes.map(l=>l.from_user_id+'|'+l.to_user_id));
  const pending=localLikes.filter(l=>!serverKeys.has(l.from_user_id+'|'+l.to_user_id));

  state.profiles=out.profiles.length?out.profiles:state.profiles;
  state.likes=out.likes.concat(pending);
  state.matches=out.matches;

  if(state.profile){
    const fresh=state.profiles.filter(p=>p.profile_id===state.profile.profile_id)[0];
    if(fresh){state.profile=fresh;saveSession();}
  }
  console.log('[DATA] профилей='+state.profiles.length+' лайков='+state.likes.length);
}

    }
  });

function fileToDataUrl(file,maxSize,quality){
  maxSize=maxSize||900;quality=quality||0.82;
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          let w=img.width,h=img.height;
          const sc=Math.min(1,maxSize/Math.max(w,h));
          w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',quality));
        }catch(e){resolve(r.result);}
      };
      img.onerror=()=>reject(new Error('Ошибка чтения'));
      img.src=r.result;
    };
    r.onerror=()=>reject(new Error('Ошибка файла'));
    r.readAsDataURL(file);
  });
}

async function copyMyLink(){
  if(!state.profile){toast('Сначала создайте анкету','warn');return;}
  const link=profileLink(state.profile.profile_id);
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(link);toast('📋 Скопировано','success');return;
    }
    throw new Error('no');
  }catch(e){
    const ta=document.createElement('textarea');ta.value=link;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('📋 Скопировано','success');}
    catch(err){toast('Ссылка: '+link,'info');}
    ta.remove();
  }
}

function viewLikes(){
  const me=state.user;if(!me) return '';
  const tab=state.likedTab;let items=[];
  if(tab==='incoming'){
    items=state.likes.filter(l=>l.to_user_id===me.user_id)
      .map(l=>({profile:profileByUserId(l.from_user_id),like:l}))
      .filter(x=>!!x.profile);
  }else if(tab==='outgoing'){
    items=state.likes.filter(l=>l.from_user_id===me.user_id)
      .map(l=>({profile:profileByUserId(l.to_user_id),like:l}))
      .filter(x=>!!x.profile);
  }else{
    items=state.matches.filter(m=>m.user1_id===me.user_id||m.user2_id===me.user_id)
      .map(m=>{const other=m.user1_id===me.user_id?m.user2_id:m.user1_id;
        return {profile:profileByUserId(other),match:m};})
      .filter(x=>!!x.profile);
  }
  const tabsHtml='<div class="tabs">'+
    '<button class="tab'+(tab==='incoming'?' active':'')+'" data-act="tab" data-tab="incoming" type="button">Мне сигналили</button>'+
    '<button class="tab'+(tab==='outgoing'?' active':'')+'" data-act="tab" data-tab="outgoing" type="button">Я сигналил</button>'+
    '<button class="tab'+(tab==='mutual'?' active':'')+'" data-act="tab" data-tab="mutual" type="button">Взаимные</button></div>';
  if(!items.length){
    const t={incoming:['📡','Пока нет сигналов','Поделитесь ссылкой на анкету.'],
      outgoing:['💜','Вы ещё никому не сигналили','Перейдите в «Знакомства».'],
      mutual:['💚','Взаимных пока нет','Когда совпадёт — появится здесь.']}[tab];
    return '<div class="list-scroll">'+tabsHtml+
      '<div class="empty"><div class="empty-icon">'+t[0]+'</div><h3>'+t[1]+'</h3><p>'+t[2]+'</p></div></div>';
  }
  const cards=items.map(it=>{
    const p=it.profile;let btn='';
    if(tab==='incoming') btn='<button data-act="like" data-uid="'+esc(p.user_id)+'" type="button">💜</button>';
    else if(tab==='outgoing') btn='<button data-act="unlike" data-uid="'+esc(p.user_id)+'" type="button">💔</button>';
    else btn='<button data-act="comment" data-uid="'+esc(p.user_id)+'" type="button">💬</button>';
    return '<div class="mini"><div class="mini-photo"><img src="'+esc(p.photo_url||svgPlaceholder(p.name))+'"></div>'+

      '<div class="mini-actions"><button data-act="open" data-pid="'+esc(p.profile_id)+'" type="button">👤</button>'+btn+'</div></div>';
  }).join('');
  return '<div class="list-scroll">'+tabsHtml+'<div class="grid">'+cards+'</div></div>';
}

function viewMatches(){
  const me=state.user;if(!me) return '';
  const items=state.matches.filter(m=>m.user1_id===me.user_id||m.user2_id===me.user_id)
    .map(m=>{const other=m.user1_id===me.user_id?m.user2_id:m.user1_id;
      return {profile:profileByUserId(other),match:m};})
    .filter(x=>!!x.profile);
  if(!items.length){
    return '<div class="list-scroll"><div class="empty"><div class="empty-icon">💜</div>'+
      '<h3>Взаимных пока нет</h3><p>Отправляйте сигналы — когда совпадёт, матч появится здесь.</p></div></div>';
  }
  const cards=items.map(it=>{
    const p=it.profile;
    return '<div class="mini"><div class="mini-photo"><img src="'+esc(p.photo_url||svgPlaceholder(p.name))+'"></div>'+
      '<div class="mini-body"><div class="mini-name">'+esc(p.name)+', '+esc(p.age)+'</div>'+
      '<div class="mini-city">📍 '+esc(p.city)+'</div></div>'+
      '<div class="mini-actions"><button data-act="open" data-pid="'+esc(p.profile_id)+'" type="button">👤</button>'+
      '<button data-act="comment" data-uid="'+esc(p.user_id)+'" type="button">💬</button></div></div>';
  }).join('');
  return '<div class="list-scroll"><div class="section-title">💜 Взаимные сигналы — '+items.length+'</div>'+
    '<div class="grid">'+cards+'</div></div>';
}

function viewMe(){
  const me=state.user;if(!me) return '';
  const p=state.profile;
  if(!p){
    return '<div class="list-scroll"><div class="empty"><div class="empty-icon">📝</div>'+
      '<h3>Анкеты пока нет</h3><p>Создайте анкету, чтобы вас могли найти.</p>'+
      '<button class="btn-primary" data-act="editProfile" type="button">Создать анкету</button></div></div>';
  }
  const likesR=state.likes.filter(l=>l.to_user_id===me.user_id).length;
  const likesG=state.likes.filter(l=>l.from_user_id===me.user_id).length;
  const mc=state.matches.filter(m=>m.user1_id===me.user_id||m.user2_id===me.user_id).length;
  const link=profileLink(p.profile_id);

  const chipCity=p.city?'<div class="chip">'+chipIcon('city')+esc(p.city)+'</div>':'';
  const chipAge=p.age?'<div class="chip">'+chipIcon('age')+esc(p.age)+' лет</div>':'';
  const chipGender=p.gender?'<div class="chip">'+chipIcon('gender')+esc(genderLabel(p.gender))+'</div>':'';
  const interests=p.interests?String(p.interests).split(',').map(s=>s.trim())
    .filter(s=>s.length).slice(0,5).map(t=>'<div class="chip">'+chipIcon('star')+esc(t)+'</div>').join(''):'';

  return '<div class="list-scroll"><div class="me-card">'+
    '<div class="me-photo"><img src="'+esc(p.photo_url||svgPlaceholder(p.name))+'"></div>'+
    '<div class="me-info"><h2>'+esc(p.name)+', '+esc(p.age)+'</h2>'+
      '<div class="chips-container" style="margin-top:10px;">'+chipCity+chipAge+chipGender+interests+'</div>'+
      (p.description?'<p class="desc">'+esc(p.description)+'</p>':'')+
      '<div style="margin-top:12px;font-size:12px;color:#5a5a66;word-break:break-all;">'+
        '🆔 '+esc(p.profile_id)+'<br>🔗 '+esc(link)+'</div></div>'+
    '<div class="stats"><div class="stat"><b>'+likesR+'</b><span>Сигналов получено</span></div>'+
      '<div class="stat"><b>'+mc+'</b><span>Взаимных</span></div></div>'+
    '<div class="stats" style="grid-template-columns:1fr;"><div class="stat"><b>'+likesG+'</b>'+
      '<span>Сигналов отправлено</span></div></div>'+
    '<div class="actions-col">'+
      '<button class="btn-primary" data-act="editProfile" type="button">✏️ Редактировать</button>'+
      '<button class="btn-ghost" data-act="copyLink" type="button">📋 Скопировать ссылку</button>'+
      '<button class="btn-ghost" data-act="openMine" type="button">🔗 Открыть анкету</button>'+
      '<button class="btn-ghost" data-act="logout" type="button">🚪 Выйти</button>'+
    '</div></div></div>';
}

function viewProfile(pid){
  const p=profileByProfileId(pid);
  if(!p){
    return '<div class="list-scroll"><div class="empty"><div class="empty-icon">🔍</div>'+
      '<h3>Анкета не найдена</h3><p>Возможно, ссылка неверна.</p>'+
      '<button class="btn-primary" data-act="goHome" type="button">На главную</button></div></div>';
  }
  const me=state.user;
  const isMine=me && p.user_id===me.user_id;
  const alreadyLiked=me && state.likes.some(l=>l.from_user_id===me.user_id&&l.to_user_id===p.user_id);
  let footer='';
  if(me && !isMine){
    footer='<footer class="actions-bar">'+
      '<button class="action-btn action-btn--no" data-act="goHome" type="button">←</button>'+
      '<button class="action-btn action-btn--comment" data-act="comment" data-uid="'+esc(p.user_id)+'" type="button">💬</button>'+
      (alreadyLiked
        ? '<button class="action-btn action-btn--no" data-act="unlike" data-uid="'+esc(p.user_id)+'" type="button">💔</button>'
        : '<button class="action-btn action-btn--yes" data-act="like" data-uid="'+esc(p.user_id)+'" type="button">💜</button>')+
      '</footer>';
  }
  const chipCity=p.city?'<div class="chip">'+chipIcon('city')+esc(p.city)+'</div>':'';
  const chipAge=p.age?'<div class="chip">'+chipIcon('age')+esc(p.age)+' лет</div>':'';
  const chipGender=p.gender?'<div class="chip">'+chipIcon('gender')+esc(genderLabel(p.gender))+'</div>':'';
  const chipLooking=p.looking_for&&p.looking_for!=='any'?'<div class="chip">'+chipIcon('looking')+esc(lookingLabel(p.looking_for))+'</div>':'';
  const interests=p.interests?String(p.interests).split(',').map(s=>s.trim())
    .filter(s=>s.length).slice(0,5).map(t=>'<div class="chip">'+chipIcon('star')+esc(t)+'</div>').join(''):'';
  const photo=p.photo_url||svgPlaceholder(p.name||'Фото');

  return '<div class="discover">'+
    '<section class="photos-grid">'+
      '<div class="photo-item photo-item--main" onclick="expandPhoto(this)"><img src="'+esc(photo)+'"></div>'+
      '<div class="photo-item" onclick="expandPhoto(this)"><img src="'+esc(photo)+'"></div>'+
      '<div class="photo-item" onclick="expandPhoto(this)"><img src="'+svgPlaceholder(p.city||'—','#241434')+'"></div>'+
    '</section>'+
    '<div class="info-wrapper"><div class="info-block">'+
      '<div class="name-row"><div class="name"><span>'+esc(p.name)+', <span class="age">'+esc(p.age)+'</span></span></div></div>'+
      '<div class="chips-container">'+chipCity+chipAge+chipGender+chipLooking+interests+'</div>'+
      (p.description?'<div class="bio-text">'+esc(p.description)+'</div>':'')+
      '<div style="margin-top:12px;font-size:12px;color:#5a5a66;">🆔 '+esc(p.profile_id)+'</div>'+
    '</div></div>'+footer+'</div>';
}

/* ================= RENDER ================= */
function render(){
  const main=document.getElementById('main');
  const nav=document.getElementById('bottomNav');

  if(!state.user && state.view!=='profile'){
    showAuthOverlay();main.innerHTML='';nav.style.display='none';return;
  }
  hideAuthOverlay();
  nav.style.display='grid';

  if(state.user && !state.profile && state.view!=='profile'){
    main.innerHTML='<div class="list-scroll"><div class="empty"><div class="empty-icon">📝</div>'+
      '<h3>Остался последний шаг</h3><p>Создайте анкету, чтобы вас могли найти другие.</p>'+
      '<button class="btn-primary" data-act="editProfile" type="button">Создать анкету</button></div></div>';
    updateNav();return;
  }

  if(state.view==='discover') main.innerHTML=viewDiscover();
  else if(state.view==='likes') main.innerHTML=viewLikes();
  else if(state.view==='matches') main.innerHTML=viewMatches();
  else if(state.view==='me') main.innerHTML=viewMe();
  else if(state.view==='profile') main.innerHTML=viewProfile(state.viewProfileId);
  else main.innerHTML=viewDiscover();

  updateNav();
}
function updateNav(){
  $$('#bottomNav .nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
}

/* ================= EVENTS ================= */
async function onMainClick(e){
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;
  console.log('[CLICK] '+act);

  if(act==='tab'){state.likedTab=el.dataset.tab||'incoming';render();return;}
  if(act==='goHome'){navigateTo('discover');return;}
  if(act==='open'){goToProfile(el.dataset.pid);return;}
  if(act==='comment'){const p=profileByUserId(el.dataset.uid);if(p) openCommentModal(p);return;}
  if(act==='skip'){state.deckIndex++;render();window.scrollTo(0,0);return;}
  if(act==='like'){
    if(!state.user){showAuthOverlay();return;}
    const p=profileByUserId(el.dataset.uid);
    if(!p){toast('Профиль не найден','error');return;}
    await handleLike(p);
    return;
  }
  if(act==='unlike'){const p=profileByUserId(el.dataset.uid);if(p) openUnlikeConfirm(p);return;}
  if(act==='editProfile'){openProfileEditor(false);return;}
  if(act==='copyLink'){copyMyLink();return;}
  if(act==='openMine'){if(state.profile) goToProfile(state.profile.profile_id);return;}
  if(act==='logout'){logout();return;}
}

/* ================= START ================= */
async function start(){
  loadSession();
  console.log('=== Secret Signal ===');
  console.log('DEMO_MODE='+DEMO_MODE);
  if(Object.keys(PLATFORM).length) console.log('PLATFORM:', PLATFORM);

  document.getElementById('main').addEventListener('click', function(e){
    onMainClick(e).catch(err=>{
      console.error('[UI] '+err.message);
      toast('Ошибка: '+err.message,'error');
    });
  });

  $$('#bottomNav .nav-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!state.user){showAuthOverlay();return;}
      navigateTo(btn.dataset.view);
    });
  });

  window.addEventListener('popstate',()=>{
    const r=getRoute();
    if(r.view==='profile'){state.view='profile';state.viewProfileId=r.profileId;}
    else{state.view=r.view;state.viewProfileId=null;}
    render();
  });

  setStatus('загрузка…','loading');
  await refreshData();
  if(state.nocoOnline) setStatus('готово','ok');
  else setStatus('локально','err');

  const route=getRoute();
  if(route.view==='profile'){state.view='profile';state.viewProfileId=route.profileId;}
  else{state.view=route.view;state.viewProfileId=null;}
  render();
  console.log('=== Secret Signal запущен ===');
}

document.addEventListener('DOMContentLoaded',()=>{
  start().catch(err=>{
    console.error('START FAILED: '+err.message);
    toast('Ошибка запуска: '+err.message,'error');
  });
});
</script>
